<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VROS — Swarm Robotics Engine</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#07070d;color:#e0e0e8}
#app{display:flex;flex-direction:column;height:100vh}
#topbar{display:flex;align-items:center;gap:8px;padding:6px 14px;background:#0e0e18;border-bottom:1px solid #1a1a28;flex-shrink:0;min-height:42px}
.back-btn{padding:3px 10px;border-radius:5px;border:1px solid #222230;background:#181824;color:#888;font-size:10px;cursor:pointer;text-decoration:none}
.back-btn:hover{color:#e0e0e8;border-color:#c84fc8}
.mod-title{font-size:13px;font-weight:700;color:#c84fc8;letter-spacing:1px}
#main{display:flex;flex:1;overflow:hidden}
#sb{width:200px;background:#0e0e18;border-right:1px solid #1a1a28;display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
#sb::-webkit-scrollbar{width:3px}#sb::-webkit-scrollbar-thumb{background:#1a1a28}
.ss{border-bottom:1px solid #141420;padding:8px 10px}
.st{font-size:9px;color:#444;text-transform:uppercase;letter-spacing:.9px;margin-bottom:6px;font-weight:600}
.row{display:flex;align-items:center;gap:5px;margin-bottom:5px;font-size:10px}
.row label{flex:1;color:#888}
.row input[type=range]{flex:1;height:3px;accent-color:#c84fc8;cursor:pointer}
.val{min-width:34px;text-align:right;font-size:9px;color:#c84fc8;font-family:monospace}
.btn{padding:3px 8px;border-radius:4px;border:1px solid #222230;background:#181824;color:#bbb;font-size:10px;cursor:pointer;transition:all .12s}
.btn:hover{background:#222;color:#fff}.btn.on{background:#c84fc8;color:#fff;border-color:#c84fc8}
.bg{display:flex;flex-wrap:wrap;gap:3px}
.ab{padding:3px 8px;border-radius:4px;border:1px solid #222;background:#181824;color:#666;font-size:9px;cursor:pointer;transition:all .12s}
.ab.active{background:#1a0a1e;color:#c84fc8;border-color:#c84fc8}
select{width:100%;background:#181824;color:#bbb;border:1px solid #222230;border-radius:4px;font-size:10px;padding:3px 5px;margin-bottom:4px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.sc{background:#181824;border-radius:4px;padding:3px 6px;border:1px solid #181830}
.sk{font-size:8px;color:#444}.sv{font-size:11px;font-weight:700;color:#e0e0e8;font-family:monospace}
#ca{flex:1;overflow:hidden}
#sim{display:block;width:100%;height:100%}
#statusbar{display:flex;background:#0e0e18;border-top:1px solid #1a1a28;flex-shrink:0;height:32px;align-items:center}
.sb-item{padding:0 12px;border-right:1px solid #141420;font-size:10px;color:#555;display:flex;align-items:center;gap:5px;height:100%}
.sb-item span{color:#c84fc8;font-family:monospace;font-weight:600}
</style>
</head>
<body>
<div id="app">
<div id="topbar">
  <a href="index.html" class="back-btn">← Home</a>
  <span class="mod-title">🐝 Swarm Robotics Engine</span>
</div>
<div id="main">
<div id="sb">
  <div class="ss"><div class="st">Swarm Size</div>
    <div class="bg">
      <button class="ab active" id="sw10" onclick="setSize(10)">10</button>
      <button class="ab" id="sw30" onclick="setSize(30)">30</button>
      <button class="ab" id="sw100" onclick="setSize(100)">100</button>
      <button class="ab" id="sw300" onclick="setSize(300)">300</button>
    </div>
  </div>
  <div class="ss"><div class="st">Behaviour</div>
    <select onchange="sw.mode=this.value">
      <option value="flock">Flocking (Reynolds)</option>
      <option value="leader">Leader-Follower</option>
      <option value="formation">Formation Grid</option>
      <option value="explore">Exploration</option>
      <option value="orbit">Orbital</option>
    </select>
  </div>
  <div class="ss"><div class="st">Reynolds Rules</div>
    <div class="row"><label>Separation</label><input type="range" min="0" max="5" step="0.1" value="1.5" oninput="sw.sep=+this.value;this.nextElementSibling.textContent=(+this.value).toFixed(1)"><span class="val">1.5</span></div>
    <div class="row"><label>Alignment</label><input type="range" min="0" max="5" step="0.1" value="1.0" oninput="sw.ali=+this.value;this.nextElementSibling.textContent=(+this.value).toFixed(1)"><span class="val">1.0</span></div>
    <div class="row"><label>Cohesion</label><input type="range" min="0" max="5" step="0.1" value="0.8" oninput="sw.coh=+this.value;this.nextElementSibling.textContent=(+this.value).toFixed(1)"><span class="val">0.8</span></div>
    <div class="row"><label>Max speed</label><input type="range" min="0.5" max="8" step="0.1" value="2.5" oninput="sw.maxspd=+this.value;this.nextElementSibling.textContent=(+this.value).toFixed(1)"><span class="val">2.5</span></div>
    <div class="row"><label>Perception R</label><input type="range" min="20" max="150" value="65" oninput="sw.pr=+this.value;this.nextElementSibling.textContent=this.value"><span class="val">65</span></div>
    <div class="row"><label>Sep radius</label><input type="range" min="5" max="40" value="22" oninput="sw.sr=+this.value;this.nextElementSibling.textContent=this.value"><span class="val">22</span></div>
  </div>
  <div class="ss"><div class="st">Obstacles</div>
    <div class="bg">
      <button class="btn" onclick="addObs()">+ Obstacle</button>
      <button class="btn" onclick="clearObs()">Clear Obs</button>
    </div>
    <div class="row" style="margin-top:4px"><label>Avoid strength</label><input type="range" min="0" max="5" step="0.1" value="2" oninput="sw.avoid=+this.value;this.nextElementSibling.textContent=(+this.value).toFixed(1)"><span class="val">2.0</span></div>
  </div>
  <div class="ss"><div class="st">Communication</div>
    <div class="row"><label>Show comm rings</label><input type="checkbox" onchange="sw.rings=this.checked"></div>
    <div class="row"><label>Packet loss %</label><input type="range" min="0" max="100" value="0" oninput="sw.loss=+this.value;this.nextElementSibling.textContent=this.value+'%'"><span class="val">0%</span></div>
  </div>
  <div class="ss"><div class="st">Display</div>
    <div class="row"><label>Velocity arrows</label><input type="checkbox" checked onchange="sw.vel=this.checked"></div>
    <div class="row"><label>Trails</label><input type="checkbox" onchange="sw.trails=this.checked"></div>
    <div class="row"><label>Density map</label><input type="checkbox" onchange="sw.density=this.checked"></div>
    <div class="row"><label>Colour by speed</label><input type="checkbox" onchange="sw.colorspd=this.checked"></div>
  </div>
  <div class="ss"><div class="st">Live Metrics</div>
    <div class="sg">
      <div class="sc"><div class="sk">Agents</div><div class="sv" id="m-n">0</div></div>
      <div class="sc"><div class="sk">Avg speed</div><div class="sv" id="m-spd">0</div></div>
      <div class="sc"><div class="sk">Cohesion</div><div class="sv" id="m-coh">0</div></div>
      <div class="sc"><div class="sk">FPS</div><div class="sv" id="m-fps">0</div></div>
    </div>
  </div>
  <div class="ss"><div class="st">Controls</div>
    <div class="bg">
      <button class="btn" id="pbtn" onclick="togglePause()">⏸ Pause</button>
      <button class="btn" onclick="initSwarm(sw.agents.length)">↺ Reset</button>
    </div>
    <div class="row" style="margin-top:4px"><label>Speed mult</label><input type="range" min="1" max="5" value="1" oninput="simSpd=+this.value;this.nextElementSibling.textContent=this.value+'x'"><span class="val">1x</span></div>
  </div>
</div>
<div id="ca"><canvas id="sim"></canvas></div>
</div>
<div id="statusbar">
  <div class="sb-item"><span class="sb-label">AGENTS</span>&nbsp;<span id="sb-n">0</span></div>
  <div class="sb-item"><span class="sb-label">MODE</span>&nbsp;<span id="sb-mode">Flocking</span></div>
  <div class="sb-item"><span class="sb-label">AVG SPD</span>&nbsp;<span id="sb-spd">0</span></div>
  <div class="sb-item" style="flex:1;text-align:right;justify-content:flex-end;border-right:none"><span class="sb-label">Click canvas → move target | VROS Swarm Engine v2.0</span></div>
</div>
</div>
<script>
const sim=document.getElementById('sim'),ctx=sim.getContext('2d');
let W,H,paused=false,simSpd=1,fps=0,fcnt=0,ft=0,lastT=0;
const sw={agents:[],mode:'flock',sep:1.5,ali:1.0,coh:0.8,maxspd:2.5,pr:65,sr:22,avoid:2,rings:false,vel:true,trails:false,density:false,colorspd:false,loss:0,target:{x:0,y:0},obstacles:[],trails_arr:[]};

function resize(){const ca=document.getElementById('ca');sim.width=ca.clientWidth;sim.height=ca.clientHeight;W=sim.width;H=sim.height;sw.target={x:W*.65,y:H*.4};}
window.addEventListener('resize',()=>{resize();});

function setSize(n){
  ['10','30','100','300'].forEach(s=>{const el=document.getElementById('sw'+s);if(el)el.classList.toggle('active',+s===n);});
  initSwarm(n);
}

function initSwarm(n){
  sw.agents=Array.from({length:n},(_,i)=>({x:W*.2+Math.random()*W*.6,y:H*.2+Math.random()*H*.6,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,lead:i===0,trail:[]}));
  sw.trails_arr=[];
  document.getElementById('m-n').textContent=n;document.getElementById('sb-n').textContent=n;
}

function addObs(){sw.obstacles.push({x:Math.random()*W*.8+W*.1,y:Math.random()*H*.8+H*.1,r:20+Math.random()*30});}
function clearObs(){sw.obstacles=[];}

function step(){
  const A=sw.agents,N=A.length;
  let totalSpd=0,cx=0,cy=0;
  A.forEach(a=>{totalSpd+=Math.sqrt(a.vx**2+a.vy**2);cx+=a.x;cy+=a.y;});
  const avgX=cx/N,avgY=cy/N;
  const cohDist=Math.sqrt((A.reduce((s,a)=>s+(a.x-avgX)**2+(a.y-avgY)**2,0)/N));
  document.getElementById('m-spd').textContent=(totalSpd/N).toFixed(1);document.getElementById('sb-spd').textContent=(totalSpd/N).toFixed(1);
  document.getElementById('m-coh').textContent=cohDist.toFixed(0);
  A.forEach((a,i)=>{
    const skip=Math.random()<sw.loss/100;
    let sx=0,sy=0,alx=0,aly=0,cox=0,coy=0,nc=0;
    if(!skip)A.forEach((b,j)=>{if(i===j)return;const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx**2+dy**2);if(d<sw.pr){nc++;alx+=b.vx;aly+=b.vy;cox+=b.x;coy+=b.y;}if(d<sw.sr&&d>0){sx-=dx/d;sy-=dy/d;}});
    let fx=0,fy=0;
    if(sx||sy){const m=Math.sqrt(sx**2+sy**2);fx+=(sx/m*sw.maxspd-a.vx)*sw.sep;fy+=(sy/m*sw.maxspd-a.vy)*sw.sep;}
    if(nc>0){alx/=nc;aly/=nc;const m=Math.sqrt(alx**2+aly**2)||1;fx+=(alx/m*sw.maxspd-a.vx)*sw.ali;fy+=(aly/m*sw.maxspd-a.vy)*sw.ali;cox/=nc;coy/=nc;const dx2=cox-a.x,dy2=coy-a.y,m2=Math.sqrt(dx2**2+dy2**2)||1;fx+=(dx2/m2*sw.maxspd-a.vx)*sw.coh;fy+=(dy2/m2*sw.maxspd-a.vy)*sw.coh;}
    // Obstacle avoidance
    sw.obstacles.forEach(o=>{const dx=a.x-o.x,dy=a.y-o.y,d=Math.sqrt(dx**2+dy**2);if(d<o.r+30&&d>0){const rep=sw.avoid*sw.maxspd*(o.r+30-d)/(o.r+30);fx+=dx/d*rep;fy+=dy/d*rep;}});
    // Target / behaviour
    if(sw.mode==='flock'||sw.mode==='explore'){const tdx=sw.target.x-a.x,tdy=sw.target.y-a.y,td=Math.sqrt(tdx**2+tdy**2)||1;if(td>15){fx+=(tdx/td*sw.maxspd-a.vx)*0.2;fy+=(tdy/td*sw.maxspd-a.vy)*0.2;}}
    else if(sw.mode==='leader'&&!a.lead){const l=A[0];const ldx=l.x-a.x,ldy=l.y-a.y,ld=Math.sqrt(ldx**2+ldy**2)||1;if(ld>20){fx+=(ldx/ld*sw.maxspd-a.vx)*0.45;fy+=(ldy/ld*sw.maxspd-a.vy)*0.45;}}
    else if(sw.mode==='leader'&&a.lead){const tdx=sw.target.x-a.x,tdy=sw.target.y-a.y,td=Math.sqrt(tdx**2+tdy**2)||1;fx+=(tdx/td*sw.maxspd-a.vx)*0.4;fy+=(tdy/td*sw.maxspd-a.vy)*0.4;}
    else if(sw.mode==='formation'){const cols=Math.ceil(Math.sqrt(N));const row=Math.floor(i/cols),col=i%cols;const gx=sw.target.x+(col-cols/2)*35,gy=sw.target.y+(row-Math.ceil(N/cols)/2)*35;const dx=gx-a.x,dy=gy-a.y,d=Math.sqrt(dx**2+dy**2)||1;fx+=(dx/d*sw.maxspd-a.vx)*0.5;fy+=(dy/d*sw.maxspd-a.vy)*0.5;}
    else if(sw.mode==='orbit'){const tdx=a.x-sw.target.x,tdy=a.y-sw.target.y,td=Math.sqrt(tdx**2+tdy**2)||1;const targetR=100;const radial=(td-targetR)/targetR;fx+=(-tdx/td*radial+(-tdy/td))*sw.maxspd*.3-a.vx*.1;fy+=(-tdy/td*radial+(tdx/td))*sw.maxspd*.3-a.vy*.1;}
    const fm=Math.sqrt(fx**2+fy**2);const mxF=0.15;if(fm>mxF){fx=fx/fm*mxF;fy=fy/fm*mxF;}
    a.vx+=fx;a.vy+=fy;const vm=Math.sqrt(a.vx**2+a.vy**2);if(vm>sw.maxspd){a.vx=a.vx/vm*sw.maxspd;a.vy=a.vy/vm*sw.maxspd;}
    if(a.x<10)a.vx+=0.3;if(a.x>W-10)a.vx-=0.3;if(a.y<10)a.vy+=0.3;if(a.y>H-10)a.vy-=0.3;
    a.x=Math.max(2,Math.min(W-2,a.x+a.vx));a.y=Math.max(2,Math.min(H-2,a.y+a.vy));
  });
  if(sw.trails){sw.agents.forEach(a=>sw.trails_arr.push({x:a.x,y:a.y,age:0,c:a.lead?'#eda100':'#c84fc8'}));sw.trails_arr.forEach(t=>t.age++);sw.trails_arr=sw.trails_arr.filter(t=>t.age<100);}
}

function draw(){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#07070d';ctx.fillRect(0,0,W,H);
  // Density map
  if(sw.density){const gs=40,cols2=Math.ceil(W/gs),rows=Math.ceil(H/gs);const grid=new Array(cols2*rows).fill(0);sw.agents.forEach(a=>{const gc=Math.floor(a.x/gs),gr=Math.floor(a.y/gs);if(gc>=0&&gc<cols2&&gr>=0&&gr<rows)grid[gr*cols2+gc]++;});const maxD=Math.max(...grid)||1;for(let r=0;r<rows;r++)for(let c=0;c<cols2;c++){const d=grid[r*cols2+c];if(d>0){ctx.fillStyle=`rgba(200,79,200,${d/maxD*0.25})`;ctx.fillRect(c*gs,r*gs,gs,gs);}}}
  // Trails
  if(sw.trails){sw.trails_arr.forEach(t=>{ctx.fillStyle=t.c.replace(')',`,${.08*(1-t.age/100)})`).replace('rgb','rgba');ctx.beginPath();ctx.arc(t.x,t.y,1.5,0,Math.PI*2);ctx.fill();});}
  // Obstacles
  sw.obstacles.forEach(o=>{ctx.strokeStyle='rgba(227,73,72,0.5)';ctx.lineWidth=2;ctx.fillStyle='rgba(227,73,72,0.1)';ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();ctx.stroke();});
  // Target
  ctx.strokeStyle='rgba(237,161,0,0.35)';ctx.lineWidth=1;for(let r=12;r<=55;r+=14){ctx.beginPath();ctx.arc(sw.target.x,sw.target.y,r,0,Math.PI*2);ctx.stroke();}
  ctx.fillStyle='#eda100';ctx.beginPath();ctx.arc(sw.target.x,sw.target.y,6,0,Math.PI*2);ctx.fill();
  // Agents
  sw.agents.forEach((a,i)=>{
    const ang=Math.atan2(a.vy,a.vx);const spd=Math.sqrt(a.vx**2+a.vy**2);
    if(sw.rings){ctx.strokeStyle='rgba(200,79,200,0.05)';ctx.lineWidth=.5;ctx.beginPath();ctx.arc(a.x,a.y,sw.sr,0,Math.PI*2);ctx.stroke();}
    ctx.save();ctx.translate(a.x,a.y);ctx.rotate(ang);
    const col=sw.colorspd?`hsl(${280-spd/sw.maxspd*120},70%,55%)`:a.lead?'#eda100':'#c84fc8';
    ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(-5,-3.5);ctx.lineTo(-5,3.5);ctx.closePath();ctx.fill();
    if(sw.vel){ctx.strokeStyle=col.replace(')',',0.35)').replace('rgb','rgba');ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(spd*8,0);ctx.stroke();}
    ctx.restore();
  });
  // HUD
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.font='9px monospace';ctx.fillText(`N=${sw.agents.length}  mode=${sw.mode}  Sep=${sw.sep.toFixed(1)} Ali=${sw.ali.toFixed(1)} Coh=${sw.coh.toFixed(1)}`,10,H-8);
}

sim.addEventListener('click',e=>{const r=sim.getBoundingClientRect();sw.target={x:e.clientX-r.left,y:e.clientY-r.top};});
sim.addEventListener('contextmenu',e=>{e.preventDefault();const r=sim.getBoundingClientRect();sw.obstacles.push({x:e.clientX-r.left,y:e.clientY-r.top,r:25});});

function togglePause(){paused=!paused;document.getElementById('pbtn').textContent=paused?'▶ Resume':'⏸ Pause';}
function loop(ts){requestAnimationFrame(loop);fcnt++;if(ts-ft>1000){fps=fcnt;fcnt=0;ft=ts;document.getElementById('m-fps').textContent=fps;}const dt=Math.min((ts-lastT)/1000,.05);lastT=ts;if(!paused){const s=simSpd||1;for(let i=0;i<s;i++)step();}draw();}
resize();initSwarm(10);requestAnimationFrame(loop);
</script>
</body></html>
