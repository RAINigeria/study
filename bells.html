dding: 32px;\n    flex: 1;\n    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05)\n    }\n.block-header-group {\n    display: flex;\n    align-items: center;\n    gap: 16px;\n    margin-bottom: 20px\n    }\n.icon-container-circle {\n    width: 50px;\n    height: 50px;\n    background-color: rgba(13, 148, 136, 0.1);\n    border-radius: 50%;\n    display: flex;\n    justify-content: center;\n    align-items: center;\n    color: var(--accent-teal);\n    font-size: 24px\n    }\n.block-title-text {\n    font-size: 24px;\n    font-weight: 700;\n    color: var(--primary-text)\n    }\n.list-container-wrapper {\n    list-style: none;\n    padding: 0\n    }\n.list-item-entry {\n    display: flex;\n    margin-bottom: 16px;\n    font-size: 18px;\n    line-height: 1.5;\n    color: #4B5563\n    }\n.list-item-marker {\n    color: var(--accent-teal);\n    margin-right: 12px;\n    margin-top: 4px;\n    font-size: 14px\n    }\n.technical-term-highlight {\n    font-family: \"Fira Code\", monospace;\n    background-color: #F1F5F9;\n    padding: 2px 6px;\n    border-radius: 4px;\n    font-size: 0.9em;\n    color: var(--accent-teal)\n    }\n.analogy-callout-box {\n    background-color: #F0FDFA;\n    border-left: 4px solid var(--accent-teal);\n    padding: 24px;\n    margin-top: 20px;\n    font-style: italic;\n    color: #134E4A;\n    font-size: 18px;\n    line-height: 1.6\n    }\n.visual-accent-nodes {\n    position: absolute;\n    bottom: -20px;\n    right: -20px;\n    opacity: 0.05;\n    font-size: 300px;\n    color: var(--accent-teal);\n    pointer-events: none\n    }\nhtml { overflow: hidden; }\n</style>\n</head>\n<body>\n<div class=\"slide-root-container\" style=\"overflow: hidden;\">\n<!-- Background Decoration -->\n<i class=\"fa-solid fa-shield-halved visual-accent-nodes\"></i>\n<!-- Title Region -->\n<div class=\"title-section-wrapper\">\n<span class=\"title-main-heading\">The Privacy Challenge in AI Training</span>\n<span class=\"title-sub-heading\">Module 1: Distributed Intelligence</span>\n</div>\n<!-- Main Content Layout -->\n<div class=\"main-content-layout\">\n<!-- Left Column: The Problem -->\n<div class=\"content-column-left\">\n<div class=\"privacy-info-block\">\n<div class=\"block-header-group\">\n<div class=\"icon-container-circle\">\n<i class=\"fa-solid fa-lock\"></i>\n</div>\n<h2 class=\"block-title-text\">The Centralization Dilemma</h2>\n</div>\n<ul class=\"list-container-wrapper\">\n<li class=\"list-item-entry\">\n<i class=\"fa-solid fa-circle-dot list-item-marker\"></i>\n<span>Traditional AI requires moving sensitive <span class=\"technical-term-highlight\">Raw Data</span> to a central cloud server for training.</span>\n</li>\n<li class=\"list-item-entry\">\n<i class=\"fa-solid fa-circle-dot list-item-marker\"></i>\n<span>Creates a massive &#34;honey pot&#34; for cyberattacks and unauthorized access.</span>\n</li>\n<li class=\"list-item-entry\">\n<i class=\"fa-solid fa-circle-dot list-item-marker\"></i>\n<span>Strict regulations like <span class=\"technical-term-highlight\">GDPR</span> and <span class=\"technical-term-highlight\">HIPAA</span> legally prohibit sharing personal user data.</span>\n</li>\n</ul>\n</div>\n</div>\n<!-- Right Column: The Requirement -->\n<div class=\"content-column-right\">\n<div class=\"privacy-info-block\">\n<div class=\"block-header-group\">\n<div class=\"icon-container-circle\">\n<i class=\"fa-solid fa-network-wired\"></i>\n</div>\n<h2 class=\"block-title-text\">The Training Requirement</h2>\n</div>\n<ul class=\"list-container-wrapper\">\n<li class=\"list-item-entry\">\n<i class=\"fa-solid fa-check list-item-marker\"></i>\n<span>Enable <span class=\"technical-term-highlight\">Collective Intelligence</span> without centralizing sensitive information.</span>\n</li>\n<li class=\"list-item-entry\">\n<i class=\"fa-solid fa-check list-item-marker\"></i>\n<span>Train models on data that is both private and physically distributed across billions of devices.</span>\n</li>\n</ul>\n<div class=\"analogy-callout-box\">\n                        &#34;The challenge is to gain the wisdom of the crowd without ever meeting the individuals in the crowd.&#34;\n                    </div>\n</div>\n</div>\n</div>\n</div>\n\n</body></html>", "<!DOCTYPE html><html lang=\"en\"><head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>Federated Learning Mechanism</title>\n<link href=\"https://fonts.googleapis.com\" rel=\"preconnect\"/>\n<link crossorigin=\"\" href=\"https://fonts.gstatic.com\" rel=\"preconnect\"/>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Fira+Code:wght@400;500&amp;display=swap\" rel=\"stylesheet\"/>\n<script src=\"https://picture-search.skywork.ai/aippt/static/tailwindcss.com\"><\/script><link href=\"https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css\" rel=\"stylesheet\"/><style>* {\n    margin: 0;\n    padding: 0;\n    box-sizing: border-box\n    }\nbody {width: 1280px; height: 720px; overflow: hidden; background: #888;\n    display: block}\n.slide-root {\n    width: 1280px;\n    height: 720px;\n    background-color: #F8F9FA;\n    font-family: \"Inter\", \"Segoe UI\", \"Roboto\", sans-serif;\n    color: #212529;\n    display: flex;\n    flex-direction: column\n    }\n.title-region {\n    display: flex;\n    flex-direction: column;\n    padding: 22px 48px 14px 42px;\n    border-left: 6px solid #0D9488;\n    margin: 24px 40px 0 40px\n    }\n.title-main-text {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 700;\n    font-size: 28px;\n    color: #212529;\n    line-height: 1.2\n    }\n.title-subtitle-text {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 400;\n    font-size: 14px;\n    color: #6B7280;\n    text-transform: uppercase;\n    letter-spacing: 1px;\n    margin-top: 4px\n    }\n.slide-main-content {\n    display: flex;\n    flex-direction: row;\n    gap: 20px;\n    padding: 10px 40px 20px 40px;\n    flex: 1;\n    align-items: stretch\n    }\n.left-column {\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    width: 38%;\n    gap: 12px\n    }\n.right-column {\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    width: 62%;\n    gap: 12px\n    }\n.fl-concept-card {\n    background-color: #FFF;\n    border: 1px solid #E5E7EB;\n    border-radius: 10px;\n    padding: 16px 18px;\n    border-left: 4px solid #0D9488\n    }\n.fl-concept-card-heading {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 700;\n    font-size: 13px;\n    color: #0D9488;\n    text-transform: uppercase;\n    letter-spacing: 0.8px;\n    margin-bottom: 8px;\n    display: flex;\n    align-items: center;\n    gap: 7px\n    }\n.fl-concept-card-body {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 400;\n    font-size: 13px;\n    color: #374151;\n    line-height: 1.55\n    }\n.fl-inversion-card {\n    background-color: #F0FDFA;\n    border: 1px solid #99F6E4;\n    border-radius: 10px;\n    padding: 14px 18px\n    }\n.fl-inversion-label {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 700;\n    font-size: 12px;\n    color: #0D9488;\n    text-transform: uppercase;\n    letter-spacing: 0.8px;\n    margin-bottom: 6px;\n    display: flex;\n    align-items: center;\n    gap: 6px\n    }\n.fl-inversion-row {\n    display: flex;\n    align-items: center;\n    gap: 8px\n    }\n.fl-inversion-old {\n    background-color: #FEE2E2;\n    border-radius: 6px;\n    padding: 6px 10px;\n    font-family: \"Inter\", sans-serif;\n    font-size: 12px;\n    font-weight: 600;\n    color: #991B1B;\n    white-space: nowrap\n    }\n.fl-inversion-arrow {\n    font-size: 14px;\n    color: #6B7280\n    }\n.fl-inversion-new {\n    background-color: #D1FAE5;\n    border-radius: 6px;\n    padding: 6px 10px;\n    font-family: \"Inter\", sans-serif;\n    font-size: 12px;\n    font-weight: 600;\n    color: #065F46;\n    white-space: nowrap\n    }\n.fl-steps-wrapper {\n    display: flex;\n    flex-direction: row;\n    gap: 10px;\n    align-items: stretch\n    }\n.fl-step-block {\n    flex: 1;\n    background-color: #FFF;\n    border: 1px solid #E5E7EB;\n    border-radius: 10px;\n    padding: 14px 12px;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    text-align: center;\n    gap: 8px\n    }\n.fl-step-icon-circle {\n    width: 38px;\n    height: 38px;\n    border-radius: 50%;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 16px;\n    flex-shrink: 0\n    }\n.fl-step-icon-circle.step-color-1 {\n    background-color: #EDE9FE;\n    color: #7C3AED\n    }\n.fl-step-icon-circle.step-color-2 {\n    background-color: #FEF3C7;\n    color: #D97706\n    }\n.fl-step-icon-circle.step-color-3 {\n    background-color: #DBEAFE;\n    color: #2563EB\n    }\n.fl-step-icon-circle.step-color-4 {\n    background-color: #D1FAE5;\n    color: #059669\n    }\n.fl-step-number {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 700;\n    font-size: 10px;\n    color: #9CA3AF;\n    text-transform: uppercase;\n    letter-spacing: 0.5px\n    }\n.fl-step-title {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 700;\n    font-size: 12px;\n    color: #212529;\n    line-height: 1.3\n    }\n.fl-step-desc {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 400;\n    font-size: 11px;\n    color: #6B7280;\n    line-height: 1.4\n    }\n.fl-step-tech {\n    font-family: \"Fira Code\", \"Courier New\", monospace;\n    font-size: 10px;\n    color: #0D9488;\n    background-color: #F0FDFA;\n    padding: 3px 7px;\n    border-radius: 4px;\n    margin-top: 2px\n    }\n.fl-challenges-card {\n    background-color: #FFF;\n    border: 1px solid #E5E7EB;\n    border-radius: 10px;\n    padding: 14px 18px;\n    border-left: 4px solid #7C3AED\n    }\n.fl-challenges-heading {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 700;\n    font-size: 12px;\n    color: #7C3AED;\n    text-transform: uppercase;\n    letter-spacing: 0.8px;\n    margin-bottom: 8px;\n    display: flex;\n    align-items: center;\n    gap: 6px\n    }\n.fl-challenges-list {\n    list-style: none;\n    display: flex;\n    flex-direction: row;\n    gap: 10px\n    }\n.fl-challenge-item {\n    flex: 1;\n    display: flex;\n    align-items: flex-start;\n    gap: 7px\n    }\n.fl-challenge-dot {\n    width: 6px;\n    height: 6px;\n    border-radius: 50%;\n    background-color: #7C3AED;\n    margin-top: 4px;\n    flex-shrink: 0\n    }\n.fl-challenge-text {\n    font-family: \"Inter\", sans-serif;\n    font-size: 12px;\n    color: #374151;\n    line-height: 1.4\n    }\n.fl-step-connector-row {\n    display: flex;\n    flex-direction: row;\n    align-items: center;\n    gap: 0;\n    width: 100%\n    }\n.fl-step-connector-arrow {\n    font-size: 13px;\n    color: #9CA3AF;\n    flex-shrink: 0;\n    padding: 0 2px;\n    align-self: center;\n    margin-top: -18px\n    }\nhtml { overflow: hidden; }\n</style>\n</head>\n<body>\n<div class=\"slide-root\" style=\"overflow: hidden;\">\n<div class=\"title-region\">\n<span class=\"title-main-text\">Federated Learning Mechanism</span>\n<span class=\"title-subtitle-text\">Module 3: Distributed Intelligence Without Centralized Data</span>\n</div>\n<div class=\"slide-main-content\">\n<!-- LEFT COLUMN -->\n<div class=\"left-column\">\n<div class=\"fl-concept-card\">\n<div class=\"fl-concept-card-heading\">\n<i class=\"fa-solid fa-circle-nodes\"></i> Core Idea\n        </div>\n<div class=\"fl-concept-card-body\">\n          Federated Learning <strong>inverts the traditional approach</strong>: instead of moving private data to a central server, the model travels to where the data lives. Only computed updates are returned \u2014 never the raw data itself.\n        </div>\n</div>\n<div class=\"fl-inversion-card\">\n<div class=\"fl-inversion-label\">\n<i class=\"fa-solid fa-arrows-left-right\"></i> The Key Inversion\n        </div>\n<div class=\"fl-inversion-row\">\n<div class=\"fl-inversion-old\"><i class=\"fa-solid fa-xmark\" style=\"margin-right:4px;\"></i>Data \u2192 Server</div>\n<div class=\"fl-inversion-arrow\"><i class=\"fa-solid fa-right-long\"></i></div>\n<div class=\"fl-inversion-new\"><i class=\"fa-solid fa-check\" style=\"margin-right:4px;\"></i>Model \u2192 Data</div>\n</div>\n</div>\n<div class=\"fl-challenges-card\">\n<div class=\"fl-challenges-heading\">\n<i class=\"fa-solid fa-triangle-exclamation\"></i> Known Challenges\n        </div>\n<ul class=\"fl-challenges-list\">\n<li class=\"fl-challenge-item\">\n<div class=\"fl-challenge-dot\"></div>\n<span class=\"fl-challenge-text\"><strong>Communication</strong> efficiency across many devices</span>\n</li>\n<li class=\"fl-challenge-item\">\n<div class=\"fl-challenge-dot\"></div>\n<span class=\"fl-challenge-text\"><strong>Adversarial</strong> participants sending corrupt updates</span>\n</li>\n<li class=\"fl-challenge-item\">\n<div class=\"fl-challenge-dot\"></div>\n<span class=\"fl-challenge-text\"><strong>Non-IID</strong> data distributions per participant</span>\n</li>\n</ul>\n</div>\n</div>\n<!-- RIGHT COLUMN -->\n<div class=\"right-column\">\n<div style=\"display:flex; flex-direction:row; align-items:center; gap:0;\">\n<div class=\"fl-steps-wrapper\" style=\"flex:1;\">\n<div class=\"fl-step-block\">\n<div class=\"fl-step-number\">Step 1</div>\n<div class=\"fl-step-icon-circle step-color-1\">\n<i class=\"fa-solid fa-paper-plane\"></i>\n</div>\n<div class=\"fl-step-title\">Distribute Global Model</div>\n<div class=\"fl-step-desc\">Central server sends the current global model to all participating devices or institutions.</div>\n<div class=\"fl-step-tech\">global_model \u2192 devices</div>\n</div>\n<div class=\"fl-step-connector-arrow\"><i class=\"fa-solid fa-chevron-right\"></i></div>\n<div class=\"fl-step-block\">\n<div class=\"fl-step-number\">Step 2</div>\n<div class=\"fl-step-icon-circle step-color-2\">\n<i class=\"fa-solid fa-microchip\"></i>\n</div>\n<div class=\"fl-step-title\">Local Training on Private Data</div>\n<div class=\"fl-step-desc\">Each device trains the model locally using its own private dataset. Raw data never leaves the device.</div>\n<div class=\"fl-step-tech\">train(local_data)</div>\n</div>\n<div class=\"fl-step-connector-arrow\"><i class=\"fa-solid fa-chevron-right\"></i></div>\n<div class=\"fl-step-block\">\n<div class=\"fl-step-number\">Step 3</div>\n<div class=\"fl-step-icon-circle step-color-3\">\n<i class=\"fa-solid fa-upload\"></i>\n</div>\n<div class=\"fl-step-title\">Upload Gradients Only</div>\n<div class=\"fl-step-desc\">Only the computed parameter updates (gradients) are sent back to the server \u2014 not the training data.</div>\n<div class=\"fl-step-tech\">send(gradients)</div>\n</div>\n<div class=\"fl-step-connector-arrow\"><i class=\"fa-solid fa-chevron-right\"></i></div>\n<div class=\"fl-step-block\">\n<div class=\"fl-step-number\">Step 4</div>\n<div class=\"fl-step-icon-circle step-color-4\">\n<i class=\"fa-solid fa-layer-group\"></i>\n</div>\n<div class=\"fl-step-title\">Aggregate &amp; Redistribute</div>\n<div class=\"fl-step-desc\">Server averages all updates into an improved global model and redistributes it for the next round.</div>\n<div class=\"fl-step-tech\">avg(all_gradients)</div>\n</div>\n</div>\n</div>\n<div style=\"display:flex; flex-direction:row; gap:12px; align-items:stretch;\">\n<div style=\"flex:1; background-color:#FFFFFF; border:1px solid #E5E7EB; border-radius:10px; padding:14px 16px; border-top: 3px solid #0D9488;\">\n<div style=\"font-family:&#39;Inter&#39;,sans-serif; font-weight:700; font-size:12px; color:#0D9488; text-transform:uppercase; letter-spacing:0.8px; margin-bottom:7px; display:flex; align-items:center; gap:6px;\">\n<i class=\"fa-solid fa-mobile-screen\"></i> Real-World Use Cases\n          </div>\n<div style=\"font-family:&#39;Inter&#39;,sans-serif; font-size:12px; color:#374151; line-height:1.5;\">\n<div style=\"display:flex; align-items:flex-start; gap:7px; margin-bottom:5px;\">\n<i class=\"fa-brands fa-google\" style=\"color:#EA580C; margin-top:2px; font-size:11px;\"></i>\n<span><strong>Google Android</strong> \u2014 keyboard autocomplete trained across millions of phones without uploading personal messages.</span>\n</div>\n<div style=\"display:flex; align-items:flex-start; gap:7px;\">\n<i class=\"fa-solid fa-hospital\" style=\"color:#7C3AED; margin-top:2px; font-size:11px;\"></i>\n<span><strong>Medical Diagnostics</strong> \u2014 hospitals collaboratively train diagnostic models without sharing patient records across institutions.</span>\n</div>\n</div>\n</div>\n<div style=\"flex:1; background-color:#FFF7ED; border:1px solid #FED7AA; border-radius:10px; padding:14px 16px; border-top: 3px solid #EA580C;\">\n<div style=\"font-family:&#39;Inter&#39;,sans-serif; font-weight:700; font-size:12px; color:#EA580C; text-transform:uppercase; letter-spacing:0.8px; margin-bottom:7px; display:flex; align-items:center; gap:6px;\">\n<i class=\"fa-solid fa-shield-halved\"></i> What Is Never Shared\n          </div>\n<div style=\"font-family:&#39;Inter&#39;,sans-serif; font-size:12px; color:#374151; line-height:1.5;\">\n<div style=\"display:flex; align-items:flex-start; gap:7px; margin-bottom:5px;\">\n<i class=\"fa-solid fa-lock\" style=\"color:#EA580C; margin-top:2px; font-size:11px;\"></i>\n<span><strong>Raw training data</strong> \u2014 stays entirely on the local device or institution at all times.</span>\n</div>\n<div style=\"display:flex; align-items:flex-start; gap:7px;\">\n<i class=\"fa-solid fa-user-secret\" style=\"color:#EA580C; margin-top:2px; font-size:11px;\"></i>\n<span><strong>Personal identifiers</strong> \u2014 no messages, images, or records transit the network to the server.</span>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n\n</body></html>", "<!DOCTYPE html><html lang=\"en\"><head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>Federated Learning Analogy</title>\n<link href=\"https://fonts.googleapis.com\" rel=\"preconnect\"/>\n<link crossorigin=\"\" href=\"https://fonts.gstatic.com\" rel=\"preconnect\"/>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Fira+Code&amp;display=swap\" rel=\"stylesheet\"/>\n<script src=\"https://picture-search.skywork.ai/aippt/static/tailwindcss.com\"><\/script><link href=\"https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css\" rel=\"stylesheet\"/><style>/* Global Styles */\n* {\n    box-sizing: border-box;\n    margin: 0 0;\n    padding: 0 0\n    }\nbody {width: 1280px; height: 720px; overflow: hidden; background-color: #F8F9FA;\n    font-family: \"Inter\", sans-serif;\n    color: #212529}\n/* Slide Root */\n.slide-main-canvas {\n    width: 1280px;\n    height: 720px;\n    padding: 32px 40px;\n    display: flex;\n    flex-direction: column;\n    background-color: #F8F9FA\n    }\n/* Title Section */\n.title-region-wrapper {\n    display: flex;\n    flex-direction: column;\n    padding: 16px 40px;\n    margin-bottom: 24px;\n    border-left: 6px solid #0D9488\n    }\n.title-text-main {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 700;\n    font-size: 28px;\n    color: #212529;\n    line-height: 1.2\n    }\n.title-text-sub {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 400;\n    font-size: 14px;\n    color: #6B7280;\n    text-transform: uppercase;\n    letter-spacing: 1px;\n    margin-top: 3px\n    }\n/* Content Layout */\n.main-content-wrapper {\n    display: flex;\n    gap: 32px 40px;\n    align-items: stretch;\n    flex: 1\n    }\n/* Left Column: The Narrative */\n.left-narrative-column {\n    flex: 1;\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    background-color: #FFF;\n    border: 1px solid #E5E7EB;\n    border-radius: 8px;\n    padding: 40px\n    }\n.analogy-quote-block {\n    font-style: italic;\n    font-size: 22px;\n    color: #0D9488;\n    line-height: 1.6;\n    margin-bottom: 24px;\n    position: relative\n    }\n.analogy-quote-block::before {\n    content: \"\uf10d\";\n    font-family: \"Font Awesome 6 Free\";\n    font-weight: 900;\n    font-size: 32px;\n    color: #E5E7EB;\n    margin-right: 15px\n    }\n.analogy-description-text {\n    font-size: 18px;\n    line-height: 1.6;\n    color: #4B5563\n    }\n/* Right Column: The Logic Mapping */\n.right-mapping-column {\n    flex: 1;\n    display: flex;\n    flex-direction: column;\n    gap: 16px 20px;\n    justify-content: center\n    }\n.mapping-card-item {\n    display: flex;\n    align-items: center;\n    background-color: #FFF;\n    border: 1px solid #E5E7EB;\n    border-radius: 8px;\n    padding: 16px 20px;\n    flex: 1\n    }\n.mapping-icon-box {\n    width: 60px;\n    height: 60px;\n    background-color: #F0FDFA;\n    border-radius: 50%;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    margin-right: 20px;\n    flex-shrink: 0\n    }\n.mapping-icon-box i {\n    font-size: 24px;\n    color: #0D9488\n    }\n.mapping-text-content {\n    display: flex;\n    flex-direction: column\n    }\n.mapping-label-analogy {\n    font-size: 14px;\n    color: #6B7280;\n    text-transform: uppercase;\n    font-weight: 700;\n    margin-bottom: 3px\n    }\n.mapping-label-tech {\n    font-family: \"Fira Code\", monospace;\n    font-size: 18px;\n    font-weight: 700;\n    color: #212529\n    }\n.mapping-detail-text {\n    font-size: 14px;\n    color: #4B5563;\n    margin-top: 3px\n    }\n/* Divider */\n.mapping-arrow-connector {\n    display: flex;\n    justify-content: center;\n    align-items: center;\n    color: #9CA3AF;\n    font-size: 14px\n    }\nhtml { overflow: hidden; }\n</style>\n</head>\n<body>\n<div class=\"slide-main-canvas\" style=\"overflow: hidden;\">\n<!-- Title Region -->\n<div class=\"title-region-wrapper\">\n<span class=\"title-text-main\">\n                Federated Learning Analogy: Hospitals improving a shared medical textbook by sharing editorial notes rather than private patient records.\n            </span>\n<span class=\"title-text-sub\">\n                Module 1: Distributed Intelligence &amp; Privacy\n            </span>\n</div>\n<!-- Main Content -->\n<div class=\"main-content-wrapper\">\n<!-- Left Column: The Narrative -->\n<div class=\"left-narrative-column\">\n<div class=\"analogy-quote-block\">\n                    Inverting the traditional approach\u2014sending the model to the data, rather than the data to the model.\n                </div>\n<div class=\"analogy-description-text\">\n                    Imagine multiple hospitals wanting to improve a universal medical textbook. Instead of sending sensitive patient records to a central publisher, each hospital studies its own local data, writes down <strong>editorial corrections (notes)</strong>, and sends only those notes to the publisher. \n                    <br/><br/>\n                    The publisher aggregates the notes into a new edition and redistributes it, ensuring collective intelligence while maintaining absolute patient privacy.\n                </div>\n</div>\n<!-- Right Column: The Technical Mapping -->\n<div class=\"right-mapping-column\">\n<!-- Mapping Item 1 -->\n<div class=\"mapping-card-item\">\n<div class=\"mapping-icon-box\">\n<i class=\"fas fa-hospital\"></i>\n</div>\n<div class=\"mapping-text-content\">\n<div class=\"mapping-label-analogy\">The Hospitals</div>\n<div class=\"mapping-label-tech\">Distributed Edge Devices</div>\n<div class=\"mapping-detail-text\">Smartphones, IoT nodes, or local institutional servers.</div>\n</div>\n</div>\n<!-- Mapping Item 2 -->\n<div class=\"mapping-card-item\">\n<div class=\"mapping-icon-box\">\n<i class=\"fas fa-book-medical\"></i>\n</div>\n<div class=\"mapping-text-content\">\n<div class=\"mapping-label-analogy\">The Medical Textbook</div>\n<div class=\"mapping-label-tech\">Global AI Model</div>\n<div class=\"mapping-detail-text\">The shared neural network weight parameters.</div>\n</div>\n</div>\n<!-- Mapping Item 3 -->\n<div class=\"mapping-card-item\">\n<div class=\"mapping-icon-box\">\n<i class=\"fas fa-pen-nib\"></i>\n</div>\n<div class=\"mapping-text-content\">\n<div class=\"mapping-label-analogy\">Editorial Notes</div>\n<div class=\"mapping-label-tech\">Gradient Updates</div>\n<div class=\"mapping-detail-text\">Computed parameter adjustments based on local data.</div>\n</div>\n</div>\n<!-- Mapping Item 4 -->\n<div class=\"mapping-card-item\">\n<div class=\"mapping-icon-box\">\n<i class=\"fas fa-print\"></i>\n</div>\n<div class=\"mapping-text-content\">\n<div class=\"mapping-label-analogy\">The Publisher</div>\n<div class=\"mapping-label-tech\">Central Aggregation Server</div>\n<div class=\"mapping-detail-text\">Averaging updates to create the improved global model.</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n\n</body></html>", "<!DOCTYPE html><html lang=\"en\"><head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=1280, initial-scale=1.0\" name=\"viewport\"/>\n<title>Real-World Federated Learning Examples</title>\n<link href=\"https://fonts.googleapis.com\" rel=\"preconnect\"/>\n<link crossorigin=\"\" href=\"https://fonts.gstatic.com\" rel=\"preconnect\"/>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Fira+Code&amp;display=swap\" rel=\"stylesheet\"/>\n<script src=\"https://picture-search.skywork.ai/aippt/static/tailwindcss.com\"><\/script><link href=\"https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css\" rel=\"stylesheet\"/><style>/* Base Canvas Styles */\nbody {width: 1280px; height: 720px; overflow: hidden; background-color: #F8F9FA;\n    display: flex;\n    justify-content: center;\n    align-items: center}\n.slide-main-canvas {\n    width: 1280px;\n    height: 720px;\n    background-color: #F8F9FA;\n    color: #212529;\n    font-family: \"Inter\", sans-serif;\n    display: flex;\n    flex-direction: column;\n    box-sizing: border-box;\n    position: relative\n    }\n/* Title Section */\n.title-section-container {\n    display: flex;\n    flex-direction: column;\n    padding: 40px 60px 20px 60px;\n    margin-bottom: 20px;\n    border-left: 6px solid #0D9488\n    }\n.title-main-text {\n    font-weight: 700;\n    font-size: 28px;\n    color: #212529;\n    line-height: 1.2\n    }\n.title-module-subtitle {\n    font-weight: 400;\n    font-size: 14px;\n    color: #6B7280;\n    text-transform: uppercase;\n    letter-spacing: 1px;\n    margin-top: 4px\n    }\n/* Content Layout */\n.content-layout-wrapper {\n    flex: 1;\n    padding: 0 60px 40px 60px;\n    display: flex;\n    flex-direction: column;\n    justify-content: center\n    }\n.example-grid-parent {\n    display: flex;\n    gap: 40px;\n    align-items: stretch;\n    width: 100%\n    }\n/* Columns and Cards */\n.left-example-column, .right-example-column {\n    flex: 1;\n    display: flex;\n    flex-direction: column;\n    justify-content: center\n    }\n.case-study-card {\n    background-color: #FFF;\n    border: 1px solid #E5E7EB;\n    border-radius: 8px;\n    padding: 30px;\n    display: flex;\n    flex-direction: column;\n    height: 100%;\n    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05)\n    }\n.card-header-block {\n    display: flex;\n    align-items: center;\n    margin-bottom: 20px;\n    gap: 15px\n    }\n.card-icon-frame {\n    background-color: rgba(13, 148, 136, 0.1);\n    color: #0D9488;\n    width: 50px;\n    height: 50px;\n    border-radius: 8px;\n    display: flex;\n    justify-content: center;\n    align-items: center;\n    font-size: 24px\n    }\n.card-title-text {\n    font-size: 22px;\n    font-weight: 700;\n    color: #212529\n    }\n.card-description-body {\n    font-size: 16px;\n    line-height: 1.6;\n    color: #4B5563\n    }\n.technical-term-code {\n    font-family: \"Fira Code\", monospace;\n    background-color: #F1F5F9;\n    padding: 2px 6px;\n    border-radius: 4px;\n    font-size: 14px;\n    color: #0D9488\n    }\n.bullet-list-container {\n    margin: 20px 0 0 0;\n    padding: 0;\n    list-style: none\n    }\n.bullet-list-item {\n    position: relative;\n    padding-left: 25px;\n    margin-bottom: 12px;\n    font-size: 15px;\n    color: #374151\n    }\n.bullet-list-item::before {\n    content: \"\uf00c\";\n    font-family: \"Font Awesome 6 Free\";\n    font-weight: 900;\n    position: absolute;\n    left: 0;\n    color: #0D9488;\n    font-size: 14px\n    }\n/* Footer Benefit Block */\n.privacy-highlight-block {\n    margin-top: 30px;\n    background-color: #F0FDFA;\n    border: 1px dashed #0D9488;\n    padding: 15px 25px;\n    border-radius: 6px;\n    text-align: center\n    }\n.privacy-benefit-text {\n    font-style: italic;\n    font-size: 15px;\n    color: #0D9488\n    }\nhtml { overflow: hidden; }\n</style>\n</head>\n<body>\n<div class=\"slide-main-canvas\" style=\"overflow: hidden;\">\n<!-- Title Section -->\n<div class=\"title-section-container\">\n<span class=\"title-main-text\">Real-World Federated Learning Examples</span>\n<span class=\"title-module-subtitle\">Module 1: Distributed Intelligence</span>\n</div>\n<!-- Main Content Layout -->\n<div class=\"content-layout-wrapper\">\n<div class=\"example-grid-parent\">\n<!-- Left Column: Consumer Application -->\n<div class=\"left-example-column\">\n<div class=\"case-study-card\">\n<div class=\"card-header-block\">\n<div class=\"card-icon-frame\">\n<i class=\"fas fa-keyboard\"></i>\n</div>\n<span class=\"card-title-text\">Smart Keyboards (Gboard)</span>\n</div>\n<div class=\"card-description-body\">\n                            Google uses FL to improve predictive text and autocomplete patterns across millions of Android devices.\n                        </div>\n<ul class=\"bullet-list-container\">\n<li class=\"bullet-list-item\">Local models learn from private chat history and typing habits.</li>\n<li class=\"bullet-list-item\">Only mathematical <span class=\"technical-term-code\">gradients</span> are sent to the central server.</li>\n<li class=\"bullet-list-item\">Sensitive text data never leaves the user&#39;s smartphone.</li>\n</ul>\n</div>\n</div>\n<!-- Right Column: Institutional Application -->\n<div class=\"right-example-column\">\n<div class=\"case-study-card\">\n<div class=\"card-header-block\">\n<div class=\"card-icon-frame\">\n<i class=\"fas fa-notes-medical\"></i>\n</div>\n<span class=\"card-title-text\">Medical Diagnostics</span>\n</div>\n<div class=\"card-description-body\">\n                            Hospitals collaborate to train high-accuracy diagnostic models for rare diseases or imaging analysis.\n                        </div>\n<ul class=\"bullet-list-container\">\n<li class=\"bullet-list-item\">Participating hospitals train models locally on private <span class=\"technical-term-code\">MRI/CT</span> scans.</li>\n<li class=\"bullet-list-item\">Shared &#34;editorial notes&#34; are aggregated to improve the global model.</li>\n<li class=\"bullet-list-item\">Ensures compliance with strict data privacy regulations like HIPAA/GDPR.</li>\n</ul>\n</div>\n</div>\n</div>\n<!-- Bottom Highlight Block -->\n<div class=\"privacy-highlight-block\">\n<span class=\"privacy-benefit-text\">\n<i class=\"fas fa-shield-halved\" style=\"margin-right: 8px;\"></i>\n<strong>Core Value:</strong> Collective intelligence is achieved through collaborative training without centralizing sensitive raw data.\n                </span>\n</div>\n</div>\n</div>\n\n</body></html>", "<!DOCTYPE html><html lang=\"en\"><head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>The Internet of Things Ecosystem</title>\n<link href=\"https://fonts.googleapis.com\" rel=\"preconnect\"/>\n<link crossorigin=\"\" href=\"https://fonts.gstatic.com\" rel=\"preconnect\"/>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Fira+Code&amp;display=swap\" rel=\"stylesheet\"/>\n<script src=\"https://picture-search.skywork.ai/aippt/static/tailwindcss.com\"><\/script><link href=\"https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css\" rel=\"stylesheet\"/><style>body {width: 1280px; height: 720px; overflow: hidden; background-color: #F8F9FA;\n    display: flex;\n    justify-content: center;\n    align-items: center}\n.iot-slide-root {\n    width: 1280px;\n    height: 720px;\n    background-color: #F8F9FA;\n    color: #212529;\n    font-family: \"Inter\", sans-serif;\n    display: flex;\n    flex-direction: column;\n    box-sizing: border-box;\n    border: 1px solid #E5E7EB\n    }\n.title-region-wrapper {\n    display: flex;\n    flex-direction: column;\n    padding: 40px 60px 20px 60px;\n    margin-bottom: 20px;\n    border-left: 8px solid #7C3AED;\n    background-color: transparent\n    }\n.title-main-heading {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 700;\n    font-size: 32px;\n    color: #212529;\n    line-height: 1.2\n    }\n.title-sub-heading {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 400;\n    font-size: 16px;\n    color: #6B7280;\n    text-transform: uppercase;\n    letter-spacing: 1.5px;\n    margin-top: 8px\n    }\n.iot-content-container {\n    display: flex;\n    flex-direction: row;\n    padding: 0 60px 40px 60px;\n    gap: 40px;\n    align-items: stretch;\n    flex: 1\n    }\n.iot-left-column {\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    width: 50%;\n    gap: 24px\n    }\n.iot-right-column {\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    width: 50%;\n    gap: 20px\n    }\n.iot-description-block {\n    background-color: #FFF;\n    padding: 30px;\n    border-radius: 8px;\n    border: 1px solid #E5E7EB;\n    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05)\n    }\n.iot-description-text {\n    font-size: 18px;\n    line-height: 1.6;\n    color: #374151;\n    margin-bottom: 20px\n    }\n.iot-description-highlight {\n    font-family: \"Fira Code\", monospace;\n    background-color: #F3F4F6;\n    padding: 2px 6px;\n    border-radius: 4px;\n    color: #7C3AED;\n    font-weight: 600\n    }\n.iot-profile-card {\n    display: flex;\n    align-items: center;\n    background-color: #FFF;\n    padding: 20px;\n    border-radius: 8px;\n    border: 1px solid #E5E7EB;\n    flex: 1\n    }\n.iot-icon-box {\n    width: 60px;\n    height: 60px;\n    background-color: #F5F3FF;\n    border-radius: 12px;\n    display: flex;\n    justify-content: center;\n    align-items: center;\n    margin-right: 20px;\n    color: #7C3AED;\n    font-size: 24px\n    }\n.iot-card-content {\n    display: flex;\n    flex-direction: column\n    }\n.iot-card-title {\n    font-weight: 700;\n    font-size: 18px;\n    color: #1F2937;\n    margin-bottom: 4px\n    }\n.iot-card-desc {\n    font-size: 14px;\n    color: #6B7280;\n    line-height: 1.4\n    }\n.iot-list-item {\n    list-style: none;\n    display: flex;\n    align-items: flex-start;\n    margin-bottom: 12px;\n    font-size: 16px\n    }\n.iot-list-bullet {\n    color: #7C3AED;\n    margin-right: 12px;\n    margin-top: 4px\n    }\nhtml { overflow: hidden; }\n</style>\n</head>\n<body>\n<div class=\"iot-slide-root\" style=\"overflow: hidden;\">\n<!-- Title Region -->\n<div class=\"title-region-wrapper\">\n<span class=\"title-main-heading\">The Internet of Things Ecosystem</span>\n<span class=\"title-sub-heading\">Module 2: IoT Connectivity &amp; Protocols</span>\n</div>\n<!-- Content Region -->\n<div class=\"iot-content-container\">\n<!-- Left Column: Context and Profile -->\n<div class=\"iot-left-column\">\n<div class=\"iot-description-block\">\n<p class=\"iot-description-text\">\n                        The Internet of Things (IoT) encompasses billions of physical devices\u2014sensors, actuators, and meters\u2014connected to digital networks.\n                    </p>\n<ul style=\"padding: 0; margin: 0;\">\n<li class=\"iot-list-item\">\n<i class=\"fa-solid fa-circle-check iot-list-bullet\"></i>\n<span>Radically different profile compared to conventional computing.</span>\n</li>\n<li class=\"iot-list-item\">\n<i class=\"fa-solid fa-check iot-list-bullet\"></i>\n<span>Operating for years without human intervention or maintenance.</span>\n</li>\n<li class=\"iot-list-item\">\n<i class=\"fa-solid fa-heart-circle-check iot-list-bullet\"></i>\n<span>Transmitting small data payloads infrequently over long periods.</span>\n</li>\n</ul>\n</div>\n</div>\n<!-- Right Column: Specific Characteristics -->\n<div class=\"iot-right-column\">\n<!-- Characteristic 1: Power -->\n<div class=\"iot-profile-card\">\n<div class=\"iot-icon-box\">\n<i class=\"fas fa-battery-half\"></i>\n</div>\n<div class=\"iot-card-content\">\n<div class=\"iot-card-title\">Power Constraints</div>\n<div class=\"iot-card-desc\">Primarily battery-powered; expected to survive 5-10 years on a single charge.</div>\n</div>\n</div>\n<!-- Characteristic 2: Memory -->\n<div class=\"iot-profile-card\">\n<div class=\"iot-icon-box\">\n<i class=\"fas fa-microchip\"></i>\n</div>\n<div class=\"iot-card-content\">\n<div class=\"iot-card-title\">Memory Limitations</div>\n<div class=\"iot-card-desc\">Devices often have <span class=\"iot-description-highlight\">kilobytes</span> rather than gigabytes of RAM.</div>\n</div>\n</div>\n<!-- Characteristic 3: Connectivity -->\n<div class=\"iot-profile-card\">\n<div class=\"iot-icon-box\">\n<i class=\"fas fa-wifi\"></i>\n</div>\n<div class=\"iot-card-content\">\n<div class=\"iot-card-title\">Protocol Inefficiency</div>\n<div class=\"iot-card-desc\">Standard protocols (TCP/HTTP) impose overhead that these devices cannot support.</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n\n</body></html>", "<!DOCTYPE html><html lang=\"en\"><head>\n<meta charset=\"utf-8\"/>\n<title>The Need for Lightweight Protocols</title>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Fira+Code&amp;display=swap\" rel=\"stylesheet\"/>\n<script src=\"https://picture-search.skywork.ai/aippt/static/tailwindcss.com\"><\/script><link href=\"https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css\" rel=\"stylesheet\"/><style>/* Base styles */\nbody {width: 1280px; height: 720px; overflow: hidden; background-color: #F8F9FA;\n    display: flex;\n    justify-content: center;\n    align-items: center}\n.slide-root-container {\n    width: 1280px;\n    height: 720px;\n    background-color: #F8F9FA;\n    position: relative;\n    display: flex;\n    flex-direction: column;\n    box-sizing: border-box\n    }\n/* Design Guide: Title Section */\n.title-section-header {\n    display: flex;\n    flex-direction: column;\n    padding: 20px 40px;\n    margin-top: 40px;\n    margin-left: 60px;\n    margin-bottom: 25px;\n    border-left: 6px solid #7C3AED;\n    /* Violet for IoT */\n    }\n.title-main-heading {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 700;\n    font-size: 28px;\n    color: #212529;\n    line-height: 1.2\n    }\n.title-sub-heading {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 400;\n    font-size: 14px;\n    color: #6B7280;\n    text-transform: uppercase;\n    letter-spacing: 1px;\n    margin-top: 4px\n    }\n/* Layout Grid */\n.main-content-layout {\n    display: flex;\n    flex-direction: row;\n    align-items: stretch;\n    gap: 30px;\n    padding: 0 60px;\n    flex: 1;\n    margin-bottom: 40px\n    }\n.left-column-protocols {\n    flex: 1;\n    display: flex;\n    flex-direction: column;\n    justify-content: center\n    }\n.right-column-constraints {\n    flex: 1;\n    display: flex;\n    flex-direction: column;\n    justify-content: center\n    }\n/* Content Blocks */\n.technical-card-item {\n    background-color: #FFF;\n    border: 1px solid #E5E7EB;\n    border-radius: 8px;\n    padding: 24px;\n    margin-bottom: 20px;\n    flex: 1\n    }\n.card-title-text {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 700;\n    font-size: 18px;\n    color: #7C3AED;\n    margin-bottom: 16px;\n    display: flex;\n    align-items: center;\n    gap: 12px\n    }\n.protocol-list-group {\n    list-style: none;\n    padding: 0;\n    margin: 0\n    }\n.protocol-list-row {\n    display: flex;\n    align-items: flex-start;\n    margin-bottom: 12px\n    }\n.icon-bullet-point {\n    color: #7C3AED;\n    font-size: 14px;\n    margin-top: 4px;\n    margin-right: 12px;\n    width: 20px;\n    text-align: center\n    }\n.list-content-wrapper {\n    font-family: \"Inter\", sans-serif;\n    font-size: 15px;\n    color: #4B5563;\n    line-height: 1.5\n    }\n.tech-spec-label {\n    font-family: \"Fira Code\", monospace;\n    font-size: 13px;\n    background-color: #F3F4F6;\n    padding: 2px 6px;\n    border-radius: 4px;\n    color: #1F2937\n    }\n/* Analogy Section */\n.analogy-highlight-box {\n    background-color: #F5F3FF;\n    border-left: 4px solid #7C3AED;\n    padding: 20px;\n    margin-top: 10px\n    }\n.analogy-text-content {\n    font-family: \"Inter\", sans-serif;\n    font-style: italic;\n    font-size: 15px;\n    color: #5B21B6;\n    line-height: 1.6\n    }\n.comparison-stat-grid {\n    display: grid;\n    grid-template-columns: repeat(2, 1fr);\n    gap: 15px;\n    margin-top: 10px\n    }\n.stat-display-item {\n    background-color: #FFF;\n    padding: 12px;\n    border: 1px dashed #7C3AED;\n    border-radius: 6px;\n    text-align: center\n    }\n.stat-value-text {\n    font-family: \"Fira Code\", monospace;\n    font-weight: 700;\n    font-size: 16px;\n    color: #212529\n    }\n.stat-label-text {\n    font-family: \"Inter\", sans-serif;\n    font-size: 11px;\n    color: #6B7280;\n    text-transform: uppercase;\n    margin-top: 4px\n    }\nhtml { overflow: hidden; }\n</style>\n</head>\n<body>\n<div class=\"slide-root-container\" style=\"overflow: hidden;\">\n<!-- Title Section -->\n<div class=\"title-section-header\">\n<span class=\"title-main-heading\">The Need for Lightweight Protocols</span>\n<span class=\"title-sub-heading\">Module 2: IoT Ecosystem &amp; Connectivity</span>\n</div>\n<!-- Main Content Layout -->\n<div class=\"main-content-layout\">\n<!-- Left Column: Standard Protocol Limitations -->\n<div class=\"left-column-protocols\">\n<div class=\"technical-card-item\">\n<div class=\"card-title-text\">\n<i class=\"fas fa-network-wired\"></i>\n                        Standard Web Protocol Overhead\n                    </div>\n<ul class=\"protocol-list-group\">\n<li class=\"protocol-list-row\">\n<i class=\"fas fa-handshake icon-bullet-point\"></i>\n<div class=\"list-content-wrapper\">\n<strong>TCP 3-Way Handshake:</strong> Requires multiple round-trips to establish a connection before any data flows, draining battery.\n                            </div>\n</li>\n<li class=\"protocol-list-row\">\n<i class=\"fas fa-file-code icon-bullet-point\"></i>\n<div class=\"list-content-wrapper\">\n<strong>Verbose Headers:</strong> <span class=\"tech-spec-label\">HTTP/1.1</span> headers can exceed 500 bytes for a simple 1-byte sensor reading.\n                            </div>\n</li>\n<li class=\"protocol-list-row\">\n<i class=\"fa-solid fa-circle-question icon-bullet-point\"></i>\n<div class=\"list-content-wrapper\">\n<strong>Keep-Alive Traffic:</strong> Persistent connections require &#34;heartbeat&#34; packets, preventing devices from entering deep sleep.\n                            </div>\n</li>\n</ul>\n<div class=\"comparison-stat-grid\">\n<div class=\"stat-display-item\">\n<div class=\"stat-value-text\">&gt; 100 Bytes</div>\n<div class=\"stat-label-text\">Min. HTTP Header</div>\n</div>\n<div class=\"stat-display-item\">\n<div class=\"stat-value-text\">TCP/IP Stack</div>\n<div class=\"stat-label-text\">High Memory Req.</div>\n</div>\n</div>\n</div>\n</div>\n<!-- Right Column: IoT Constraints -->\n<div class=\"right-column-constraints\">\n<div class=\"technical-card-item\">\n<div class=\"card-title-text\">\n<i class=\"fas fa-microchip\"></i>\n                        The Resource-Constrained Reality\n                    </div>\n<ul class=\"protocol-list-group\">\n<li class=\"protocol-list-row\">\n<i class=\"fas fa-memory icon-bullet-point\"></i>\n<div class=\"list-content-wrapper\">\n<strong>Memory Limits:</strong> Devices often have <span class=\"tech-spec-label\">&lt; 256KB RAM</span>, leaving no room for complex stateful stacks.\n                            </div>\n</li>\n<li class=\"protocol-list-row\">\n<i class=\"fas fa-battery-half icon-bullet-point\"></i>\n<div class=\"list-content-wrapper\">\n<strong>Power Envelope:</strong> Radios are the most power-hungry components; overhead translates directly to shorter lifespan.\n                            </div>\n</li>\n<li class=\"protocol-list-row\">\n<i class=\"fas fa-wifi icon-bullet-point\"></i>\n<div class=\"list-content-wrapper\">\n<strong>Intermittent Links:</strong> IoT devices wake up, transmit, and sleep. Re-establishing TCP every time is prohibitive.\n                            </div>\n</li>\n</ul>\n<div class=\"analogy-highlight-box\">\n<div class=\"analogy-text-content\">\n                            Standard internet protocols are like using a heavy freight truck to deliver a single postcard \u2014 the vehicle itself weighs more than the message and consumes massive fuel for a tiny delivery.\n                        </div>\n</div>\n</div>\n</div>\n</div>\n</div>\n\n</body></html>", "<!DOCTYPE html><html lang=\"en\"><head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>MQTT: Message Queuing Telemetry Transport</title>\n<link href=\"https://fonts.googleapis.com\" rel=\"preconnect\"/>\n<link crossorigin=\"\" href=\"https://fonts.gstatic.com\" rel=\"preconnect\"/>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Fira+Code:wght@400;500&amp;display=swap\" rel=\"stylesheet\"/>\n<script src=\"https://picture-search.skywork.ai/aippt/static/tailwindcss.com\"><\/script><link href=\"https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css\" rel=\"stylesheet\"/><style>:root {\n    --bg-global: #F8F9FA;\n    --primary-text: #212529;\n    --accent-iot: #7C3AED;\n    --card-bg: #FFF;\n    --card-border: #E5E7EB;\n    --sub-text: #6B7280\n    }\nbody {width: 1280px; height: 720px; overflow: hidden; background-color: var(--bg-global);\n    color: var(--primary-text);\n    font-family: \"Inter\", sans-serif}\n.slide-root-container {\n    width: 1280px;\n    height: 720px;\n    margin: 0;\n    padding: 0;\n    display: flex;\n    flex-direction: column;\n    box-sizing: border-box;\n    background-color: var(--bg-global)\n    }\n.title-section-wrapper {\n    display: flex;\n    flex-direction: column;\n    padding: 40px 60px 20px 60px;\n    margin-bottom: 10px;\n    border-left: 8px solid var(--accent-iot)\n    }\n.title-main-heading {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 700;\n    font-size: 32px;\n    color: var(--primary-text);\n    line-height: 1.2\n    }\n.title-module-label {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 400;\n    font-size: 16px;\n    color: var(--sub-text);\n    text-transform: uppercase;\n    letter-spacing: 1.5px;\n    margin-top: 6px\n    }\n.content-layout-grid {\n    display: flex;\n    flex-direction: row;\n    align-items: stretch;\n    gap: 30px;\n    padding: 0 60px 40px 60px;\n    flex: 1\n    }\n.content-column-left {\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    gap: 25px;\n    flex: 1\n    }\n.content-column-right {\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    gap: 25px;\n    flex: 1\n    }\n.info-card-block {\n    background-color: var(--card-bg);\n    border: 1px solid var(--card-border);\n    border-radius: 12px;\n    padding: 24px;\n    display: flex;\n    flex-direction: column;\n    gap: 12px;\n    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);\n    flex: 1\n    }\n.card-header-row {\n    display: flex;\n    align-items: center;\n    gap: 12px;\n    margin-bottom: 8px\n    }\n.card-icon-box {\n    color: var(--accent-iot);\n    font-size: 24px;\n    width: 32px;\n    text-align: center\n    }\n.card-title-text {\n    font-weight: 700;\n    font-size: 20px;\n    color: var(--primary-text)\n    }\n.card-body-text {\n    font-size: 16px;\n    line-height: 1.6;\n    color: var(--primary-text)\n    }\n.technical-spec-code {\n    font-family: \"Fira Code\", monospace;\n    background-color: #F3F4F6;\n    padding: 4px 8px;\n    border-radius: 4px;\n    font-size: 15px;\n    color: var(--accent-iot)\n    }\n.analogy-highlight-box {\n    font-style: italic;\n    border-left: 4px solid var(--accent-iot);\n    padding-left: 20px;\n    margin: 10px 0;\n    color: var(--sub-text);\n    font-size: 18px;\n    line-height: 1.5\n    }\n.bullet-list-container {\n    list-style: none;\n    padding: 0;\n    margin: 0\n    }\n.bullet-item-wrapper {\n    display: flex;\n    align-items: flex-start;\n    gap: 10px;\n    margin-bottom: 8px;\n    font-size: 15px\n    }\n.bullet-marker-icon {\n    color: var(--accent-iot);\n    font-size: 12px;\n    margin-top: 6px\n    }\nhtml { overflow: hidden; }\n</style>\n</head>\n<body>\n<div class=\"slide-root-container\" style=\"overflow: hidden;\">\n<!-- Title Section -->\n<div class=\"title-section-wrapper\">\n<span class=\"title-main-heading\">\n                MQTT: Message Queuing Telemetry Transport\n            </span>\n<span class=\"title-module-label\">\n                Module 2: IoT Ecosystem &amp; Protocols\n            </span>\n</div>\n<!-- Content Grid -->\n<div class=\"content-layout-grid\">\n<!-- Left Column: Technical Foundations -->\n<div class=\"content-column-left\">\n<div class=\"info-card-block\">\n<div class=\"card-header-row\">\n<i class=\"fa-solid fa-network-wired card-icon-box\"></i>\n<span class=\"card-title-text\">Protocol Architecture</span>\n</div>\n<div class=\"card-body-text\">\n                        A <span class=\"technical-spec-code\">publish-subscribe</span> messaging protocol designed for high-latency, unreliable, or bandwidth-constrained networks.\n                    </div>\n<ul class=\"bullet-list-container\">\n<li class=\"bullet-item-wrapper\">\n<i class=\"fa-solid fa-circle bullet-marker-icon\"></i>\n<span><b>Broker-Centric:</b> A central server mediates all messages.</span>\n</li>\n<li class=\"bullet-item-wrapper\">\n<i class=\"fa-solid fa-circle bullet-marker-icon\"></i>\n<span><b>Decoupled:</b> Senders (Publishers) and Receivers (Subscribers) never interact directly.</span>\n</li>\n<li class=\"bullet-item-wrapper\">\n<i class=\"fa-solid fa-circle bullet-marker-icon\"></i>\n<span><b>Transport:</b> Operates over <span class=\"technical-spec-code\">TCP/IP</span> for reliable delivery.</span>\n</li>\n</ul>\n</div>\n<div class=\"info-card-block\">\n<div class=\"card-header-row\">\n<i class=\"fa-solid fa-microchip card-icon-box\"></i>\n<span class=\"card-title-text\">Extreme Efficiency</span>\n</div>\n<div class=\"card-body-text\">\n                        Optimized for battery-powered sensors with minimal processing capabilities.\n                    </div>\n<ul class=\"bullet-list-container\">\n<li class=\"bullet-item-wrapper\">\n<i class=\"fa-solid fa-check bullet-marker-icon\"></i>\n<span><b>Minimal Overhead:</b> Header size can be as small as <span class=\"technical-spec-code\">2 bytes</span>.</span>\n</li>\n<li class=\"bullet-item-wrapper\">\n<i class=\"fa-solid fa-check bullet-marker-icon\"></i>\n<span><b>Legacy:</b> Developed in 1999 to monitor oil pipelines via satellite.</span>\n</li>\n</ul>\n</div>\n</div>\n<!-- Right Column: Analogy and Applications -->\n<div class=\"content-column-right\">\n<div class=\"info-card-block\">\n<div class=\"card-header-row\">\n<i class=\"fa-solid fa-lightbulb card-icon-box\"></i>\n<span class=\"card-title-text\">The &#34;Notice Board&#34; Analogy</span>\n</div>\n<div class=\"analogy-highlight-box\">\n                        &#34;Sensors post their readings in labeled slots on a public notice board. Any interested party walks up and reads only the slots relevant to them\u2014no direct phone call between the sender and receiver is required.&#34;\n                    </div>\n<div class=\"card-body-text\" style=\"font-size: 14px; color: var(--sub-text);\">\n                        This decoupling allows thousands of sensors to broadcast data without knowing who or what is consuming it.\n                    </div>\n</div>\n<div class=\"info-card-block\">\n<div class=\"card-header-row\">\n<i class=\"fa-solid fa-industry card-icon-box\"></i>\n<span class=\"card-title-text\">Modern Use Cases</span>\n</div>\n<div class=\"card-body-text\">\n                        The de facto standard for IoT data collection across industries:\n                    </div>\n<ul class=\"bullet-list-container\">\n<li class=\"bullet-item-wrapper\">\n<i class=\"fa-solid fa-car bullet-marker-icon\"></i>\n<span><b>Connected Vehicles:</b> Real-time telematics and status updates.</span>\n</li>\n<li class=\"bullet-item-wrapper\">\n<i class=\"fa-solid fa-building-user bullet-marker-icon\"></i>\n<span><b>Smart Buildings:</b> HVAC and lighting control systems.</span>\n</li>\n<li class=\"bullet-item-wrapper\">\n<i class=\"fa-solid fa-oil-well bullet-marker-icon\"></i>\n<span><b>Industrial Automation:</b> Remote pipeline and grid monitoring.</span>\n</li>\n</ul>\n</div>\n</div>\n</div>\n</div>\n\n</body></html>", "<!DOCTYPE html><html lang=\"en\"><head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>CoAP: Constrained Application Protocol</title>\n<link href=\"https://fonts.googleapis.com\" rel=\"preconnect\"/>\n<link crossorigin=\"\" href=\"https://fonts.gstatic.com\" rel=\"preconnect\"/>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Fira+Code&amp;display=swap\" rel=\"stylesheet\"/>\n<script src=\"https://picture-search.skywork.ai/aippt/static/tailwindcss.com\"><\/script><link href=\"https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css\" rel=\"stylesheet\"/><style>* {\n    margin: 0;\n    padding: 0;\n    box-sizing: border-box\n    }\nbody {width: 1280px; height: 720px; overflow: hidden; background-color: #F8F9FA;\n    font-family: \"Inter\", sans-serif;\n    color: #212529}\n.slide-root-container {\n    width: 1280px;\n    height: 720px;\n    background-color: #F8F9FA;\n    display: flex;\n    flex-direction: column;\n    position: relative\n    }\n/* Title Section following <DESIGN> */\n.title-section-wrapper {\n    display: flex;\n    flex-direction: column;\n    padding: 40px 60px 20px 60px;\n    margin-bottom: 10px;\n    border-left: 6px solid #7C3AED;\n    /* Violet for IoT Module */\n    }\n.title-main-heading {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 700;\n    font-size: 28px;\n    color: #212529;\n    line-height: 1.2\n    }\n.title-sub-label {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 400;\n    font-size: 14px;\n    color: #6B7280;\n    text-transform: uppercase;\n    letter-spacing: 1px;\n    margin-top: 4px\n    }\n/* Main Content Layout */\n.main-content-grid {\n    display: flex;\n    flex: 1;\n    padding: 0 60px 40px 60px;\n    gap: 30px;\n    align-items: stretch\n    }\n.left-tech-column {\n    flex: 1;\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    gap: 20px\n    }\n.right-analogy-column {\n    flex: 1;\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    gap: 20px\n    }\n/* Card Styles */\n.feature-card-item {\n    background-color: #FFF;\n    border: 1px solid #E5E7EB;\n    border-radius: 8px;\n    padding: 24px;\n    display: flex;\n    flex-direction: column;\n    gap: 15px;\n    flex: 1\n    }\n.card-header-group {\n    display: flex;\n    align-items: center;\n    gap: 12px\n    }\n.card-icon-box {\n    width: 40px;\n    height: 40px;\n    background-color: #F5F3FF;\n    color: #7C3AED;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    border-radius: 6px;\n    font-size: 20px\n    }\n.card-title-text {\n    font-weight: 700;\n    font-size: 18px;\n    color: #212529\n    }\n.tech-spec-list {\n    list-style: none;\n    display: flex;\n    flex-direction: column;\n    gap: 10px\n    }\n.tech-spec-item {\n    font-size: 15px;\n    line-height: 1.5;\n    display: flex;\n    align-items: flex-start;\n    gap: 10px\n    }\n.tech-spec-item i {\n    color: #7C3AED;\n    margin-top: 4px;\n    font-size: 12px\n    }\n.mono-text-value {\n    font-family: \"Fira Code\", monospace;\n    background-color: #F3F4F6;\n    padding: 2px 6px;\n    border-radius: 4px;\n    font-size: 14px\n    }\n/* Analogy & Quote Blocks */\n.analogy-quote-block {\n    background-color: #F5F3FF;\n    border-left: 4px solid #7C3AED;\n    padding: 20px;\n    font-style: italic;\n    color: #4B5563;\n    line-height: 1.6;\n    font-size: 16px\n    }\n.application-grid-box {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 12px\n    }\n.app-tag-item {\n    background-color: #FFF;\n    border: 1px solid #E5E7EB;\n    padding: 12px;\n    border-radius: 6px;\n    font-size: 14px;\n    display: flex;\n    align-items: center;\n    gap: 8px\n    }\n.app-tag-item i {\n    color: #7C3AED\n    }\n/* REST Methods Visualizer */\n.rest-methods-container {\n    display: flex;\n    gap: 10px;\n    margin-top: 10px\n    }\n.method-badge-pill {\n    font-family: \"Fira Code\", monospace;\n    font-size: 12px;\n    padding: 4px 8px;\n    border-radius: 4px;\n    font-weight: 700\n    }\n.get-pill {\n    background-color: #DBEAFE;\n    color: #1E40AF\n    }\n.put-pill {\n    background-color: #FEF3C7;\n    color: #92400E\n    }\n.post-pill {\n    background-color: #D1FAE5;\n    color: #065F46\n    }\n.del-pill {\n    background-color: #FEE2E2;\n    color: #991B1B\n    }\nhtml { overflow: hidden; }\n</style>\n</head>\n<body>\n<div class=\"slide-root-container\" style=\"overflow: hidden;\">\n<!-- Header -->\n<div class=\"title-section-wrapper\">\n<span class=\"title-main-heading\">CoAP: Constrained Application Protocol</span>\n<span class=\"title-sub-label\">Module 2: IoT Ecosystems &amp; Protocols</span>\n</div>\n<!-- Main Body -->\n<div class=\"main-content-grid\">\n<!-- Left Column: Technical Definition -->\n<div class=\"left-tech-column\">\n<div class=\"feature-card-item\">\n<div class=\"card-header-group\">\n<div class=\"card-icon-box\">\n<i class=\"fas fa-network-wired\"></i>\n</div>\n<span class=\"card-title-text\">Protocol Architecture</span>\n</div>\n<ul class=\"tech-spec-list\">\n<li class=\"tech-spec-item\">\n<i class=\"fas fa-circle\"></i>\n<span>A request-response protocol modeled on HTTP but designed for constrained devices with limited RAM.</span>\n</li>\n<li class=\"tech-spec-item\">\n<i class=\"fas fa-circle\"></i>\n<span>Uses <span class=\"mono-text-value\">UDP</span> instead of TCP, providing a stateless, connectionless environment with minimal overhead.</span>\n</li>\n<li class=\"tech-spec-item\">\n<i class=\"fas fa-circle\"></i>\n<span>Extremely compact message format with headers as small as <span class=\"mono-text-value\">4 bytes</span>.</span>\n</li>\n</ul>\n</div>\n<div class=\"feature-card-item\">\n<div class=\"card-header-group\">\n<div class=\"card-icon-box\">\n<i class=\"fa-solid fa-star\"></i>\n</div>\n<span class=\"card-title-text\">RESTful Semantics</span>\n</div>\n<p style=\"font-size: 15px; color: #4B5563;\">Naturally maps to web services, allowing devices to expose resources as URI endpoints.</p>\n<div class=\"rest-methods-container\">\n<span class=\"method-badge-pill get-pill\">GET</span>\n<span class=\"method-badge-pill put-pill\">PUT</span>\n<span class=\"method-badge-pill post-pill\">POST</span>\n<span class=\"method-badge-pill del-pill\">DELETE</span>\n</div>\n</div>\n</div>\n<!-- Right Column: Analogy and Applications -->\n<div class=\"right-analogy-column\">\n<div class=\"feature-card-item\">\n<div class=\"card-header-group\">\n<div class=\"card-icon-box\">\n<i class=\"fas fa-lightbulb\"></i>\n</div>\n<span class=\"card-title-text\">Concept Analogy</span>\n</div>\n<div class=\"analogy-quote-block\">\n                        &#34;A stripped-down version of web browsing \u2014 request and response, but reduced to the absolute minimum for devices with only kilobytes of RAM and no TCP/IP stack.&#34;\n                    </div>\n</div>\n<div class=\"feature-card-item\">\n<div class=\"card-header-group\">\n<div class=\"card-icon-box\">\n<i class=\"fas fa-microchip\"></i>\n</div>\n<span class=\"card-title-text\">Primary Applications</span>\n</div>\n<div class=\"application-grid-box\">\n<div class=\"app-tag-item\">\n<i class=\"fas fa-bolt\"></i>\n<span>Smart Energy Metering</span>\n</div>\n<div class=\"app-tag-item\">\n<i class=\"fas fa-building\"></i>\n<span>Building Automation</span>\n</div>\n<div class=\"app-tag-item\">\n<i class=\"fa-solid fa-heart\"></i>\n<span>Healthcare Monitoring</span>\n</div>\n<div class=\"app-tag-item\">\n<i class=\"fas fa-satellite-dish\"></i>\n<span>Query-based Sensing</span>\n</div>\n</div>\n<p style=\"font-size: 13px; color: #6B7280; margin-top: 10px;\">\n                        Ideal for scenarios where a device needs to respond to specific queries rather than streaming data continuously.\n                    </p>\n</div>\n</div>\n</div>\n</div>\n\n</body></html>", "<!DOCTYPE html><html lang=\"en\"><head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>LoRaWAN: Long Range Wide Area Network</title>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Fira+Code&amp;display=swap\" rel=\"stylesheet\"/>\n<script src=\"https://picture-search.skywork.ai/aippt/static/tailwindcss.com\"><\/script><link href=\"https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css\" rel=\"stylesheet\"/><style>body {width: 1280px; height: 720px; overflow: hidden; background-color: #F8F9FA;\n    font-family: \"Inter\", sans-serif}\n.lorawan-slide-root {\n    width: 1280px;\n    height: 720px;\n    background-color: #F8F9FA;\n    display: flex;\n    flex-direction: column;\n    position: relative\n    }\n.title-region-container {\n    display: flex;\n    flex-direction: column;\n    padding: 20px 40px;\n    margin-top: 40px;\n    margin-left: 60px;\n    margin-bottom: 30px;\n    border-left: 6px solid #7C3AED\n    }\n.title-main-text {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 700;\n    font-size: 28px;\n    color: #212529;\n    line-height: 1.2\n    }\n.title-sub-text {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 400;\n    font-size: 14px;\n    color: #6B7280;\n    text-transform: uppercase;\n    letter-spacing: 1px;\n    margin-top: 4px\n    }\n.lorawan-content-layout {\n    display: flex;\n    align-items: stretch;\n    gap: 40px;\n    padding: 0 60px;\n    flex: 1;\n    margin-bottom: 40px\n    }\n.lorawan-left-column, .lorawan-right-column {\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    flex: 1;\n    gap: 24px\n    }\n.lorawan-info-card {\n    background-color: #FFF;\n    border: 1px solid #E5E7EB;\n    border-radius: 8px;\n    padding: 30px;\n    flex: 1;\n    display: flex;\n    flex-direction: column;\n    justify-content: center\n    }\n.lorawan-spec-item {\n    display: flex;\n    align-items: flex-start;\n    margin-bottom: 20px;\n    list-style: none\n    }\n.lorawan-spec-icon {\n    width: 40px;\n    height: 40px;\n    background-color: rgba(124, 58, 237, 0.1);\n    border-radius: 6px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    margin-right: 16px;\n    color: #7C3AED;\n    font-size: 18px\n    }\n.lorawan-spec-content {\n    flex: 1\n    }\n.lorawan-spec-label {\n    font-size: 14px;\n    font-weight: 700;\n    color: #4B5563;\n    margin-bottom: 4px\n    }\n.lorawan-spec-value {\n    font-family: \"Fira Code\", monospace;\n    font-size: 16px;\n    color: #111827\n    }\n.lorawan-analogy-block {\n    background-color: #F3F4F6;\n    border-left: 4px solid #7C3AED;\n    padding: 24px;\n    border-radius: 0 8px 8px 0\n    }\n.lorawan-analogy-text {\n    font-style: italic;\n    font-size: 18px;\n    line-height: 1.6;\n    color: #374151;\n    margin: 0\n    }\n.lorawan-analogy-caption {\n    display: block;\n    margin-top: 12px;\n    font-weight: 700;\n    color: #7C3AED;\n    font-size: 14px;\n    text-transform: uppercase\n    }\n.lorawan-apps-grid {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 16px;\n    margin-top: 10px\n    }\n.lorawan-app-node {\n    display: flex;\n    align-items: center;\n    padding: 12px;\n    background-color: #F9FAFB;\n    border: 1px solid #F3F4F6;\n    border-radius: 6px;\n    font-size: 14px;\n    color: #4B5563\n    }\n.lorawan-app-node i {\n    margin-right: 10px;\n    color: #7C3AED\n    }\n.lorawan-tradeoff-tag {\n    display: inline-block;\n    padding: 4px 12px;\n    background-color: #7C3AED;\n    color: #FFF;\n    font-size: 12px;\n    font-weight: 700;\n    border-radius: 20px;\n    margin-bottom: 12px\n    }\n.lorawan-tech-summary {\n    font-size: 15px;\n    line-height: 1.5;\n    color: #6B7280;\n    margin-top: 10px\n    }\nhtml { overflow: hidden; }\n</style>\n</head>\n<body>\n<div class=\"lorawan-slide-root\" style=\"overflow: hidden;\">\n<!-- Title Region -->\n<div class=\"title-region-container\">\n<span class=\"title-main-text\">LoRaWAN: Long Range Wide Area Network</span>\n<span class=\"title-sub-text\">Module 2: IoT Ecosystems &amp; Protocols</span>\n</div>\n<!-- Main Content Layout -->\n<div class=\"lorawan-content-layout\">\n<!-- Left Column: Technical Specifications -->\n<div class=\"lorawan-left-column\">\n<div class=\"lorawan-info-card\">\n<span class=\"lorawan-tradeoff-tag\">TECHNICAL ARCHITECTURE</span>\n<ul style=\"padding: 0; margin: 0;\">\n<li class=\"lorawan-spec-item\">\n<div class=\"lorawan-spec-icon\">\n<i class=\"fa-solid fa-tower-broadcast\"></i>\n</div>\n<div class=\"lorawan-spec-content\">\n<div class=\"lorawan-spec-label\">Network Range</div>\n<div class=\"lorawan-spec-value\">Up to 15 Kilometers (Rural)</div>\n</div>\n</li>\n<li class=\"lorawan-spec-item\">\n<div class=\"lorawan-spec-icon\">\n<i class=\"fas fa-battery-full\"></i>\n</div>\n<div class=\"lorawan-spec-content\">\n<div class=\"lorawan-spec-label\">Battery Longevity</div>\n<div class=\"lorawan-spec-value\">5 \u2013 10 Years (AA Battery)</div>\n</div>\n</li>\n<li class=\"lorawan-spec-item\" style=\"margin-bottom: 0;\">\n<div class=\"lorawan-spec-icon\">\n<i class=\"fa-solid fa-circle-info\"></i>\n</div>\n<div class=\"lorawan-spec-content\">\n<div class=\"lorawan-spec-label\">Data Rate Trade-off</div>\n<div class=\"lorawan-spec-value\">250 bps \u2013 50 kbps</div>\n</div>\n</li>\n</ul>\n<p class=\"lorawan-tech-summary\">\n                        Uses LoRa (Long Range) radio modulation. Low power consumption per transmission allows sensors to operate for years without maintenance.\n                    </p>\n</div>\n</div>\n<!-- Right Column: Analogy &amp; Applications -->\n<div class=\"lorawan-right-column\">\n<!-- Analogy Block -->\n<div class=\"lorawan-analogy-block\">\n<p class=\"lorawan-analogy-text\">\n                        &#34;A radio whisper that carries a short message across kilometres \u2014 not enough bandwidth for conversation, but sufficient to report a reading, and the transmitter survives on a single battery for years.&#34;\n                    </p>\n<span class=\"lorawan-analogy-caption\">The Radio Whisper Concept</span>\n</div>\n<!-- Applications Block -->\n<div class=\"lorawan-info-card\">\n<span class=\"lorawan-tradeoff-tag\" style=\"background-color: #4B5563;\">REAL-WORLD DEPLOYMENTS</span>\n<div class=\"lorawan-apps-grid\">\n<div class=\"lorawan-app-node\">\n<i class=\"fas fa-city\"></i>\n<span>Smart Parking Sensors</span>\n</div>\n<div class=\"lorawan-app-node\">\n<i class=\"fas fa-seedling\"></i>\n<span>Soil Moisture Tracking</span>\n</div>\n<div class=\"lorawan-app-node\">\n<i class=\"fas fa-bolt\"></i>\n<span>Utility Metering</span>\n</div>\n<div class=\"lorawan-app-node\">\n<i class=\"fas fa-cow\"></i>\n<span>Livestock Tracking</span>\n</div>\n</div>\n<p class=\"lorawan-tech-summary\" style=\"margin-top: 15px;\">\n                        Ideal for infrastructure in areas beyond cellular coverage, emphasizing distance and power efficiency over high-speed data transfer.\n                    </p>\n</div>\n</div>\n</div>\n</div>\n\n</body></html>", "<!DOCTYPE html><html lang=\"en\"><head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>Matter Protocol and Interoperability</title>\n<link href=\"https://fonts.googleapis.com\" rel=\"preconnect\"/>\n<link crossorigin=\"\" href=\"https://fonts.gstatic.com\" rel=\"preconnect\"/>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Fira+Code:wght@400;500&amp;display=swap\" rel=\"stylesheet\"/>\n<script src=\"https://picture-search.skywork.ai/aippt/static/tailwindcss.com\"><\/script><link href=\"https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css\" rel=\"stylesheet\"/><style>:root {\n    --bg-global: #F8F9FA;\n    --primary-text: #212529;\n    --accent-iot: #7C3AED;\n    --card-bg: #FFF;\n    --border-color: #E5E7EB;\n    --secondary-text: #6B7280\n    }\n* {\n    margin: 0 0;\n    padding: 0 0;\n    box-sizing: border-box\n    }\nbody {width: 1280px; height: 720px; overflow: hidden; background-color: #f0f0f0;\n    display: flex;\n    justify-content: center;\n    align-items: center;\n    font-family: \"Inter\", sans-serif}\n.slide-root-container {\n    width: 1280px;\n    height: 720px;\n    background-color: var(--bg-global);\n    display: flex;\n    flex-direction: column;\n    position: relative\n    }\n.title-section-wrapper {\n    display: flex;\n    flex-direction: column;\n    padding: 24px 60px 12px 60px;\n    margin-bottom: 12px;\n    border-left: 6px solid var(--accent-iot);\n    margin-left: 60px;\n    margin-top: 24px\n    }\n.title-main-heading {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 700;\n    font-size: 32px;\n    color: var(--primary-text);\n    line-height: 1.2\n    }\n.title-sub-label {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 400;\n    font-size: 14px;\n    color: var(--secondary-text);\n    text-transform: uppercase;\n    letter-spacing: 1px;\n    margin-top: 5px\n    }\n.main-content-layout {\n    display: flex;\n    gap: 24px 40px;\n    padding: 0 60px 24px 60px;\n    flex: 1;\n    align-items: stretch\n    }\n.left-column-content {\n    flex: 1;\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    gap: 15px 25px\n    }\n.right-column-content {\n    flex: 1;\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    gap: 15px 25px\n    }\n.analogy-highlight-box {\n    background-color: var(--card-bg);\n    border: 1px solid var(--border-color);\n    padding: 18px 30px;\n    border-radius: 8px;\n    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05)\n    }\n.analogy-text-italic {\n    font-style: italic;\n    color: var(--accent-iot);\n    font-size: 17px;\n    line-height: 1.6;\n    margin-top: 6px\n    }\n.tech-card-item {\n    background-color: var(--card-bg);\n    border: 1px solid var(--border-color);\n    padding: 15px 25px;\n    border-radius: 8px;\n    flex: 1\n    }\n.tech-card-header {\n    display: flex;\n    align-items: center;\n    gap: 9px 15px;\n    margin-bottom: 9px\n    }\n.tech-card-icon {\n    color: var(--accent-iot);\n    font-size: 23px\n    }\n.tech-card-title {\n    font-weight: 700;\n    font-size: 20px;\n    color: var(--primary-text)\n    }\n.tech-card-body {\n    font-size: 15px;\n    color: var(--secondary-text);\n    line-height: 1.5\n    }\n.mono-tech-term {\n    font-family: \"Fira Code\", monospace;\n    background-color: #F3F4F6;\n    padding: 2px 6px;\n    border-radius: 4px;\n    color: var(--accent-iot);\n    font-size: 14px\n    }\n.list-bullet-point {\n    list-style: none;\n    margin-bottom: 7px;\n    display: flex;\n    align-items: flex-start;\n    gap: 7px 12px\n    }\n.list-bullet-point i {\n    margin-top: 2px;\n    color: var(--accent-iot);\n    font-size: 11px\n    }\n.brand-grid-container {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 9px 15px;\n    margin-top: 9px\n    }\n.brand-tag-element {\n    background: #F3F4F6;\n    padding: 5px 8px;\n    text-align: center;\n    border-radius: 4px;\n    font-size: 13px;\n    font-weight: 600;\n    color: #4B5563\n    }\nhtml { overflow: hidden; }\n</style>\n</head>\n<body>\n<div class=\"slide-root-container\" style=\"overflow: hidden;\">\n<!-- Title Section -->\n<div class=\"title-section-wrapper\">\n<h1 class=\"title-main-heading\">Matter Protocol and Interoperability</h1>\n<span class=\"title-sub-label\">Module 5: IoT Standardization and Security</span>\n</div>\n<!-- Main Content -->\n<div class=\"main-content-layout\">\n<!-- Left Column: Analogy and Overview -->\n<div class=\"left-column-content\">\n<div class=\"analogy-highlight-box\">\n<div class=\"tech-card-header\">\n<i class=\"fa-solid fa-lightbulb tech-card-icon\"></i>\n<span class=\"tech-card-title\">Key Analogy</span>\n</div>\n<p class=\"analogy-text-italic\">\n                        &#34;A universal power socket standard \u2014 one specification that any manufacturer can implement, ensuring that any compliant device works in any compliant ecosystem regardless of brand.&#34;\n                    </p>\n</div>\n<div class=\"tech-card-item\">\n<div class=\"tech-card-header\">\n<i class=\"fa-solid fa-handshake tech-card-icon\"></i>\n<span class=\"tech-card-title\">Industry Backing</span>\n</div>\n<p class=\"tech-card-body\">\n                        Developed by the <span class=\"mono-tech-term\">Connectivity Standards Alliance</span> (CSA) and supported by over 200 companies to solve market fragmentation.\n                    </p>\n<div class=\"brand-grid-container\">\n<div class=\"brand-tag-element\">Apple Home</div>\n<div class=\"brand-tag-element\">Google Home</div>\n<div class=\"brand-tag-element\">Amazon Alexa</div>\n<div class=\"brand-tag-element\">Samsung</div>\n<div class=\"brand-tag-element\">Zigbee</div>\n<div class=\"brand-tag-element\">Thread</div>\n</div>\n</div>\n</div>\n<!-- Right Column: Technical Implementation -->\n<div class=\"right-column-content\">\n<div class=\"tech-card-item\">\n<div class=\"tech-card-header\">\n<i class=\"fa-solid fa-layer-group tech-card-icon\"></i>\n<span class=\"tech-card-title\">Technical Architecture</span>\n</div>\n<ul class=\"tech-card-body\">\n<li class=\"list-bullet-point\">\n<i class=\"fa-solid fa-circle\"></i>\n<span>Operates as an <strong>application-layer</strong> standard running over <span class=\"mono-tech-term\">IPv6</span> for universal addressing.</span>\n</li>\n<li class=\"list-bullet-point\">\n<i class=\"fa-solid fa-circle\"></i>\n<span>Uses <span class=\"mono-tech-term\">Wi-Fi</span> for high-bandwidth needs like video streaming and media.</span>\n</li>\n<li class=\"list-bullet-point\">\n<i class=\"fa-solid fa-circle\"></i>\n<span>Uses <span class=\"mono-tech-term\">Thread</span>\u2014a low-power mesh protocol\u2014for battery-constrained sensors.</span>\n</li>\n<li class=\"list-bullet-point\">\n<i class=\"fa-solid fa-circle\"></i>\n<span>Local control: No requirement for proprietary bridges or cloud accounts to function.</span>\n</li>\n</ul>\n</div>\n<div class=\"tech-card-item\">\n<div class=\"tech-card-header\">\n<i class=\"fa-solid fa-shield tech-card-icon\"></i>\n<span class=\"tech-card-title\">Operational Benefits</span>\n</div>\n<ul class=\"tech-card-body\">\n<li class=\"list-bullet-point\">\n<i class=\"fa-solid fa-check\"></i>\n<span><strong>Unified Commissioning:</strong> Standardized setup process for all device categories.</span>\n</li>\n<li class=\"list-bullet-point\">\n<i class=\"fa-solid fa-check\"></i>\n<span><strong>Interoperability:</strong> A single device can be controlled by multiple platforms simultaneously.</span>\n</li>\n<li class=\"list-bullet-point\">\n<i class=\"fa-solid fa-check\"></i>\n<span><strong>Future-Proofing:</strong> Robust security requirements built into the certification.</span>\n</li>\n</ul>\n</div>\n</div>\n</div>\n</div>\n\n</body></html>", "<!DOCTYPE html><html lang=\"en\"><head>\n<meta charset=\"utf-8\"/>\n<title>IoT Security Case Study: The Mirai Botnet</title>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Fira+Code&amp;display=swap\" rel=\"stylesheet\"/>\n<script src=\"https://picture-search.skywork.ai/aippt/static/tailwindcss.com\"><\/script><link href=\"https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css\" rel=\"stylesheet\"/><style>:root {\n    --background-global: #F8F9FA;\n    --primary-text: #212529;\n    --accent-security: #EA580C;\n    --card-bg: #FFF;\n    --card-border: #E5E7EB;\n    --secondary-text: #6B7280\n    }\n* {\n    margin: 0;\n    padding: 0;\n    box-sizing: border-box\n    }\nbody {width: 1280px; height: 720px; overflow: hidden; background-color: #D1D5DB;\n    display: flex;\n    justify-content: center;\n    align-items: center;\n    font-family: \"Inter\", sans-serif}\n.mirai-slide-root {\n    width: 1280px;\n    height: 720px;\n    background-color: var(--background-global);\n    color: var(--primary-text);\n    position: relative;\n    display: flex;\n    flex-direction: column;\n    padding: 40px\n    }\n.title-region-container {\n    display: flex;\n    flex-direction: column;\n    padding: 20px 40px;\n    margin-bottom: 30px;\n    border-left: 6px solid var(--accent-security)\n    }\n.title-main-heading {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 700;\n    font-size: 28px;\n    color: var(--primary-text);\n    line-height: 1.2\n    }\n.title-sub-heading {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 400;\n    font-size: 14px;\n    color: var(--secondary-text);\n    text-transform: uppercase;\n    letter-spacing: 1px;\n    margin-top: 4px\n    }\n.mirai-content-wrapper {\n    display: flex;\n    flex-direction: row;\n    gap: 40px;\n    align-items: stretch;\n    flex: 1\n    }\n.mirai-left-column, .mirai-right-column {\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    gap: 30px\n    }\n.mirai-info-card {\n    background-color: var(--card-bg);\n    border: 1px solid var(--card-border);\n    border-radius: 8px;\n    padding: 24px;\n    display: flex;\n    flex-direction: column;\n    gap: 16px;\n    flex: 1\n    }\n.mirai-card-header {\n    display: flex;\n    align-items: center;\n    gap: 12px;\n    font-weight: 700;\n    font-size: 20px;\n    color: var(--accent-security)\n    }\n.mirai-card-list {\n    list-style: none;\n    display: flex;\n    flex-direction: column;\n    gap: 12px\n    }\n.mirai-list-item {\n    display: flex;\n    gap: 12px;\n    font-size: 16px;\n    line-height: 1.5\n    }\n.mirai-icon-bullet {\n    color: var(--accent-security);\n    margin-top: 4px;\n    font-size: 14px\n    }\n.mirai-code-block {\n    font-family: \"Fira Code\", monospace;\n    background-color: #F3F4F6;\n    padding: 4px 8px;\n    border-radius: 4px;\n    font-size: 14px;\n    color: #BE123C\n    }\n.mirai-analogy-block {\n    background-color: #FFF7ED;\n    border-left: 4px italic var(--accent-security);\n    padding: 20px;\n    border-radius: 0 8px 8px 0;\n    border-left: 4px solid var(--accent-security)\n    }\n.mirai-analogy-text {\n    font-style: italic;\n    color: #9A3412;\n    font-size: 16px;\n    line-height: 1.6\n    }\n.mirai-impact-bann
