lass=\"math-calculation-box\">\n<div class=\"math-step-row\">\n<div class=\"math-step-label\">Original (FP32):</div>\n<div class=\"math-step-value\">32 bits / weight</div>\n</div>\n<div class=\"math-step-row\">\n<div class=\"math-step-label\">Quantized (INT8):</div>\n<div class=\"math-step-value\">8 bits / weight</div>\n</div>\n<div class=\"math-result-divider\"></div>\n<div class=\"math-step-row\">\n<div class=\"math-step-label\">Reduction Ratio:</div>\n<div class=\"math-step-value\">32 / 8 = 4</div>\n</div>\n<div class=\"math-final-result\">\n                            4x Memory Reduction\n                        </div>\n</div>\n<div class=\"analogy-footer-note\">\n<i class=\"fas fa-lightbulb\" style=\"margin-right: 8px;\"></i>\n                        Analogy: Recording prices to the nearest naira instead of kobo.\n                    </div>\n</div>\n</div>\n<!-- Right Column: Accuracy Preservation Techniques -->\n<div class=\"review-column-right\">\n<div class=\"review-card-item\">\n<div class=\"review-card-header\">\n<i class=\"fa-solid fa-compress review-card-icon\"></i>\n<span class=\"review-card-title\">Preserving Model Accuracy</span>\n</div>\n<div class=\"technique-description-list\">\n<div class=\"technique-list-item\">\n<i class=\"fa-solid fa-circle-check technique-bullet-icon\"></i>\n<div>\n<span class=\"technique-highlight-text\">Quantization-Aware Training (QAT):</span>\n                                Incorporates the quantization error directly into the training process, allowing the model to adapt its weights to the lower precision.\n                            </div>\n</div>\n<div class=\"technique-list-item\">\n<i class=\"fa-solid fa-check technique-bullet-icon\"></i>\n<div>\n<span class=\"technique-highlight-text\">Post-Training Quantization (PTQ):</span>\n                                Applied after the model is fully trained; uses a small calibration dataset to minimize the 1\u20132% typical accuracy loss.\n                            </div>\n</div>\n<div class=\"technique-list-item\">\n<i class=\"fa-solid fa-heart-circle-check technique-bullet-icon\"></i>\n<div>\n<span class=\"technique-highlight-text\">Acceptable Trade-offs:</span>\n                                Accuracy loss is often negligible compared to the massive gains in inference speed and storage efficiency on microcontrollers.\n                            </div>\n</div>\n</div>\n<div class=\"analogy-footer-note\">\n<i class=\"fa-solid fa-circle-info\" style=\"margin-right: 8px;\"></i>\n                        Technical Note: INT4 quantization provides 8x reduction but higher accuracy risks.\n                    </div>\n</div>\n</div>\n</div>\n</div>\n\n</body></html>", "<!DOCTYPE html><html lang=\"en\"><head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>Review: Federated Learning Security</title>\n<link href=\"https://fonts.googleapis.com\" rel=\"preconnect\"/>\n<link crossorigin=\"\" href=\"https://fonts.gstatic.com\" rel=\"preconnect\"/>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Fira+Code&amp;display=swap\" rel=\"stylesheet\"/>\n<script src=\"https://picture-search.skywork.ai/aippt/static/tailwindcss.com\"><\/script><link href=\"https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css\" rel=\"stylesheet\"/><style>* {\n    margin: 0;\n    padding: 0;\n    box-sizing: border-box\n    }\nbody {width: 1280px; height: 720px; overflow: hidden; background-color: #F8F9FA;\n    font-family: \"Inter\", sans-serif;\n    color: #212529}\n.slide-root-container {\n    width: 1280px;\n    height: 720px;\n    background-color: #F8F9FA;\n    display: flex;\n    flex-direction: column;\n    padding: 40px\n    }\n.title-region-wrapper {\n    display: flex;\n    flex-direction: column;\n    padding: 20px 40px;\n    margin-bottom: 30px;\n    border-left: 6px solid #0D9488\n    }\n.title-main-text {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 700;\n    font-size: 28px;\n    color: #212529;\n    line-height: 1.2\n    }\n.title-subtitle-text {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 400;\n    font-size: 14px;\n    color: #6B7280;\n    text-transform: uppercase;\n    letter-spacing: 1px;\n    margin-top: 4px\n    }\n.review-content-layout {\n    display: flex;\n    flex-direction: row;\n    gap: 40px;\n    align-items: stretch;\n    flex: 1\n    }\n.review-left-column, .review-right-column {\n    flex: 1;\n    display: flex;\n    flex-direction: column;\n    justify-content: center\n    }\n.review-card-item {\n    background-color: #FFF;\n    border: 1px solid #E5E7EB;\n    border-radius: 8px;\n    padding: 30px;\n    flex: 1;\n    display: flex;\n    flex-direction: column\n    }\n.question-header-group {\n    display: flex;\n    align-items: center;\n    gap: 15px;\n    margin-bottom: 25px\n    }\n.question-icon-box {\n    width: 48px;\n    height: 48px;\n    background-color: #F0FDFA;\n    border-radius: 50%;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    color: #0D9488;\n    font-size: 20px\n    }\n.question-title-text {\n    font-size: 20px;\n    font-weight: 700;\n    color: #0D9488\n    }\n.review-prompt-text {\n    font-size: 18px;\n    line-height: 1.6;\n    margin-bottom: 25px;\n    color: #374151;\n    font-weight: 500\n    }\n.technical-list-container {\n    list-style: none;\n    display: flex;\n    flex-direction: column;\n    gap: 15px\n    }\n.technical-list-entry {\n    display: flex;\n    align-items: flex-start;\n    gap: 12px;\n    font-size: 16px;\n    line-height: 1.5\n    }\n.bullet-point-marker {\n    color: #0D9488;\n    margin-top: 4px;\n    font-size: 14px\n    }\n.code-term-highlight {\n    font-family: \"Fira Code\", monospace;\n    background-color: #F3F4F6;\n    padding: 2px 6px;\n    border-radius: 4px;\n    font-size: 14px;\n    color: #0D9488\n    }\n.analogy-block-italic {\n    font-style: italic;\n    color: #6B7280;\n    border-top: 1px solid #F3F4F6;\n    padding-top: 20px;\n    margin-top: auto;\n    font-size: 15px\n    }\n.security-alert-box {\n    background-color: #FFF7ED;\n    border: 1px solid #FED7AA;\n    padding: 15px;\n    border-radius: 6px;\n    margin-top: 20px\n    }\n.security-alert-text {\n    font-size: 14px;\n    color: #9A3412;\n    line-height: 1.4\n    }\nhtml { overflow: hidden; }\n</style>\n</head>\n<body>\n<div class=\"slide-root-container\" style=\"overflow: hidden;\">\n<!-- Title Section -->\n<div class=\"title-region-wrapper\">\n<span class=\"title-main-text\">Review: Federated Learning Security</span>\n<span class=\"title-subtitle-text\">Module 1: Distributed Intelligence</span>\n</div>\n<!-- Main Content -->\n<div class=\"review-content-layout\">\n<!-- Left Column: Data Exchange -->\n<div class=\"review-left-column\">\n<div class=\"review-card-item\">\n<div class=\"question-header-group\">\n<div class=\"question-icon-box\">\n<i class=\"fa-solid fa-star\"></i>\n</div>\n<span class=\"question-title-text\">Data &amp; Gradients</span>\n</div>\n<p class=\"review-prompt-text\">\n                        Identify what is shared between participants and the central server, and what is deliberately never shared.\n                    </p>\n<ul class=\"technical-list-container\">\n<li class=\"technical-list-entry\">\n<i class=\"fas fa-arrow-right bullet-point-marker\"></i>\n<div><strong>Shared:</strong> <span class=\"code-term-highlight\">Parameter Updates</span> or <span class=\"code-term-highlight\">Gradients</span> \u2014 computed editorial corrections based on local training.</div>\n</li>\n<li class=\"technical-list-entry\">\n<i class=\"fa-solid fa-timeline bullet-point-marker\" style=\"color: #EF4444;\"></i>\n<div><strong>Never Shared:</strong> <span class=\"code-term-highlight\">Raw Data</span> \u2014 the original patient records or user input history stays on the origin device.</div>\n</li>\n</ul>\n<div class=\"analogy-block-italic\">\n                        The Hospital Analogy: Sharing the editorial notes (improvements) but never the patient charts (raw data).\n                    </div>\n</div>\n</div>\n<!-- Right Column: Security Assumptions -->\n<div class=\"review-right-column\">\n<div class=\"review-card-item\">\n<div class=\"question-header-group\">\n<div class=\"question-icon-box\">\n<i class=\"fas fa-shield-halved\"></i>\n</div>\n<span class=\"question-title-text\">Foundational Assumptions</span>\n</div>\n<p class=\"review-prompt-text\">\n                        What critical security assumption does the Federated Learning system depend upon?\n                    </p>\n<ul class=\"technical-list-container\">\n<li class=\"technical-list-entry\">\n<i class=\"fa-solid fa-circle-check bullet-point-marker\"></i>\n<div><strong>Gradient Privacy:</strong> Assumption that sharing model updates does not accidentally leak the underlying raw data.</div>\n</li>\n<li class=\"technical-list-entry\">\n<i class=\"fa-solid fa-check bullet-point-marker\"></i>\n<div><strong>Aggregation Trust:</strong> The central server is trusted to accurately aggregate updates without malicious manipulation.</div>\n</li>\n</ul>\n<div class=\"security-alert-box\">\n<div class=\"security-alert-text\">\n<i class=\"fa-solid fa-triangle-exclamation\" style=\"margin-right: 8px;\"></i>\n<strong>Risk:</strong> Protection is needed against &#34;Adversarial Participants&#34; who might submit poisoned updates to corrupt the global model.\n                        </div>\n</div>\n<div class=\"analogy-block-italic\">\n                        The system assumes the publisher (central server) won&#39;t try to reverse-engineer the patient records from the hospital&#39;s notes.\n                    </div>\n</div>\n</div>\n</div>\n</div>\n\n</body></html>", "<!DOCTYPE html><html lang=\"en\"><head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>Review: IoT Protocols and Connectivity</title>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Fira+Code&amp;display=swap\" rel=\"stylesheet\"/>\n<script src=\"https://picture-search.skywork.ai/aippt/static/tailwindcss.com\"><\/script><link href=\"https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css\" rel=\"stylesheet\"/><style>body {width: 1280px; height: 720px; overflow: hidden; background-color: #F8F9FA;\n    font-family: \"Inter\", sans-serif;\n    color: #212529}\n.slide-root-container {\n    width: 1280px;\n    height: 720px;\n    background-color: #F8F9FA;\n    display: flex;\n    flex-direction: column;\n    box-sizing: border-box;\n    position: relative\n    }\n.review-title-section {\n    display: flex;\n    flex-direction: column;\n    padding: 32px 60px 16px 60px;\n    margin-bottom: 16px;\n    border-left: 8px solid #7C3AED\n    }\n.review-main-heading {\n    font-weight: 700;\n    font-size: 36px;\n    color: #212529;\n    line-height: 1.2\n    }\n.review-sub-heading {\n    font-weight: 400;\n    font-size: 16px;\n    color: #6B7280;\n    text-transform: uppercase;\n    letter-spacing: 2px;\n    margin-top: 6px\n    }\n.review-content-wrapper {\n    display: flex;\n    flex-direction: row;\n    padding: 0 60px 32px 60px;\n    gap: 32px 40px;\n    align-items: stretch;\n    flex: 1\n    }\n.review-column-left, .review-column-right {\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    flex: 1\n    }\n.iot-review-card {\n    background-color: #FFF;\n    border: 1px solid #E5E7EB;\n    border-radius: 12px;\n    padding: 26px 32px;\n    display: flex;\n    flex-direction: column;\n    height: 100%\n    }\n.iot-card-header {\n    display: flex;\n    align-items: center;\n    gap: 13px 16px;\n    margin-bottom: 19px\n    }\n.iot-icon-circle {\n    width: 48px;\n    height: 48px;\n    background-color: #F5F3FF;\n    color: #7C3AED;\n    border-radius: 50%;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 20px\n    }\n.iot-card-title {\n    font-size: 22px;\n    font-weight: 700;\n    color: #212529\n    }\n.iot-question-text {\n    font-size: 18px;\n    line-height: 1.6;\n    margin-bottom: 19px;\n    color: #374151;\n    padding: 13px 16px;\n    background-color: #F9FAFB;\n    border-left: 4px solid #7C3AED;\n    font-style: italic\n    }\n.iot-analysis-list {\n    list-style: none;\n    padding: 0 0;\n    margin: 0 0\n    }\n.iot-analysis-item {\n    margin-bottom: 13px;\n    display: flex;\n    align-items: flex-start;\n    gap: 10px 12px\n    }\n.iot-analysis-bullet {\n    color: #7C3AED;\n    margin-top: 5px;\n    font-size: 14px\n    }\n.iot-analysis-content {\n    font-size: 16px;\n    line-height: 1.5;\n    color: #4B5563\n    }\n.mono-text {\n    font-family: \"Fira Code\", monospace;\n    background-color: #F3F4F6;\n    padding: 2px 6px;\n    border-radius: 4px;\n    font-size: 0.9em;\n    color: #7C3AED\n    }\n.solution-badge {\n    margin-top: auto;\n    align-self: flex-start;\n    padding: 6px 16px;\n    background-color: #7C3AED;\n    color: #FFF;\n    border-radius: 6px;\n    font-weight: 700;\n    font-size: 14px;\n    text-transform: uppercase;\n    letter-spacing: 1px\n    }\nhtml { overflow: hidden; }\n</style>\n</head>\n<body>\n<div class=\"slide-root-container\" style=\"overflow: hidden;\">\n<!-- Title Section -->\n<div class=\"review-title-section\">\n<div class=\"review-main-heading\">Review: IoT Protocols &amp; Connectivity</div>\n<div class=\"review-sub-heading\">Module 4: Internet of Things Ecosystem</div>\n</div>\n<!-- Main Content -->\n<div class=\"review-content-wrapper\">\n<!-- Left Column: Protocol Comparison -->\n<div class=\"review-column-left\">\n<div class=\"iot-review-card\">\n<div class=\"iot-card-header\">\n<div class=\"iot-icon-circle\">\n<i class=\"fa-solid fa-star\"></i>\n</div>\n<div class=\"iot-card-title\">Protocol Selection Logic</div>\n</div>\n<div class=\"iot-question-text\">\n                        Compare MQTT and CoAP: in what scenario would you choose MQTT, and in what scenario CoAP? What is the key architectural difference?\n                    </div>\n<div class=\"iot-analysis-list\">\n<div class=\"iot-analysis-item\">\n<i class=\"fas fa-circle iot-analysis-bullet\"></i>\n<div class=\"iot-analysis-content\">\n<strong>MQTT Choice:</strong> Ideal for <span class=\"mono-text\">Data Collection</span> or telemetry where multiple clients need to receive the same sensor updates (Notice Board analogy).\n                            </div>\n</div>\n<div class=\"iot-analysis-item\">\n<i class=\"fas fa-circle iot-analysis-bullet\"></i>\n<div class=\"iot-analysis-content\">\n<strong>CoAP Choice:</strong> Best for <span class=\"mono-text\">Device Interrogation</span> where a controller needs to query a specific state or &#34;browse&#34; a resource (Web-like semantics).\n                            </div>\n</div>\n<div class=\"iot-analysis-item\">\n<i class=\"fas fa-circle iot-analysis-bullet\"></i>\n<div class=\"iot-analysis-content\">\n<strong>Key Difference:</strong> <span class=\"mono-text\">MQTT</span> uses a Publish-Subscribe broker over <span class=\"mono-text\">TCP</span>; <span class=\"mono-text\">CoAP</span> uses Request-Response over <span class=\"mono-text\">UDP</span>.\n                            </div>\n</div>\n</div>\n<div class=\"solution-badge\">Protocol Insight</div>\n</div>\n</div>\n<!-- Right Column: Connectivity Scenario -->\n<div class=\"review-column-right\">\n<div class=\"iot-review-card\">\n<div class=\"iot-card-header\">\n<div class=\"iot-icon-circle\">\n<i class=\"fas fa-satellite-dish\"></i>\n</div>\n<div class=\"iot-card-title\">Connectivity Scenario</div>\n</div>\n<div class=\"iot-question-text\">\n                        A remote soil moisture sensor must transmit 20 bytes once per hour for 5 years on a single battery. Which technology is best?\n                    </div>\n<div class=\"iot-analysis-list\">\n<div class=\"iot-analysis-item\">\n<i class=\"fas fa-circle iot-analysis-bullet\"></i>\n<div class=\"iot-analysis-content\">\n<strong>Constraint Check:</strong> Remote location excludes standard Wi-Fi; 5-year battery life rules out high-power Cellular.\n                            </div>\n</div>\n<div class=\"iot-analysis-item\">\n<i class=\"fas fa-circle iot-analysis-bullet\"></i>\n<div class=\"iot-analysis-content\">\n<strong>The Solution:</strong> <span class=\"mono-text\">LoRaWAN</span> is the most appropriate due to its &#34;Radio Whisper&#34; capability.\n                            </div>\n</div>\n<div class=\"iot-analysis-item\">\n<i class=\"fas fa-circle iot-analysis-bullet\"></i>\n<div class=\"iot-analysis-content\">\n<strong>Why:</strong> It supports long range (15km), extremely low power consumption per transmission, and fits small payloads.\n                            </div>\n</div>\n</div>\n<div class=\"solution-badge\">Wireless Choice: LoRaWAN</div>\n</div>\n</div>\n</div>\n</div>\n\n</body></html>", "<!DOCTYPE html><html lang=\"en\"><head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>IoT Security and Regulation Review</title>\n<link href=\"https://fonts.googleapis.com\" rel=\"preconnect\"/>\n<link crossorigin=\"\" href=\"https://fonts.gstatic.com\" rel=\"preconnect\"/>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Fira+Code&amp;display=swap\" rel=\"stylesheet\"/>\n<script src=\"https://picture-search.skywork.ai/aippt/static/tailwindcss.com\"><\/script><link href=\"https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css\" rel=\"stylesheet\"/><style>body {width: 1280px; height: 720px; overflow: hidden; background-color: #F8F9FA;\n    display: flex;\n    justify-content: center;\n    align-items: center}\n.slide-root-container {\n    width: 1280px;\n    height: 720px;\n    background-color: #F8F9FA;\n    padding: 40px;\n    box-sizing: border-box;\n    display: flex;\n    flex-direction: column\n    }\n.title-header-section {\n    display: flex;\n    flex-direction: column;\n    padding: 0 0 0 20px;\n    margin-bottom: 40px;\n    border-left: 6px solid #EA580C\n    }\n.title-main-heading {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 700;\n    font-size: 32px;\n    color: #212529;\n    line-height: 1.2\n    }\n.title-sub-heading {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 400;\n    font-size: 14px;\n    color: #6B7280;\n    text-transform: uppercase;\n    letter-spacing: 1px;\n    margin-top: 8px\n    }\n.review-content-layout {\n    display: flex;\n    gap: 30px;\n    flex: 1;\n    align-items: stretch\n    }\n.review-left-column {\n    flex: 1;\n    display: flex;\n    flex-direction: column;\n    justify-content: center\n    }\n.review-right-column {\n    flex: 1;\n    display: flex;\n    flex-direction: column;\n    justify-content: center\n    }\n.security-review-card {\n    background-color: #FFF;\n    border: 1px solid #E5E7EB;\n    border-radius: 8px;\n    padding: 24px;\n    flex: 1;\n    display: flex;\n    flex-direction: column;\n    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05)\n    }\n.card-header-group {\n    display: flex;\n    align-items: center;\n    gap: 12px;\n    margin-bottom: 20px\n    }\n.card-icon-wrapper {\n    width: 40px;\n    height: 40px;\n    background-color: #FFF7ED;\n    border-radius: 6px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    color: #EA580C;\n    font-size: 20px\n    }\n.card-title-text {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 700;\n    font-size: 20px;\n    color: #212529\n    }\n.review-list-container {\n    list-style: none;\n    padding: 0;\n    margin: 0\n    }\n.review-list-item {\n    margin-bottom: 16px;\n    display: flex;\n    align-items: flex-start;\n    gap: 12px;\n    font-family: \"Inter\", sans-serif;\n    font-size: 16px;\n    color: #4B5563;\n    line-height: 1.5\n    }\n.review-list-bullet {\n    color: #EA580C;\n    font-size: 14px;\n    margin-top: 4px\n    }\n.analogy-footer-block {\n    margin-top: 30px;\n    background-color: #FFF7ED;\n    border-radius: 8px;\n    padding: 20px;\n    border-left: 4px solid #EA580C\n    }\n.analogy-text-style {\n    font-family: \"Inter\", sans-serif;\n    font-style: italic;\n    font-size: 16px;\n    color: #9A3412;\n    line-height: 1.6\n    }\n.technical-code-span {\n    font-family: \"Fira Code\", monospace;\n    background-color: #F3F4F6;\n    padding: 2px 4px;\n    border-radius: 4px;\n    font-size: 14px;\n    color: #212529\n    }\n.discussion-prompt-wrapper {\n    margin-top: 20px;\n    padding: 15px;\n    background-color: #F9FAFB;\n    border: 1px dashed #D1D5DB;\n    border-radius: 6px\n    }\n.prompt-title {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 700;\n    font-size: 14px;\n    color: #374151;\n    margin-bottom: 8px;\n    text-transform: uppercase\n    }\n.prompt-body {\n    font-family: \"Inter\", sans-serif;\n    font-size: 15px;\n    color: #4B5563\n    }\nhtml { overflow: hidden; }\n</style>\n</head>\n<body>\n<div class=\"slide-root-container\" style=\"overflow: hidden;\">\n<!-- Title Section -->\n<div class=\"title-header-section\">\n<span class=\"title-main-heading\">Review: IoT Security and Regulation</span>\n<span class=\"title-sub-heading\">Module 3: Security &amp; Cyber-Physical Systems</span>\n</div>\n<!-- Main Content -->\n<div class=\"review-content-layout\">\n<!-- Left Column: Evidence -->\n<div class=\"review-left-column\">\n<div class=\"security-review-card\">\n<div class=\"card-header-group\">\n<div class=\"card-icon-wrapper\">\n<i class=\"fas fa-bug\"></i>\n</div>\n<span class=\"card-title-text\">Evidence: The Mirai Botnet</span>\n</div>\n<ul class=\"review-list-container\">\n<li class=\"review-list-item\">\n<i class=\"fas fa-circle-check review-list-bullet\"></i>\n<span>Compromised ~600,000 devices (IP cameras, routers) using hardcoded <span class=\"technical-code-span\">admin:admin</span> credentials.</span>\n</li>\n<li class=\"review-list-item\">\n<i class=\"fas fa-circle-check review-list-bullet\"></i>\n<span>Launched massive DDoS attacks against Dyn, paralyzing major internet services like Netflix and PayPal.</span>\n</li>\n<li class=\"review-list-item\">\n<i class=\"fas fa-circle-check review-list-bullet\"></i>\n<span>The vulnerability was not a bug, but a lack of basic security hygiene in the manufacturing process.</span>\n</li>\n</ul>\n</div>\n</div>\n<!-- Right Column: Argument -->\n<div class=\"review-right-column\">\n<div class=\"security-review-card\">\n<div class=\"card-header-group\">\n<div class=\"card-icon-wrapper\">\n<i class=\"fas fa-gavel\"></i>\n</div>\n<span class=\"card-title-text\">Regulatory Arguments</span>\n</div>\n<ul class=\"review-list-container\">\n<li class=\"review-list-item\">\n<i class=\"fas fa-circle-check review-list-bullet\"></i>\n<span><strong>Systemic Risk:</strong> Unsecured consumer devices create collective infrastructure threats that users cannot manage.</span>\n</li>\n<li class=\"review-list-item\">\n<i class=\"fas fa-circle-check review-list-bullet\"></i>\n<span><strong>Market Failure:</strong> Manufacturers prioritize low cost over security; regulation is needed to force &#34;Secure by Design.&#34;</span>\n</li>\n<li class=\"review-list-item\">\n<i class=\"fas fa-circle-check review-list-bullet\"></i>\n<span><strong>Lifecycle Gap:</strong> Most devices lack automated update mechanisms, making manual security impossible for the average owner.</span>\n</li>\n</ul>\n</div>\n</div>\n</div>\n<!-- Analogy &amp; Prompt Footer -->\n<div class=\"analogy-footer-block\">\n<div class=\"analogy-text-style\">\n                &#34;The Mirai case is like millions of locks installed with the master key printed on the box \u2014 individually trivial to bypass, but collectively they form a recruited army of vulnerabilities.&#34;\n            </div>\n</div>\n<div class=\"discussion-prompt-wrapper\">\n<div class=\"prompt-title\">Review Question</div>\n<div class=\"prompt-body\">\n                Construct an argument for why IoT security must be addressed at the manufacturing level rather than the user level. Use the lack of update mechanisms and default credentials as your primary evidence.\n            </div>\n</div>\n</div>\n\n</body></html>", "<!DOCTYPE html><html lang=\"en\"><head>\n<meta charset=\"utf-8\"/>\n<title>Review: CPS Safety and Timing</title>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Fira+Code&amp;display=swap\" rel=\"stylesheet\"/>\n<script src=\"https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js\"><\/script>\n<script src=\"https://picture-search.skywork.ai/aippt/static/tailwindcss.com\"><\/script><link href=\"https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css\" rel=\"stylesheet\"/><style>/* Base Reset */\n* {\n    margin: 0 0;\n    padding: 0 0;\n    box-sizing: border-box\n    }\nbody {width: 1280px; height: 720px; overflow: hidden; background-color: #F8F9FA;\n    display: flex;\n    justify-content: center;\n    align-items: center}\n/* Slide Root */\n.slide-layout-root {\n    width: 1280px;\n    height: 720px;\n    background-color: #F8F9FA;\n    position: relative;\n    display: flex;\n    flex-direction: column;\n    padding: 32px 40px;\n    font-family: \"Inter\", sans-serif;\n    color: #212529\n    }\n/* Title Section */\n.title-region-wrapper {\n    display: flex;\n    flex-direction: column;\n    padding: 16px 40px;\n    margin-bottom: 24px;\n    border-left: 6px solid #EA580C;\n    /* Accent 3 for CPS */\n    background-color: #FFF;\n    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05)\n    }\n.title-main-text {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 700;\n    font-size: 28px;\n    color: #212529;\n    line-height: 1.2\n    }\n.title-sub-text {\n    font-family: \"Inter\", sans-serif;\n    font-weight: 400;\n    font-size: 14px;\n    color: #6B7280;\n    text-transform: uppercase;\n    letter-spacing: 1px;\n    margin-top: 3px\n    }\n/* Content Layout */\n.assessment-main-container {\n    display: flex;\n    gap: 24px 30px;\n    width: 100%;\n    align-items: stretch\n    }\n/* Column Styles */\n.assessment-column-left {\n    flex: 1;\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    gap: 16px 20px\n    }\n.assessment-column-right {\n    flex: 1;\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    gap: 16px 20px\n    }\n/* Review Card Styles */\n.review-question-card {\n    background-color: #FFF;\n    border: 1px solid #E5E7EB;\n    padding: 19px 24px;\n    border-radius: 4px;\n    display: flex;\n    flex-direction: column;\n    gap: 10px 12px;\n    flex: 1\n    }\n.question-header-row {\n    display: flex;\n    align-items: center;\n    gap: 10px 12px\n    }\n.question-icon-box {\n    width: 40px;\n    height: 40px;\n    background-color: #FFF7ED;\n    color: #EA580C;\n    display: flex;\n    justify-content: center;\n    align-items: center;\n    border-radius: 50%;\n    font-size: 17px\n    }\n.question-label-text {\n    font-family: \"Fira Code\", monospace;\n    font-size: 13px;\n    font-weight: 700;\n    color: #EA580C;\n    text-transform: uppercase\n    }\n.question-body-text {\n    font-size: 17px;\n    line-height: 1.5;\n    color: #374151;\n    font-weight: 500\n    }\n.hint-block-wrapper {\n    margin-top: 6px;\n    padding: 10px 12px;\n    background-color: #F9FAFB;\n    border-left: 3px solid #D1D5DB\n    }\n.hint-content-text {\n    font-size: 13px;\n    color: #6B7280;\n    font-style: italic;\n    line-height: 1.4\n    }\n.technical-term-highlight {\n    font-family: \"Fira Code\", monospace;\n    background-color: #F3F4F6;\n    padding: 2px 4px;\n    border-radius: 3px;\n    color: #111827\n    }\n/* Key Takeaway Box */\n.summary-takeaway-block {\n    margin-top: auto;\n    background-color: #212529;\n    color: #FFF;\n    padding: 16px 40px;\n    display: flex;\n    align-items: center;\n    gap: 16px 20px\n    }\n.takeaway-icon-circle {\n    font-size: 24px;\n    color: #EA580C\n    }\n.takeaway-message-text {\n    font-size: 16px;\n    line-height: 1.4;\n    opacity: 0.9\n    }\nhtml { overflow: hidden; }\n</style>\n</head>\n<body>\n<div class=\"slide-layout-root\" style=\"overflow: hidden;\">\n<!-- Title Section -->\n<div class=\"title-region-wrapper\">\n<span class=\"title-main-text\">Review: CPS Safety and Timing</span>\n<span class=\"title-sub-text\">Module 3: Real-Time Systems &amp; Integrity</span>\n</div>\n<!-- Assessment Grid -->\n<div class=\"assessment-main-container\">\n<!-- Left Column: Logic &amp; Middleware -->\n<div class=\"assessment-column-left\">\n<!-- Question 1 -->\n<div class=\"review-question-card\">\n<div class=\"question-header-row\">\n<div class=\"question-icon-box\">\n<i class=\"fas fa-triangle-exclamation\"></i>\n</div>\n<span class=\"question-label-text\">Critical Thinking</span>\n</div>\n<div class=\"question-body-text\">\n                        A software bug in a word processor causes a crash. Describe how an equivalent logical error in a CPS might have qualitatively different consequences.\n                    </div>\n<div class=\"hint-block-wrapper\">\n<p class=\"hint-content-text\">\n                            Consider the &#34;Tight Coupling&#34; principle. What happens when computation fails to keep pace with continuous physical dynamics? Mention <span class=\"technical-term-highlight\">Control Theory</span>.\n                        </p>\n</div>\n</div>\n<!-- Question 2 -->\n<div class=\"review-question-card\">\n<div class=\"question-header-row\">\n<div class=\"question-icon-box\">\n<i class=\"fas fa-robot\"></i>\n</div>\n<span class=\"question-label-text\">Architectural Analysis</span>\n</div>\n<div class=\"question-body-text\">\n                        How does <span class=\"technical-term-highlight\">DDS-based</span> communication in ROS 2 improve on ROS 1&#39;s TCP-based communication for real-time applications?\n                    </div>\n<div class=\"hint-block-wrapper\">\n<p class=\"hint-content-text\">\n                            Focus on <span class=\"technical-term-highlight\">Quality-of-Service (QoS)</span>, reliability, latency budgets, and the removal of the centralized master node.\n                        </p>\n</div>\n</div>\n</div>\n<!-- Right Column: Networking &amp; Industry -->\n<div class=\"assessment-column-right\">\n<!-- Question 3 -->\n<div class=\"review-question-card\">\n<div class=\"question-header-row\">\n<div class=\"question-icon-box\">\n<i class=\"fas fa-network-wired\"></i>\n</div>\n<span class=\"question-label-text\">Technical Implementation</span>\n</div>\n<div class=\"question-body-text\">\n                        A smart factory needs to share a single Ethernet network for safety-critical control (<span class=\"technical-term-highlight\">500\u00b5s latency</span>) and general data. How does <span class=\"technical-term-highlight\">TSN</span> enable this?\n                    </div>\n<div class=\"hint-block-wrapper\">\n<p class=\"hint-content-text\">\n                            Identify specific standards: <span class=\"technical-term-highlight\">802.1Qbv</span> (Time-Aware Shaper) and <span class=\"technical-term-highlight\">802.1Qbu</span> (Frame Preemption).\n                        </p>\n</div>\n</div>\n<!-- Closing Note -->\n<div class=\"review-question-card\" style=\"background-color: #FFF7ED;border-color: #FED7AA;\">\n<div class=\"question-header-row\">\n<div class=\"question-icon-box\" style=\"background-color: #EA580C;color: #FFFFFF;\">\n<i class=\"fas fa-graduation-cap\"></i>\n</div>\n<span class=\"question-label-text\" style=\"color: #9A3412;\">Learning Outcome</span>\n</div>\n<div class=\"question-body-text\" style=\"color: #9A3412;font-size: 15px;\">\n                        Understand that in Cyber-Physical Systems, <strong>Logic + Timing = Correctness</strong>. Determinism is not just a performance feature; it is a safety requirement for physical integrity.\n                    </div>\n</div>\n</div>\n</div>\n<!-- Bottom Takeaway -->\n<div class=\"summary-takeaway-block\">\n<div class=\"takeaway-icon-circle\">\n<i class=\"fas fa-lightbulb\"></i>\n</div>\n<div class=\"takeaway-message-text\">\n                Engineering CPS requires a multi-disciplinary approach combining Control Theory, Real-Time Computing, and Formal Verification to ensure that physical assets remain safe under all computational conditions.\n            </div>\n</div>\n</div>\n\n</body></html>"];
  const TOTAL  = SLIDES.length;
  const SW = 1280, SH = 720;
  let current   = 0;
  let animating = false;

  const stage   = document.getElementById("stage");
  const frame   = document.getElementById("slide-frame");
  const btnPrev = document.getElementById("btn-prev");
  const btnNext = document.getElementById("btn-next");
  const counter = document.getElementById("counter");
  const dotsEl  = document.getElementById("dots");

  function fitStage() {
    const vw = window.innerWidth;
    const vh = window.innerHeight - 60;
    const scale = Math.min(vw / SW, vh / SH);
    const tx = (vw - SW * scale) / 2;
    const ty = (vh - SH * scale) / 2;
    stage.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  }
  window.addEventListener("resize", fitStage);
  fitStage();

  for (let i = 0; i < TOTAL; i++) {
    const d = document.createElement("div");
    d.className = "dot" + (i === 0 ? " active" : "");
    d.title = "Slide " + (i + 1);
    d.addEventListener("click", () => goTo(i));
    dotsEl.appendChild(d);
  }

  function updateDots() {
    dotsEl.querySelectorAll(".dot").forEach((d, i) =>
      d.classList.toggle("active", i === current));
  }

  let prevUrl = null;
  function loadSlide(idx) {
    if (prevUrl) URL.revokeObjectURL(prevUrl);
    const blob = new Blob([SLIDES[idx]], { type: "text/html" });
    prevUrl = URL.createObjectURL(blob);
    frame.src = prevUrl;
    counter.textContent = (idx + 1) + " / " + TOTAL;
    btnPrev.disabled = idx === 0;
    btnNext.disabled = idx === TOTAL - 1;
    updateDots();
  }

  function goTo(idx) {
    if (idx < 0 || idx >= TOTAL || idx === current || animating) return;
    animating = true;
    current = idx;
    loadSlide(current);
    setTimeout(() => { animating = false; }, 300);
  }

  btnPrev.addEventListener("click", () => goTo(current - 1));
  btnNext.addEventListener("click", () => goTo(current + 1));

  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === "ArrowDown") goTo(current + 1);
    if (e.key === "ArrowLeft"  || e.key === "ArrowUp")   goTo(current - 1);
    if (e.key === "Home") goTo(0);
    if (e.key === "End")  goTo(TOTAL - 1);
  });

  let touchX = null;
  document.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
  document.addEventListener("touchend",   e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 50) goTo(current + (dx < 0 ? 1 : -1));
    touchX = null;
  });

  let mouseX = null;
  stage.addEventListener("mousedown", e => { mouseX = e.clientX; });
  window.addEventListener("mouseup",  e => {
    if (mouseX === null) return;
    const dx = e.clientX - mouseX;
    if (Math.abs(dx) > 60) goTo(current + (dx < 0 ? 1 : -1));
    mouseX = null;
  });

  loadSlide(0);
})();
</script>
</body>
</html>
