<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIDE · Control Systems Lab</title>
<style>
:root{
  --bg:#0e1117;--panel:#161b22;--panel2:#1d2330;--border:#2b3340;--text:#e8ebf0;--muted:#9aa4b5;
  --accent:#3b82f6;--accent-soft:rgba(59,130,246,.16);--orange:#f97316;--good:#22c55e;--bad:#ef4444;--warn:#f59e0b;
  --shadow:0 14px 40px rgba(0,0,0,.5);--input:#0f141c;
}
:root[data-theme="light"]{
  --bg:#f3f5f9;--panel:#ffffff;--panel2:#f1f4f9;--border:#dbe2ec;--text:#111827;--muted:#5b6474;
  --accent:#2563eb;--accent-soft:rgba(37,99,235,.10);--shadow:0 14px 40px rgba(15,23,42,.16);--input:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:40px;height:40px;border-radius:9px;object-fit:cover;background:#fff;flex:none}
.brand-title{font-weight:700;font-size:18px;white-space:nowrap}
.brand-title .prod{color:var(--accent)}
.brand-title .sep{color:var(--muted);font-weight:400;margin:0 4px}
.brand-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel2);padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.icon{padding:7px 10px;font-size:16px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* toolbar */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;flex-wrap:wrap}
.sysbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;border-radius:10px;border:1.5px solid var(--border);background:var(--panel);cursor:pointer;user-select:none}
.chip.sel{border-color:var(--chipc);box-shadow:0 0 0 3px color-mix(in srgb,var(--chipc) 22%,transparent)}
.chip .sw{width:14px;height:14px;border-radius:4px;background:var(--chipc);flex:none}
.chip .nm{font-weight:600;font-size:14px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--panel2);color:var(--muted)}
.chip .tag.err{background:rgba(239,68,68,.15);color:var(--bad)}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:0 3px;font-size:14px}
.chip button:hover{color:var(--text)}
.chip.off .nm,.chip.off .sw{opacity:.4}
.tb-right{display:flex;gap:8px;align-items:center}
.dd{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:250px;z-index:40;display:none}
.menu.open{display:block}
.menu .mi{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 11px;border-radius:8px;cursor:pointer;font-size:14px}
.menu .mi:hover{background:var(--accent-soft)}
.menu .mi small{display:block;color:var(--muted);font-size:12px}
.menu.panel{width:340px;padding:14px;max-height:75vh;overflow:auto}
.menu h4{margin:12px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.menu h4:first-child{margin-top:0}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;padding:0 18px 14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-head .title{font-weight:700;font-size:15px}
.card-head .sub{color:var(--muted);font-size:13px}
.diagram-card{grid-column:1;grid-row:1}
.analysis-card{grid-column:2;grid-row:1/span 2;position:relative}
.analysis-inner{position:absolute;inset:0;overflow:auto;padding:14px}
.plot-card{grid-column:1;grid-row:2}
.metrics-card{grid-column:1/span 2;grid-row:3}

.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}

.palette{display:flex;gap:7px;flex-wrap:wrap;padding:10px 14px 4px}
.pal{border:1px dashed var(--border);background:var(--panel2);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;cursor:grab;user-select:none;display:flex;align-items:center;gap:6px}
.pal:hover{border-color:var(--accent);border-style:solid}
.pal .ic{color:var(--accent)}
.pal-lbl{font-size:12px;color:var(--muted);align-self:center;margin-right:2px}
.diagram-wrap{padding:8px 14px 14px}
#diagram{width:100%;height:auto;display:block;background:#fff;border-radius:10px;border:1px solid var(--border);touch-action:manipulation}
#diagram .blk,#diagram .ghost{cursor:pointer}
#diagram .blk:hover rect.bx{stroke:#2563eb;stroke-width:2.4}
#diagram .ghost:hover rect,#diagram .ghost:hover circle{stroke:#2563eb;stroke-opacity:1}
#diagram .rm{cursor:pointer}
#diagram .rm:hover circle{fill:#fee2e2;stroke:#ef4444}
#diagram .hot rect,#diagram .hot circle.gc{stroke:#f97316!important;stroke-width:2.6!important;stroke-opacity:1!important;fill:rgba(249,115,22,.10)!important;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.45}}

/* plot */
.plot-head{padding:8px 10px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.tab.on{background:var(--accent-soft);color:var(--accent)}
.plot-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plot-tools label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer}
.plot-wrap{position:relative;height:clamp(380px,56vh,680px);margin:10px;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:#fff}
#plot{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.plot-hint{position:absolute;left:10px;bottom:4px;font-size:11.5px;color:#64748b;pointer-events:none;background:rgba(255,255,255,.8);padding:1px 6px;border-radius:5px}
.routh{position:absolute;inset:0;overflow:auto;padding:18px 22px;color:#0f172a;background:#fff}
.routh h3{margin:0 0 6px;font-size:17px}
.routh .poly{font-size:16px;margin:6px 0 14px;overflow-x:auto}
.routh table{border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.routh td,.routh th{border:1px solid #e2e8f0;padding:7px 14px;text-align:right}
.routh th{background:#f8fafc;text-align:center}
.routh td.fc{font-weight:700;background:#eff6ff}
.routh td.fc.neg{color:#dc2626;background:#fef2f2}
.routh .verdict{margin-top:14px;font-size:16px;font-weight:700}
.routh .note{color:#475569;font-size:13.5px;margin-top:8px;max-width:760px}

select,input[type=number],input[type=text]{background:var(--input);border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:14px;min-width:0}
input[type=text].tfin{width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;padding:9px 11px}
input:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
input[type=range]{accent-color:var(--accent);width:100%}

/* form rows */
.frow{display:grid;grid-template-columns:110px 1fr 86px;gap:10px;align-items:center;margin:8px 0}
.frow.two{grid-template-columns:110px 1fr}
.frow label{font-size:13.5px;color:var(--muted);font-weight:600}
.frow.dim{opacity:.38}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:7px 0;cursor:pointer}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* analysis */
.an-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.an-head .dot{width:14px;height:14px;border-radius:4px;flex:none}
.an-head .nm{font-weight:700;font-size:16px}
.badge{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;letter-spacing:.02em;margin-left:auto;white-space:nowrap}
.badge.stable{background:rgba(34,197,94,.15);color:var(--good)}
.badge.marginal{background:rgba(245,158,11,.16);color:var(--warn)}
.badge.unstable{background:rgba(239,68,68,.16);color:var(--bad)}
.badge.err{background:rgba(239,68,68,.16);color:var(--bad)}
.an-sec{border-top:1px solid var(--border);padding:10px 0}
.an-sec .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:6px}
.tf{font-family:'Cambria Math','STIX Two Math','Times New Roman',serif;font-size:16.5px;display:flex;align-items:center;gap:8px;overflow-x:auto;padding-bottom:2px}
.tf .nmx{white-space:nowrap}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle}
.frac>span{padding:0 4px;white-space:nowrap}
.frac>span:first-child{border-bottom:1.4px solid currentColor}
.ptab{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.ptab td,.ptab th{padding:4px 6px;text-align:right;border-bottom:1px solid var(--border)}
.ptab th{color:var(--muted);font-weight:600;font-size:12px}
.ptab td:first-child,.ptab th:first-child{text-align:left}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.note{font-size:12.5px;color:var(--muted);margin-top:6px}
.err-box{background:rgba(239,68,68,.12);color:var(--bad);border-radius:8px;padding:9px 11px;font-size:13.5px;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}

/* metrics */
.table-wrap{overflow-x:auto;padding:4px 8px 10px}
#metrics{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
#metrics th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;text-align:right;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
#metrics td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
#metrics th:first-child,#metrics td:first-child,#metrics th:nth-child(2),#metrics td:nth-child(2),#metrics th:nth-child(3),#metrics td:nth-child(3){text-align:left}
#metrics tr.sel td{background:var(--accent-soft)}
#metrics tbody tr{cursor:pointer}
#metrics .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.s-ok{color:var(--good);font-weight:700}.s-mg{color:var(--warn);font-weight:700}.s-bad{color:var(--bad);font-weight:700}

/* floating editor */
.floating{position:fixed;right:24px;top:130px;width:380px;max-width:calc(100vw - 24px);background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);z-index:50;display:flex;flex-direction:column;max-height:calc(100vh - 150px)}
.fl-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border);cursor:move;user-select:none;font-weight:700;gap:8px}
.fl-head .x{border:0;background:transparent;cursor:pointer;font-size:16px;color:var(--muted)}
.fl-body{padding:12px 14px 14px;overflow:auto}
.help{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.help code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick button{border:1px solid var(--border);background:var(--panel2);border-radius:7px;padding:3px 8px;font-size:12.5px;cursor:pointer;font-family:ui-monospace,Menlo,Consolas,monospace}
.quick button:hover{border-color:var(--accent)}
.preview{margin-top:10px;padding:10px;border-radius:9px;background:var(--panel2)}
.ferr{color:var(--bad);font-size:13px;font-weight:600;margin-top:6px;min-height:1px}

.bottombar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 18px 16px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--border);background:var(--panel)}
.bottombar b{color:var(--text)}

@media (max-width:1150px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .diagram-card,.plot-card,.metrics-card,.analysis-card{grid-column:1;grid-row:auto}
  .analysis-inner{position:static;max-height:none}
  .brand-sub{display:none}
}
@media (max-width:640px){
  .topbar,.toolbar{padding-left:10px;padding-right:10px}
  .layout{padding:0 10px 10px}
  .floating{left:12px;right:12px;width:auto;top:auto;bottom:12px;max-height:60vh}
  .btn.hide-sm{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" id="brandLink" href="index.html">
    <img id="brandLogo" alt="RAIN">
    <div>
      <div class="brand-title"><span class="prod" id="bProd">RIDE</span><span class="sep">/</span><span id="bMod">Control Systems Lab</span></div>
      <div class="brand-sub" id="bOrg"></div>
    </div>
  </a>
  <div class="top-actions">
    <a class="btn hide-sm" id="homeBtn" href="index.html">← All modules</a>
    <button class="btn icon" id="themeBtn" title="Switch light / dark">☀️</button>
  </div>
</header>

<div class="toolbar">
  <div class="sysbar" id="sysbar"></div>
  <div class="tb-right">
    <div class="dd"><button class="btn" id="exBtn">📚 Examples ▾</button><div class="menu" id="exMenu"></div></div>
    <div class="dd"><button class="btn primary" id="ctlBtn">⚙ Controls ▾</button>
      <div class="menu panel" id="ctlMenu">
        <h4>Reference input r(t)</h4>
        <div class="frow two"><label>Signal</label><select id="refType"><option value="step">Step</option><option value="impulse">Impulse</option><option value="ramp">Ramp</option><option value="sine">Sine wave</option><option value="square">Square wave</option></select></div>
        <div class="frow two"><label id="refAmpLbl">Amplitude</label><input type="number" id="refAmp" step="0.1"></div>
        <div class="frow two"><label>Starts at (s)</label><input type="number" id="refT0" step="0.1" min="0"></div>
        <div class="frow two" id="refFreqRow"><label>Frequency (Hz)</label><input type="number" id="refFreq" step="0.05" min="0.001"></div>
        <h4>Simulation</h4>
        <label class="chk"><input type="checkbox" id="simAuto"> Choose duration automatically</label>
        <div class="frow two"><label>Duration (s)</label><input type="number" id="simT" step="1" min="0.1"></div>
        <div class="frow two"><label>Resolution</label><select id="simN"><option value="2000">2 000 steps</option><option value="4000">4 000 steps</option><option value="8000">8 000 steps</option><option value="16000">16 000 steps</option></select></div>
        <h4>Performance</h4>
        <div class="frow two"><label>Settling band</label><select id="band"><option value="2">±2 %</option><option value="5">±5 %</option></select></div>
        <h4>Display</h4>
        <label class="chk"><input type="checkbox" id="optMarkers"> Show rise, peak and settling markers</label>
        <label class="chk"><input type="checkbox" id="optOverlay"> Also draw each plant alone (dashed)</label>
        <h4>All systems</h4>
        <div class="btnrow" style="margin-top:0">
          <button class="btn sm" id="allClosed">Close every loop</button>
          <button class="btn sm" id="allOpen">Open every loop</button>
          <button class="btn sm" id="allShow">Show all</button>
        </div>
      </div>
    </div>
    <div class="dd"><button class="btn" id="fileBtn">⬇ File ▾</button>
      <div class="menu" id="fileMenu">
        <button class="mi" data-f="png">Download plot (PNG)<small>The current plot tab as an image</small></button>
        <button class="mi" data-f="csv">Download response data (CSV)<small>r, y, u, e for every visible system</small></button>
        <button class="mi" data-f="save">Save this setup<small>A .json file you can load in class</small></button>
        <button class="mi" data-f="load">Load a saved setup…</button>
        <button class="mi" data-f="reset">Reset the lab</button>
      </div>
    </div>
  </div>
</div>

<main class="layout">
  <section class="card diagram-card">
    <div class="card-head">
      <div class="title">Block diagram · <span id="dgName"></span></div>
      <div class="seg" id="loopSeg"><button data-loop="open">Open loop</button><button data-loop="closed">Closed loop</button></div>
    </div>
    <div class="palette" id="palette"></div>
    <div class="diagram-wrap"><svg id="diagram" viewBox="0 0 1000 248" xmlns="http://www.w3.org/2000/svg"></svg></div>
  </section>

  <aside class="card analysis-card"><div class="analysis-inner" id="analysis"></div></aside>

  <section class="card plot-card">
    <div class="card-head plot-head">
      <div class="tabs" id="tabs">
        <button class="tab" data-tab="time">Time response</button>
        <button class="tab" data-tab="pz">Pole-zero map</button>
        <button class="tab" data-tab="bode">Bode</button>
        <button class="tab" data-tab="rl">Root locus</button>
        <button class="tab" data-tab="routh">Routh table</button>
      </div>
      <div class="plot-tools" id="plotTools"></div>
    </div>
    <div class="plot-wrap" id="plotWrap">
      <canvas id="plot"></canvas>
      <div class="routh hidden" id="routh"></div>
      <div class="plot-hint" id="plotHint"></div>
    </div>
  </section>

  <section class="card metrics-card">
    <div class="card-head"><div class="title">Performance comparison</div><div class="sub" id="metricsSub"></div></div>
    <div class="table-wrap"><table id="metrics"></table></div>
  </section>
</main>

<footer class="bottombar">
  <span><b id="fOrg"></b> · <span id="fProd"></span></span>
  <span>Drag a block onto the diagram, or click an empty slot · Click any block to edit it</span>
</footer>

<div class="floating hidden" id="editor">
  <div class="fl-head" id="edHead"><span id="edTitle"></span><button class="x" id="edClose" title="Close">✕</button></div>
  <div class="fl-body" id="edBody"></div>
</div>
<input type="file" id="loadFile" accept=".json,application/json" class="hidden">

<script>
'use strict';
/* =========================================================
   Branding: change these to rebrand the module
   ========================================================= */
const BRAND = {
  product: 'RIDE',
  productLong: 'Robotics Intelligence Development Environment',
  module: 'Control Systems Lab',
  org: 'Robotics & Artificial Intelligence Nigeria',
  logo: 'https://study.rainigeria.com/static/rainlogo.jpg',
  home: 'index.html',
  themeKey: 'ride-theme',
  stateKey: 'ride-control-lab-v1'
};
const COLORS = ['#2563eb','#ea580c','#16a34a','#dc2626','#9333ea','#0891b2'];

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));

/* ---------------- number formatting ---------------- */
function fmt(v, p=3){
  if (v === null || v === undefined || Number.isNaN(v)) return '—';
  if (!isFinite(v)) return v > 0 ? '∞' : '−∞';
  const a = Math.abs(v);
  if (a !== 0 && (a >= 1e5 || a < 1e-3)) return v.toExponential(2).replace('-', '−');
  return Number(v.toPrecision(p)).toString().replace('-', '−');
}
const fmtC = v => fmt(v, 4);
const SUP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const supNum = n => String(n).split('').map(c => SUP[c]).join('');

/* ---------------- complex ---------------- */
const cmul = (a,b) => [a[0]*b[0]-a[1]*b[1], a[0]*b[1]+a[1]*b[0]];
const cdiv = (a,b) => { const d = b[0]*b[0]+b[1]*b[1]; return [(a[0]*b[0]+a[1]*b[1])/d, (a[1]*b[0]-a[0]*b[1])/d]; };
const cadd = (a,b) => [a[0]+b[0], a[1]+b[1]];
const cabs = a => Math.hypot(a[0], a[1]);

/* ---------------- polynomials (ascending powers) ---------------- */
const P = {
  trim(a){
    let m = 0; for (const v of a) m = Math.max(m, Math.abs(v));

/* ---------------- polynomial roots (Aberth–Ehrlich) ---------------- */

}

/* ---------------- transfer-function parser ---------------- */

function stepMetrics(sim, m, A, t0, band, hasSat){

  let last = -1;
  for (let i=i0;i<n;i++) if (Math.abs(z(i) - 1) > b) last = i;
  const settled = last < n-1;
  const ts = last < 0 ? 0 : (settled ? t[last+1] - t0 : null);

  const zero = P.isZero(m.L0.n);
  for (let i=0;i<n;i++){
    const w = ws[i];

function routhTable(asc){

    const row = rows[i], above = rows[i-1];

  const res = S.systems.map(sys => ({sys, m:buildModel(sys)}));
  if (S.sim.auto) S.sim.tFinal = autoTime(res);
  const tF = Math.max(0.05, +S.sim.tFinal || 10), N = +S.sim.N || 4000;
  const stepRef = S.ref.type === 'step' ? {type:'step', amp:+S.ref.amp || 1, t0:+S.ref.t0 || 0} : {type:'step', amp:1, t0:0};
  res.forEach(r => {
    if (r.m.err) return;
    try {
      r.sim = simulate(r.sys, r.m, {tF, N, ref:S.ref});
      const needClean = S.ref.type !== 'step' || r.sys.din || r.sys.dout || r.sys.noise;
      r.clean = needClean ? simulate(r.sys, r.m, {tF, N, ref:stepRef, clean:true}) : r.sim;
      r.met = stepMetrics(r.clean, r.m, stepRef.amp, stepRef.t0, +S.band, r.sys.sat ? {lo:Math.min(+r.sys.sat.min, +r.sys.sat.max), hi:Math.max(+r.sys.sat.min, +r.sys.sat.max)} : null);
      r.mar = margins(r.m);
      if (S.overlay) r.plant = simulate(r.sys, r.m, {tF, N, ref:S.ref, plantOnly:true});
    } catch(e){ r.m.err = 'Simulation: ' + e.message; }
  });
  RES = res;
}

/* =========================================================
   Rendering helpers
   ========================================================= */
function polyFmt(a, html){
  a = P.trim(a);
  let mx = 0; for (const v of a) mx = Math.max(mx, Math.abs(v));
  const parts = [];
  for (let i=a.length-1;i>=0;i--){
    const c = a[i];
    if (Math.abs(c) <= 1e-12*mx || c === 0) continue;
    const ac = Math.abs(c);
    let coef = (i > 0 && Math.abs(ac-1) < 1e-9) ? '' : fmtC(ac);
    if (/e/.test(coef)){ const [mm, ee] = ac.toExponential(2).split('e'); const ex = parseInt(ee, 10); coef = html ? Number(mm) + '×10<sup>' + ex + '</sup>' : Number(mm) + '×10' + (ex < 0 ? '⁻' : '') + supNum(Math.abs(ex)); if (i > 0) coef += html ? '&#8202;' : ''; }
    const pw = i === 0 ? '' : (i === 1 ? 's' : (html ? 's<sup>' + i + '</sup>' : 's' + supNum(i)));
    parts.push({neg:c < 0, term:coef + pw});
  }
  if (!parts.length) return '0';
  let s = (parts[0].neg ? '−' : '') + parts[0].term;
  for (let i=1;i<parts.length;i++) s += (parts[i].neg ? ' − ' : ' + ') + parts[i].term;
  return s;
}
function fracHTML(tf){
  const n = P.trim(tf.n), d = P.trim(tf.d);
  if (d.length === 1){ const k = n.map(v => v/d[0]); return '<span class="nmx">' + polyFmt(k, true) + '</span>'; }
  return '<span class="frac"><span>' + polyFmt(n, true) + '</span><span>' + polyFmt(d, true) + '</span></span>';
}
function cplx(p){
  const re = Math.abs(p[0]) < 1e-12 ? 0 : p[0];
  if (Math.abs(p[1]) < 1e-12) return fmtC(re);
  return fmtC(re) + (p[1] < 0 ? ' − ' : ' + ') + fmtC(Math.abs(p[1])) + 'j';
}
function pairList(rs){
  const out = [], used = new Array(rs.length).fill(false);
  rs.forEach((p,i) => {
    if (used[i]) return; used[i] = true;
    if (p[1] !== 0){
      const j = rs.findIndex((q,k) => !used[k] && Math.abs(q[0]-p[0]) < 1e-6*(1+Math.abs(p[0])) && Math.abs(q[1]+p[1]) < 1e-6*(1+Math.abs(p[1])));
      if (j >= 0){ used[j] = true; out.push({p:[p[0], Math.abs(p[1])], pair:true}); return; }
    }
    out.push({p, pair:false});
  });
  return out.sort((a,b) => b.p[0] - a.p[0]);
}
function pairStr(o){
  const p = o.p;
  if (!o.pair) return cplx(p);
  return fmtC(Math.abs(p[0]) < 1e-12 ? 0 : p[0]) + ' ± ' + fmtC(p[1]) + 'j';
}

$('#sysbar').addEventListener('click', ev => {
  if (ev.target.id === 'addSys'){
    const i = S.systems.length;
    const used = new Set(S.systems.map(s => s.color));
    const s = mkSys(i, {color:COLORS.find(c => !used.has(c)) || COLORS[i%6]});
    S.systems.push(s); S.sel = i; closeEditor(); update(true); return;
  }
  if (ev.target.id === 'dupSys'){
    const s = clone(cur()); s.id = uid(); s.name = s.name + ' (copy)';
    const used = new Set(S.systems.map(x => x.color)); s.color = COLORS.find(c => !used.has(c)) || s.color;
    S.systems.push(s); S.sel = S.systems.length-1; closeEditor(); update(true); return;
  }
  const chip = ev.target.closest('.chip'); if (!chip) return;
  const i = +chip.dataset.i;
  const act = ev.target.dataset.act;
  if (act === 'eye'){ S.systems[i].visible = !S.systems[i].visible; update(true); return; }
  if (act === 'del'){
    if (!confirm('Delete "' + S.systems[i].name + '"?')) return;
    S.systems.splice(i,1); S.sel = clamp(S.sel >= i ? S.sel-1 : S.sel, 0, S.systems.length-1); closeEditor(); update(true); return;
  }
  if (S.sel !== i){ S.sel = i; closeEditor(); update(true); }
});
$('#sysbar').addEventListener('dblclick', ev => {

let dragSlot = null;
function renderPalette(){

$('#palette').addEventListener('click', ev => { const p = ev.target.closest('.pal'); if (p) addBlock(p.dataset.add); });
$('#palette').addEventListener('dragstart', ev => {

function addBlock(add){
  const p = PALETTE.find(x => x.add === add); if (!p) return;

  openEditor(p.slot);

function removeBlock(slot){ cur()[slot] = null; if (edSlot === slot) closeEditor(); update(true); }

function svgText(x, y, str, o={}){
  const size = o.size || 14, maxW = o.maxW || 0;
  const est = String(str).length*size*0.56;
  const fit = maxW && est > maxW ? ' textLength="' + maxW + '" lengthAdjust="spacingAndGlyphs"' : '';
  return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" text-anchor="' + (o.anchor || 'middle') + '" fill="' + (o.fill || '#0f172a') + '"' +
    (o.weight ? ' font-weight="' + o.weight + '"' : '') + (o.italic ? ' font-style="italic"' : '') + fit + '>' + esc(str) + '</text>';
}
function renderDiagram(){
  const sys = cur(), closed = sys.loop === 'closed';
  const r = RES[S.sel] || {};
  const yM = 92, yF = 205, BH = 58;
  const X = {F:[60,92], S1:198, ctrl:[240,128], sat:[392,72], delay:[488,86], din:604, G:[640,136], dout:818, take:874, out:962, H:[612,124], noise:[800]};
  let g = '';
  const ink = '#334155', faint = '#cbd5e1';
  g += '<defs><marker id="ar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="' + ink + '"/></marker></defs>';
  const hot = slot => dragSlot === slot ? ' hot' : '';
  const caption = (x, y, str) => svgText(x, y, str, {size:12, fill:'#64748b', weight:600});
  const ghostBox = (slot, x, w, y, label) => '<g class="ghost' + hot(slot) + '" data-slot="' + slot + '"><rect x="' + x + '" y="' + (y-BH/2+8) + '" width="' + w + '" height="' + (BH-16) + '" rx="8" fill="#fff" stroke="#94a3b8" stroke-opacity=".55" stroke-dasharray="5 4"/>' + svgText(x+w/2, y-7, label, {size:11, fill:'#94a3b8', weight:600}) + svgText(x+w/2, y+16, '+', {size:13, fill:'#cbd5e1', weight:700}) + '</g>';
  const ghostSum = (slot, cx, cy, label) => '<g class="ghost' + hot(slot) + '" data-slot="' + slot + '"><circle class="gc" cx="' + cx + '" cy="' + cy + '" r="10" fill="#fff" stroke="#94a3b8" stroke-opacity=".55" stroke-dasharray="3 3"/>' + svgText(cx, cy + (slot === 'noise' ? 26 : -16), label, {size:11, fill:'#94a3b8', weight:600}) + '</g>';
  const rmBtn = (slot, x, y) => '<g class="rm" data-rm="' + slot + '"><circle cx="' + x + '" cy="' + y + '" r="9" fill="#fff" stroke="#94a3b8"/><text x="' + x + '" y="' + (y+4) + '" font-size="12" text-anchor="middle" fill="#64748b">✕</text></g>';
  const blockBox = (slot, x, w, y, inner, cap, capBelow, removable) => {
    let s = '<g class="blk' + hot(slot) + '" data-slot="' + slot + '"><rect class="bx" x="' + x + '" y="' + (y-BH/2) + '" width="' + w + '" height="' + BH + '" rx="9" fill="#f8fafc" stroke="' + ink + '" stroke-width="1.6"/>' + inner;
    s += caption(x+w/2, capBelow ? y+BH/2+16 : y-BH/2-8, cap) + '</g>';
    if (removable) s += rmBtn(slot, x+w-2, y-BH/2+2);
    return s;
  };
  const fracSvg = (tf, cx, cy, w) => {
    const n = P.trim(tf.n), d = P.trim(tf.d);
    if (d.length === 1) return svgText(cx, cy+5, polyFmt(n.map(v => v/d[0]), false), {size:15, maxW:w-14});
    const ns = polyFmt(n, false), ds = polyFmt(d, false);
    const L = Math.max(ns.length, ds.length), sz = L > 20 ? 12 : 14.5;
    return svgText(cx, cy-6, ns, {size:sz, maxW:w-14}) + '<line x1="' + (cx - w/2 + 8) + '" y1="' + cy + '" x2="' + (cx + w/2 - 8) + '" y2="' + cy + '" stroke="#0f172a" stroke-width="1.2"/>' + svgText(cx, cy+17, ds, {size:sz, maxW:w-14});
  };
  const sumCircle = (cx, cy, rr) => '<circle cx="' + cx + '" cy="' + cy + '" r="' + rr + '" fill="#fff" stroke="' + ink + '" stroke-width="1.6"/><line x1="' + (cx-rr*0.7) + '" y1="' + (cy-rr*0.7) + '" x2="' + (cx+rr*0.7) + '" y2="' + (cy+rr*0.7) + '" stroke="' + ink + '" stroke-width="1.2"/><line x1="' + (cx-rr*0.7) + '" y1="' + (cy+rr*0.7) + '" x2="' + (cx+rr*0.7) + '" y2="' + (cy-rr*0.7) + '" stroke="' + ink + '" stroke-width="1.2"/>';
  const descD = d => d.type === 'step' ? 'step ' + fmt(+d.mag) + ' at ' + fmt(+d.t0) + ' s' : d.type === 'pulse' ? 'pulse ' + fmt(+d.mag) + ', ' + fmt(+d.dur) + ' s' : 'sine ' + fmt(+d.mag) + ' @ ' + fmt(+d.freq) + ' Hz';

  // ghosts first (behind wires)
  if (!sys.prefilter) g += ghostBox('prefilter', X.F[0], X.F[1], yM, 'Prefilter');
  if (!sys.ctrl) g += ghostBox('ctrl', X.ctrl[0], X.ctrl[1], yM, 'Controller');
  if (!sys.sat) g += ghostBox('sat', X.sat[0], X.sat[1], yM, 'Saturation');
  if (!sys.delay) g += ghostBox('delay', X.delay[0], X.delay[1], yM, 'Delay');
  if (!sys.din) g += ghostSum('din', X.din, yM, 'dᵢ');
  if (!sys.dout) g += ghostSum('dout', X.dout, yM, 'dₒ');
  if (closed){
    if (!sys.sensor) g += ghostBox('sensor', X.H[0], X.H[1], yF, 'Sensor');

  // forward path element list

  for (let i=1;i<el.length;i++){

  } else {
    g += '<path d="M' + X.take + ' ' + yM + ' V' + yF + ' H' + X.S1 + ' V' + (yM+18) + '" fill="none" stroke="' + faint + '" stroke-width="1.5" stroke-dasharray="6 5"/>';
    g += '<circle cx="' + X.S1 + '" cy="' + yM + '" r="12" fill="#fff" stroke="' + faint + '" stroke-dasharray="3 3"/>';
    g += svgText((X.S1+X.take)/2, yF-8, 'Feedback is open · switch to Closed loop to use it', {size:12, fill:'#94a3b8', weight:600});

  if (sys.prefilter){ let t; try { t = parseTF(sys.prefilter.expr); } catch(e){ t = null; } g += blockBox('prefilter', X.F[0], X.F[1], yM, t ? fracSvg(t, X.F[0]+X.F[1]/2, yM, X.F[1]) : svgText(X.F[0]+X.F[1]/2, yM+5, '?', {size:16}), 'Prefilter F(s)', false, true); }
  if (sys.ctrl){
    const c = sys.ctrl, cx = X.ctrl[0]+X.ctrl[1]/2;

    if (c.kind === 'pid'){
      const parts = ['Kp ' + fmt(+c.Kp)];
      if (c.type.includes('I')) parts.push('Ki ' + fmt(+c.Ki));

    g += blockBox('ctrl', X.ctrl[0], X.ctrl[1], yM, inner, cap, false, true);

/* =========================================================
   Editor (floating, draggable)
   ========================================================= */
let edSlot = null;
const SLOT_TITLE = {G:'Plant G(s)', ctrl:'Controller', delay:'Time delay', sat:'Actuator saturation', prefilter:'Prefilter F(s)', sensor:'Sensor H(s)', din:'Input disturbance dᵢ(t)', dout:'Output disturbance dₒ(t)', noise:'Sensor noise n(t)'};
function closeEditor(){ edSlot = null; $('#editor').classList.add('hidden'); }
$('#edClose').addEventListener('click', closeEditor);
(function dragEditor(){
  const ed = $('#editor'), h = $('#edHead'); let st = null;
  h.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; const r = ed.getBoundingClientRect(); st = {x:e.clientX, y:e.clientY, l:r.left, t:r.top}; h.setPointerCapture(e.pointerId); });
  h.addEventListener('pointermove', e => { if (!st) return; ed.style.left = clamp(st.l + e.clientX - st.x, 0, innerWidth - 120) + 'px'; ed.style.top = clamp(st.t + e.clientY - st.y, 0, innerHeight - 60) + 'px'; ed.style.right = 'auto'; ed.style.bottom = 'auto'; });
  h.addEventListener('pointerup', () => { st = null; });
})();
function numRow(label, key, val, o={}){
  const step = o.step || 0.01;
  const max = o.max !== undefined ? o.max : niceCeil(Math.max(o.minMax || 10, Math.abs(+val)*3 || 1));
  const min = o.min !== undefined ? o.min : 0;
  return '<div class="frow' + (o.dim ? ' dim' : '') + '"><label>' + label + '</label>' +
    (o.noSlider ? '<span></span>' : '<input type="range" data-k="' + key + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '">') +
    '<input type="number" data-k="' + key + '" step="' + step + '" value="' + val + '"' + (o.minAttr !== undefined ? ' min="' + o.minAttr + '"' : '') + '></div>';
}
function tfInput(key, val, examples){
  return '<input type="text" class="tfin" data-tf="' + key + '" value="' + esc(val) + '" spellcheck="false" autocomplete="off">' +
    '<div class="ferr" id="tfErr"></div>' +
    (examples ? '<div class="quick">' + examples.map(x => '<button data-ex="' + esc(x) + '">' + esc(x) + '</button>').join('') + '</div>' : '') +
    '<div class="help">Type it the way you write it: <code>10/(s^2+2s+10)</code>, <code>(s+1)/(s(s+2)(s+5))</code>, <code>1/(0.5s+1)^2</code>. Coefficient lists also work: <code>[1]/[1 2 10]</code>.</div>' +
    '<div class="preview" id="tfPrev"></div>';
}
function openEditor(slot){

}
function renderEditor(){
  const slot = edSlot, sys = cur(); if (!slot) return;

  const footer = (canRemove) => '<div class="btnrow"><button class="btn sm" data-act="all">Apply to all systems</button>' + (canRemove ? '<button class="btn sm danger" data-act="remove">Remove block</button>' : '') + '</div>';
  if (slot === 'G'){
    h += tfInput('plant', sys.plant, ['1/(s+1)','4/(s^2+0.8s+4)','1/((s+1)(s+2)(s+3))','10/(s(s+2))','(1-s)/((s+1)(s+2))','1/(s-1)','1/(s^2+1)']);
    h += footer(false).replace('Apply to all systems', 'Use this plant in all systems');
  } else if (slot === 'ctrl'){
    h += '<div class="frow two"><label>Type</label><div class="seg" id="ctrlKind"><button data-kind="pid">PID</button><button data-kind="leadlag">Lead/lag</button><button data-kind="tf">Custom</button></div></div>';
    if (b.kind === 'pid'){
      h += '<div class="frow two"><label>Action</label><div class="seg" id="pidType">' + ['P','PI','PD','PID'].map(t => '<button data-t="' + t + '"' + (b.type === t ? ' class="on"' : '') + '>' + t + '</button>').join('') + '</div></div>';
      h += numRow('Kp', 'Kp', b.Kp, {minMax:10});
      h += numRow('Ki', 'Ki', b.Ki, {minMax:10, dim:!b.type.includes('I')});
      h += numRow('Kd', 'Kd', b.Kd, {minMax:5, dim:!b.type.includes('D')});
      h += numRow('Filter N', 'N', b.N, {min:1, max:1000, step:1, dim:!b.type.includes('D')});
      h += '<div class="help">C(s) = Kp + Ki/s + Kd·N·s/(s + N). The filter N keeps the derivative term realisable; larger N is closer to a pure derivative.</div>';
    } else if (b.kind === 'leadlag'){
      h += numRow('Gain K', 'K', b.K, {minMax:10});

      h += '<div class="help">C(s) = K(s + z)/(s + p). Lead when z &lt; p (adds phase), lag when z &gt; p (boosts low-frequency gain).</div>';
    } else {

    h += '<div class="help">Pure transport delay e<sup>−Ts</sup>. The time response uses the exact delay; poles, Routh and root locus use a 3rd-order Padé approximation.</div>';
    h += footer(true);
  } else if (slot === 'sat'){
    h += numRow('Minimum u', 'min', b.min, {min:-20, max:0, step:0.1, minMax:20});
    h += numRow('Maximum u', 'max', b.max, {min:0, max:20, step:0.1});

    h += footer(true);

    h += tfInput(slot, b.expr, slot === 'prefilter' ? ['1/(0.5s+1)','1/(s+1)^2','2'] : ['1/(0.05s+1)','1','1/(0.2s+1)']);

    h += numRow('Size', 'mag', b.mag, {min:-5, max:5, step:0.05});
    h += numRow('Starts at (s)', 't0', b.t0, {max:niceCeil(Math.max(20, +b.t0*2)), step:0.1});
    if (b.type === 'pulse') h += numRow('Duration (s)', 'dur', b.dur, {max:10, step:0.05});
    if (b.type === 'sine') h += numRow('Freq (Hz)', 'freq', b.freq, {max:5, step:0.01});
    h += '<div class="help">' + (slot === 'din' ? 'Added to the control signal at the plant input, like a load torque on a motor.' : 'Added directly to the plant output, like a sudden offset in the measured quantity.') + '</div>';
    h += footer(true);
  } else if (slot === 'noise'){
    h += numRow('Std dev σ', 'sigma', b.sigma, {max:0.5, step:0.001});
    h += '<div class="btnrow" style="margin-top:4px"><button class="btn sm" data-act="reseed">New noise sample</button></div>';
    h += '<div class="help">White Gaussian noise added to the measurement. It reaches the plant through the controller; derivative action amplifies it. Switch the plot to u(t) or "Measured y + n" to see it.</div>';
    h += footer(true);
  }
  $('#edBody').innerHTML = h;
  if (slot === 'ctrl') $$('#ctrlKind button').forEach(x => x.classList.toggle('on', x.dataset.kind === b.kind));
  refreshEditorPreview();
}
function refreshEditorPreview(){
  const slot = edSlot, sys = cur(); if (!slot) return;
  const r = RES[S.sel];
  const prev = $('#tfPrev'), cprev = $('#cPrev');

    try { const tf = parseTF(key); const nm = {G:'G', ctrl:'C', prefilter:'F', sensor:'H'}[slot]; prev.innerHTML = '<div class="tf"><span class="nmx">' + nm + '(s) =</span>' + fracHTML(tf) + '</div>'; } catch(e){ prev.innerHTML = ''; }

$('#edBody').addEventListener('input', ev => {
  const t = ev.target, sys = cur();
  if (t.dataset.k){
    const blk = sys[edSlot]; if (!blk) return;
    let v = parseFloat(t.value); if (!isFinite(v)) return;

    $$('[data-k="' + t.dataset.k + '"]', $('#edBody')).forEach(o => { if (o !== t){ if (o.type === 'range' && v > +o.max) o.max = niceCeil(v*1.5); if (o.type === 'range' && v < +o.min) o.min = v; o.value = v; } });

function commitTF(key, val){
  const sys = cur(), err = $('#tfErr');
  try {
    const tf = parseTF(val);
    if (!R.proper(tf)) throw new Error('Numerator degree must not exceed denominator degree');
    if (err) err.textContent = '';
    if (key === 'plant') sys.plant = val; else if (key === 'ctrl') sys.ctrl.expr = val; else sys[key].expr = val;
    update(false);
  } catch(e){ if (err) err.textContent = e.message; }
}
$('#edBody').addEventListener('click', ev => {
  const t = ev.target, sys = cur();
  if (t.dataset.ex){ const inp = $('input.tfin', $('#edBody')); inp.value = t.dataset.ex; commitTF(inp.dataset.tf, inp.value); return; }
  if (t.dataset.kind){ if (sys.ctrl.kind !== t.dataset.kind){ sys.ctrl = DEF[t.dataset.kind === 'tf' ? 'ctf' : t.dataset.kind](); update(true); renderEditor(); } return; }
  if (t.dataset.t){ sys.ctrl.type = t.dataset.t; update(true); renderEditor(); return; }
  if (t.dataset.v){ sys[edSlot].type = t.dataset.v; update(true); renderEditor(); return; }
  const act = t.dataset.act;
  if (act === 'remove'){ removeBlock(edSlot); return; }
  if (act === 'reseed'){ sys.noise.seed = Math.floor(Math.random()*1e9); update(false); return; }
  if (act === 'all'){
    if (edSlot === 'G') S.systems.forEach(s => s.plant = sys.plant);
    else S.systems.forEach(s => { s[edSlot] = clone(sys[edSlot]); });
    update(true);
    t.textContent = 'Applied ✓'; setTimeout(() => { if (t.isConnected) t.textContent = edSlot === 'G' ? 'Use this plant in all systems' : 'Apply to all systems'; }, 1200);
  }
});

function renderAnalysis(){
  const sys = cur(), r = RES[S.sel], m = r.m;
  let h = '<div class="an-head"><span class="dot" style="background:' + sys.color + '"></span><span class="nm">' + esc(sys.name) + '</span>';
  if (m.err){ $('#analysis').innerHTML = h + '<span class="badge err">Error</span></div><div class="err-box">' + esc(m.err) + '</div>'; return; }
  h += '<span class="badge ' + m.stab + '">' + STAB_LABEL[m.stab] + '</span></div>';
  h += '<div class="kv"><span>Configuration</span><span>' + (m.closed ? 'Closed loop (negative feedback)' : 'Open loop') + '</span>';
  if (m.rhp) h += '<span>RHP poles</span><span class="s-bad">' + m.rhp + '</span>';
  h += '</div>';
  h += '<div class="an-sec"><div class="lbl">Transfer functions</div>';
  h += '<div class="tf"><span class="nmx">G(s) =</span>' + fracHTML(m.G) + '</div>';
  h += '<div class="tf" style="margin-top:6px"><span class="nmx">C(s) =</span>' + (sys.ctrl ? fracHTML(m.C) : '<span class="nmx">1 &nbsp;<span style="font-size:13px;color:var(--muted);font-family:inherit">(no controller)</span></span>') + '</div>';
  if (m.T > 0) h += '<div class="tf" style="margin-top:6px"><span class="nmx">Delay: e<sup>−' + fmt(m.T) + 's</sup></span></div>';
  if (sys.prefilter) h += '<div class="tf" style="margin-top:6px"><span class="nmx">F(s) =</span>' + fracHTML(m.F) + '</div>';
  if (sys.sensor && m.closed) h += '<div class="tf" style="margin-top:6px"><span class="nmx">H(s) =</span>' + fracHTML(m.H) + '</div>';
  h += '</div>';
  h += '<div class="an-sec"><div class="lbl">' + (m.closed ? 'Loop gain L(s) = C·G·H' : 'Loop gain if the loop were closed') + '</div><div class="tf">' + fracHTML(R.monic(m.L0)) + (m.T > 0 ? '<span class="nmx">· e<sup>−' + fmt(m.T) + 's</sup></span>' : '') + '</div></div>';
  h += '<div class="an-sec"><div class="lbl">Overall Y(s)/R(s)' + (m.T > 0 ? ' · Padé delay' : '') + '</div><div class="tf">' + fracHTML(m.Tf) + '</div>';
  if (m.closed) h += '<div class="note">Characteristic equation: ' + polyFmt(R.monic({n:[1], d:m.char}).d, true) + ' = 0</div>';
  h += '</div>';
  const pl = pairList(m.poles);
  h += '<div class="an-sec"><div class="lbl">Poles (' + m.poles.length + ')</div>';
  if (!pl.length) h += '<div class="note">No poles: the system is a pure gain.</div>';
  else {
    h += '<table class="ptab"><tr><th>Pole</th><th>ζ</th><th>ωn (rad/s)</th></tr>';
    const sc = Math.max(1, ...m.poles.map(p => Math.hypot(p[0],p[1])));
    pl.forEach(o => {
      const p = o.p, wn = Math.hypot(p[0], p[1]), z = wn > 1e-12 ? -p[0]/wn : null;
      const col = p[0] > 1e-6*sc ? 'var(--bad)' : (Math.abs(p[0]) <= 1e-6*sc ? 'var(--warn)' : 'var(--good)');
      h += '<tr><td><span class="pdot" style="background:' + col + '"></span>' + pairStr(o) + '</td><td>' + (z === null ? '—' : fmt(z)) + '</td><td>' + fmt(wn) + '</td></tr>';
    });
    h += '</table>';
  }
  if (m.zeros.length) h += '<div class="note" style="margin-top:8px"><b>Zeros:</b> ' + pairList(m.zeros).map(pairStr).join(', ') + '</div>';
  h += '</div>';
  // dominant pole insight
  if (m.stab === 'stable' && pl.length){
    const dom = pl.find(o => !m.zeros.some(z => Math.hypot(z[0]-o.p[0], Math.abs(z[1])-o.p[1]) < 0.02*(1+Math.hypot(o.p[0],o.p[1])))) || pl[0];
    const p = dom.p, wn = Math.hypot(p[0],p[1]), z = -p[0]/wn;
    h += '<div class="an-sec"><div class="lbl">Dominant pole estimate</div><div class="kv">';
    if (dom.pair && z < 1){
      const mp = Math.exp(-Math.PI*z/Math.sqrt(1-z*z))*100;
      h += '<span>Damping ζ</span><span>' + fmt(z) + ' (underdamped)</span><span>Natural freq ωn</span><span>' + fmt(wn) + ' rad/s</span><span>2nd-order overshoot</span><span>≈ ' + fmt(mp) + ' %</span>';
    } else h += '<span>Dominant pole</span><span>' + pairStr(dom) + ' (real)</span><span>Time constant</span><span>' + fmt(1/Math.abs(p[0])) + ' s</span>';
    h += '<span>Settling ≈ 4/σ</span><span>' + fmt(4/Math.abs(p[0])) + ' s</span></div><div class="note">A quick hand estimate from the slowest pole; compare it with the measured values below the plot.</div></div>';
  }
  if (r.mar){
    h += '<div class="an-sec"><div class="lbl">Stability margins (from L)</div><div class="kv">';
    h += '<span>Gain margin</span><span>' + (isFinite(r.mar.gm) ? fmt(r.mar.gm) + ' dB at ' + fmt(r.mar.wpc) + ' rad/s' : '∞') + '</span>';
    h += '<span>Phase margin</span><span>' + (isFinite(r.mar.pm) ? fmt(r.mar.pm) + '° at ' + fmt(r.mar.wgc) + ' rad/s' : '∞') + '</span></div></div>';
  }
  if (m.T > 0) h += '<div class="note">Delay is exact in the time response and Bode plot; poles, Routh table and root locus use a 3rd-order Padé approximation.</div>';
  if (sys.sat) h += '<div class="note">Saturation is nonlinear: the poles and margins describe the loop while the actuator is not saturated.</div>';
  $('#analysis').innerHTML = h;
}

      const px = m1.X(mar.wpc);

      ctx.beginPath(); ctx.moveTo(px, m1.Y(clamp(0, mr[0], mr[1]))); ctx.lineTo(px, m1.Y(clamp(-mar.gm, mr[0], mr[1]))); ctx.stroke();
      label(ctx, px+6, clamp(m1.Y(-mar.gm/2), A1.y+16, A1.y+A1.h-6), 'GM ' + fmt(mar.gm) + ' dB', c);
    }
    if (isFinite(mar.pm) && mar.wgc >= wr[0] && mar.wgc <= wr[1]){
      const px = m2.X(mar.wgc), resp = loopResp(sr.m, [mar.wgc]), phv = resp.ph[0], base = phv - mar.pm;
      ctx.strokeStyle = c; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(px, m2.Y(clamp(base, pr[0], pr[1]))); ctx.lineTo(px, m2.Y(clamp(phv, pr[0], pr[1]))); ctx.stroke();
      label(ctx, px+6, clamp(m2.Y((base+phv)/2), A2.y+16, A2.y+A2.h-6), 'PM ' + fmt(mar.pm) + '°', c);
    }
  }
  legend(ctx, A1, vis.map(r => ({label:r.sys.name, color:r.sys.color})));
  if (hover){
    const pane = [A1, A2].find(A => hover.x >= A.x && hover.x <= A.x+A.w && hover.y >= A.y && hover.y <= A.y+A.h);
    if (pane && data.length){
      const lw = Math.log10(wr[0]) + (hover.x - pane.x)/pane.w*(Math.log10(wr[1]) - Math.log10(wr[0]));
      const i = clamp(Math.round((lw - Math.log10(wr[0]))/(Math.log10(wr[1]) - Math.log10(wr[0]))*(ws.length-1)), 0, ws.length-1);
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1;
      [A1, A2].forEach(A => { ctx.beginPath(); ctx.moveTo(hover.x, A.y); ctx.lineTo(hover.x, A.y+A.h); ctx.stroke(); });
      tooltip(ctx, pane, hover.x, hover.y, ['ω = ' + fmt(ws[i], 4) + ' rad/s'].concat(data.map(o => o.r.sys.name + ': ' + fmt(o.d.mag[i]) + ' dB, ' + fmt(o.d.ph[i]) + '°')), '#e2e8f0');
    }
  }
  $('#plotHint').textContent = (S.bodeOf === 'L' ? 'Loop gain L(jω) = C·G·H·e^(−jωT) with gain and phase margins' : 'Overall Y(jω)/R(jω)') + ' · Scroll: zoom · Drag: pan · Double-click: reset';
}

let rlCache = {key:null, data:null};
function drawRL(){
  const {ctx, W, H} = prepCanvas();
  const A = {x:66, y:14, w:W-66-16, h:H-14-62};
  const r = RES[S.sel];
  const msg = t => { ctx.fillStyle = '#64748b'; ctx.font = '600 15px ' + FONT; ctx.textAlign = 'center'; ctx.fillText(t, W/2, H/2); };
  if (!r || r.m.err){ msg('Fix the selected system first'); lastMap = null; return; }
  const key = JSON.stringify([r.m.L.n, r.m.L.d]);
  if (rlCache.key !== key){ rlCache = {key, data:rootLocus(r.m)}; }
  const rl = rlCache.data;
  if (!rl){ msg('The loop gain is zero. Add a controller or a plant with nonzero gain.'); lastMap = null; return; }
  const pts = [...rl.olp, ...rl.olz, ...rl.cur];
  rl.branches.forEach(b => b.forEach(p => { if (p.k <= 8) pts.push([p.re, p.im]); }));
  rl.crossings.forEach(c => pts.push(...c.pts));
  let [xr, yr] = boundsOf(pts, 2);
  [xr, yr] = equalAspect(xr, yr, A);
  if (view.rl){ xr = view.rl.x; yr = view.rl.y; }
  const {X, Y} = axes(ctx, A, xr, yr, {xlabel:'Real axis σ', ylabel:'Imaginary axis jω'});
  lastMap = {tab:'rl', panes:[{A, xr, yr}], eq:true};
  clipTo(ctx, A);
  const x0 = X(0);
  if (x0 < A.x + A.w){ ctx.fillStyle = 'rgba(239,68,68,.06)'; ctx.fillRect(Math.max(A.x, x0), A.y, A.x + A.w - Math.max(A.x, x0), A.h); }
  const c = r.sys.color;
  rl.branches.forEach(b => { line(ctx, b.map(p => p.re), b.map(p => p.im), X, Y, c, 2.4); });
  rl.olz.forEach(z => drawO(ctx, X(z[0]), Y(z[1]), 7, '#0f172a'));
  rl.olp.forEach(p => drawX(ctx, X(p[0]), Y(p[1]), 7.5, '#0f172a', 2.6));
  rl.crossings.forEach(cr => cr.pts.forEach(p => { ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.moveTo(X(p[0]), Y(p[1])-8); ctx.lineTo(X(p[0])+8, Y(p[1])); ctx.lineTo(X(p[0]), Y(p[1])+8); ctx.lineTo(X(p[0])-8, Y(p[1])); ctx.closePath(); ctx.fill(); if (p[1] >= 0) label(ctx, X(p[0])+10, Y(p[1])-6, 'k = ' + fmt(cr.k) + (Math.abs(p[1]) > 1e-6 ? ', ω = ' + fmt(Math.abs(p[1])) : ''), '#b45309'); }));
  rl.cur.forEach(p => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(X(p[0]), Y(p[1]), 6.5, 0, 7); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); });
  ctx.restore();
  // info box
  let info;
  const iv = rl.intervals;
  if (!iv.length) info = 'Closed loop is unstable for every gain multiplier k tested';
  else info = 'Closed loop stable for ' + iv.map(([a,b]) => (a <= 1e-9 ? '0' : fmt(a)) + ' < k' + (isFinite(b) ? ' < ' + fmt(b) : '')).join(' and ');
  const lines = ['Root locus of ' + r.sys.name, 'k multiplies the current loop gain (k = 1 is now)', info];
  ctx.font = '600 13px ' + FONT;
  const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 22;
  ctx.fillStyle = 'rgba(255,255,255,.94)'; ctx.strokeStyle = '#e2e8f0'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(A.x+10, A.y+10, w, 66, 8) : ctx.rect(A.x+10, A.y+10, w, 66); ctx.fill(); ctx.stroke();
  lines.forEach((l, i) => { ctx.fillStyle = i === 0 ? c : (i === 2 ? '#0f172a' : '#475569'); ctx.textAlign = 'left'; ctx.fillText(l, A.x+21, A.y+30+i*19); });
  legend(ctx, A, [{label:'Open-loop poles ×  zeros ○', color:'#0f172a'}, {label:'Closed-loop poles now', color:c}, {label:'Stability boundary', color:'#f59e0b'}]);
  if (hover){
    let best = null, bd = 12;
    rl.branches.forEach(b => b.forEach(p => { const d = Math.hypot(X(p.re) - hover.x, Y(p.im) - hover.y); if (d < bd){ bd = d; best = p; } }));
    if (best) tooltip(ctx, A, X(best.re), Y(best.im), ['k = ' + fmt(best.k, 4), 's = ' + cplx([best.re, best.im])], c);
  }
  $('#plotHint').textContent = 'Locus of 1 + k·L(s) = 0 for the selected system · Scroll: zoom · Drag: pan · Double-click: reset';
}

function drawRouth(){
  const box = $('#routh'), r = RES[S.sel];
  lastMap = null;
  if (!r || r.m.err){ box.innerHTML = '<h3>Routh–Hurwitz table</h3><p>Fix the selected system first.</p>'; return; }
  const m = r.m;
  const poly = m.closed ? m.char : m.Tf.d;
  const rt = routhTable(poly);
  let h = '<h3>Routh–Hurwitz table · <span style="color:' + r.sys.color + '">' + esc(r.sys.name) + '</span></h3>';
  h += '<div style="color:#475569;font-size:14px">' + (m.closed ? 'Characteristic polynomial 1 + L(s) = 0' : 'Denominator of the open-loop path') + (m.T > 0 ? ' (delay replaced by a 3rd-order Padé approximation)' : '') + '</div>';
  h += '<div class="poly">' + polyFmt(R.monic({n:[1], d:poly}).d, true) + ' = 0</div>';
  if (!rt){ box.innerHTML = h + '<p>No poles to test: the system is a pure gain.</p>'; return; }
  h += '<table><tr><th></th>' + rt.rows[0].map((_,j) => '<th>col ' + (j+1) + '</th>').join('') + '</tr>';
  rt.rows.forEach((row, i) => {
    h += '<tr><th>s' + (rt.n - i > 0 ? '<sup>' + (rt.n - i) + '</sup>' : '<sup>0</sup>') + '</th>';
    row.forEach((v, j) => {
      const show = Math.abs(v) < 1e-12 ? '0' : fmt(v, 4);
      h += '<td class="' + (j === 0 ? 'fc' + (v < 0 ? ' neg' : '') : '') + '">' + (j === 0 && rt.notes.some(n => n.row === i && n.kind === 'eps') ? 'ε' : show) + '</td>';
    });
    h += '</tr>';
  });
  h += '</table>';
  const ch = rt.changes;
  const allPos = rt.rows.every(rw => rw[0] > 0);
  h += '<div class="verdict" style="color:' + (ch ? '#dc2626' : (rt.notes.length ? '#b45309' : '#15803d')) + '">' +
    (ch ? ch + ' sign change' + (ch > 1 ? 's' : '') + ' in the first column → ' + ch + ' pole' + (ch > 1 ? 's' : '') + ' in the right half-plane: unstable' :
      (rt.notes.some(n => n.kind === 'aux') ? 'No sign changes, but a row of zeros: poles on the jω axis (marginally stable)' : (allPos ? 'No sign changes in the first column → all poles in the left half-plane: stable' : 'No sign changes'))) + '</div>';
  rt.notes.forEach(n => {
    if (n.kind === 'eps') h += '<div class="note">Row s<sup>' + (rt.n - n.row) + '</sup> started with 0, so it was replaced by a small positive ε to continue the table.</div>';
    if (n.kind === 'aux') h += '<div class="note">Row s<sup>' + (rt.n - n.row) + '</sup> was all zeros. It was replaced by the derivative of the auxiliary polynomial from the row above, which signals roots symmetric about the origin (often on the jω axis).</div>';
  });
  h += '<div class="note">The number of sign changes in the first (highlighted) column equals the number of closed-loop poles in the right half-plane. Compare with the pole list on the right.</div>';
  box.innerHTML = h;
}

/* plot interaction */
function paneAt(x, y){ if (!lastMap) return null; return lastMap.panes.find(p => x >= p.A.x && x <= p.A.x+p.A.w && y >= p.A.y && y <= p.A.y+p.A.h) || null; }
function zoomR(r, f, anchorFrac, log){
  if (log){ const a = Math.log10(r[0]), b = Math.log10(r[1]); const c = a + (b-a)*anchorFrac; return [Math.pow(10, c - (c-a)*f), Math.pow(10, c + (b-c)*f)]; }
  const c = r[0] + (r[1]-r[0])*anchorFrac; return [c - (c-r[0])*f, c + (r[1]-c)*f];
}
cv.addEventListener('wheel', ev => {
  const rect = cv.getBoundingClientRect(), x = ev.clientX - rect.left, y = ev.clientY - rect.top;
  const p = paneAt(x, y); if (!p) return;
  ev.preventDefault();
  const f = Math.exp(ev.deltaY*0.0016);
  const fx = (x - p.A.x)/p.A.w, fy = 1 - (y - p.A.y)/p.A.h;
  const t = lastMap.tab;
  if (t === 'time'){ const v = view.time || {}; if (ev.shiftKey) v.y = zoomR(p.yr, f, fy); else v.x = zoomR(p.xr, f, fx); view.time = v; }
  else if (t === 'pz' || t === 'rl') view[t] = {x:zoomR(p.xr, f, fx), y:zoomR(p.yr, f, fy)};
  else if (t === 'bode'){ const v = view.bode || {}; v.x = zoomR(p.xr, f, fx, true); if (ev.shiftKey && p === lastMap.panes[0]) v.m = zoomR(p.yr, f, fy); view.bode = v; }
  renderPlot();
}, {passive:false});
let pan = null;
cv.addEventListener('pointerdown', ev => {
  const rect = cv.getBoundingClientRect(), x = ev.clientX - rect.left, y = ev.clientY - rect.top;
  const p = paneAt(x, y); if (!p) return;
  pan = {x, y, p, tab:lastMap.tab}; cv.setPointerCapture(ev.pointerId);
});
cv.addEventListener('pointermove', ev => {
  const rect = cv.getBoundingClientRect(), x = ev.clientX - rect.left, y = ev.clientY - rect.top;
  if (pan && (Math.abs(x - pan.x) > 3 || Math.abs(y - pan.y) > 3 || pan.moved)){
    pan.moved = true;
    const p = pan.p, dx = (x - pan.x)/p.A.w, dy = (y - pan.y)/p.A.h;
    const shift = (r, d, log) => { if (log){ const a = Math.log10(r[0]), b = Math.log10(r[1]), s = (b-a)*d; return [Math.pow(10,a-s), Math.pow(10,b-s)]; } const s = (r[1]-r[0])*d; return [r[0]-s, r[1]-s]; };
    const t = pan.tab;
    if (t === 'time') view.time = {x:shift(p.xr, dx), y:shift(p.yr, -dy)};
    else if (t === 'pz' || t === 'rl') view[t] = {x:shift(p.xr, dx), y:shift(p.yr, -dy)};
    else if (t === 'bode'){ const v = view.bode || {}; v.x = shift(p.xr, dx, true); view.bode = v; }
    hover = null; renderPlot(); return;
  }
  hover = {x, y}; renderPlot();
});
cv.addEventListener('pointerup', () => { pan = null; });
cv.addEventListener('pointerleave', () => { if (!pan){ hover = null; renderPlot(); } });
cv.addEventListener('dblclick', () => { delete view[S.tab]; renderPlot(); });

function download(name, data, type){
  const blob = data instanceof Blob ? data : new Blob([data], {type});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
$('#fileMenu').addEventListener('click', ev => {
  const b = ev.target.closest('[data-f]'); if (!b) return;
  $$('.menu').forEach(x => x.classList.remove('open'));
  const f = b.dataset.f;
  if (f === 'png'){
    if (S.tab === 'routh'){ alert('The Routh table is text: switch to a plot tab to download an image.'); return; }
    hover = null; renderPlot(); cv.toBlob(bl => download('RIDE-control-' + S.tab + '.png', bl), 'image/png');
  }
  if (f === 'csv'){
    const vis = RES.filter(r => r.sys.visible && r.sim);
    if (!vis.length) return;
    const head = ['t'];
    vis.forEach(r => ['r','y','u','e'].forEach(k => head.push('"' + r.sys.name.replace(/"/g,'') + ' ' + k + '"')));
    const rows = [head.join(',')];
    const n = vis[0].sim.t.length;
    for (let i=0;i<n;i++){ const row = [vis[0].sim.t[i].toPrecision(6)]; vis.forEach(r => ['r','y','u','e'].forEach(k => row.push(isFinite(r.sim[k][i]) ? r.sim[k][i].toPrecision(7) : ''))); rows.push(row.join(',')); }
    download('RIDE-control-response.csv', rows.join('\n'), 'text/csv');
  }
  if (f === 'save') download('RIDE-control-setup.json', JSON.stringify(S, null, 2), 'application/json');
  if (f === 'load') $('#loadFile').click();
  if (f === 'reset'){ if (confirm('Reset the lab to its starting example?')){ S = defaultState(); for (const k in view) delete view[k]; closeEditor(); update(true); } }
});
$('#loadFile').addEventListener('change', ev => {
  const file = ev.target.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try { const s = JSON.parse(rd.result); if (!s || !Array.isArray(s.systems) || !s.systems.length) throw new Error('bad file'); S = Object.assign(defaultState(), s); for (const k in view) delete view[k]; closeEditor(); update(true); }
    catch(e){ alert('That file is not a saved Control Systems Lab setup.'); }
  };
  rd.readAsText(file); ev.target.value = '';
});

/* =========================================================
   Update loop
   ========================================================= */
let pending = false, pendingFull = false, pendingCtl = false;
function update(full, fromControls){
  pendingFull = pendingFull || full; pendingCtl = pendingCtl || !fromControls;
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => {
    pending = false;
    const doCtl = pendingCtl; pendingFull = false; pendingCtl = false;
    compute();
    renderSysbar(); renderDiagram(); renderAnalysis(); renderMetrics(); renderPlotTools(); renderPlot();
    if (doCtl) syncControls(); else { $('#simT').value = S.sim.tFinal; $('#simT').disabled = S.sim.auto; $('#refFreqRow').classList.toggle('hidden', !(S.ref.type === 'sine' || S.ref.type === 'square')); }
    refreshEditorPreview();
    saveState();
  });
}

})();

window.addEventListener('resize', () => renderPlot());
S = loadState();
renderPalette();
update(true);
</script>
