<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RAIN Semester Project Topics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#FFBE33;
  --gold-dim:#B8870E;
  --gold-pale:#FFE9B3;
  --black:#0A0B0F;
  --surface:#15161D;
  --surface-2:#1E1F29;
  --surface-3:#272834;
  --text:#F5F0E8;
  --text-dim:#9A9AA5;
  --text-faint:#5C5D68;
  --healthy:#4CAF6E;
  --moderate:#FFA53D;
  --severe:#FF5C5C;
  --foundational:#4CAF6E;
  --advanced:#FFBE33;
  --frontier:#FF5C5C;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{
  background:var(--black);
  color:var(--text);
  font-family:'Inter',sans-serif;
  height:100%;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body{
  display:flex;
  flex-direction:column;
  min-height:100vh;
  min-height:100dvh;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 20px;
  flex-shrink:0;
  z-index:50;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
}
.brand-mark{
  width:30px;height:30px;border-radius:8px;
  background:var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;font-size:15px;color:var(--black);
}
.brand-text{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;font-size:15px;letter-spacing:0.5px;color:var(--text);
}
.brand-sub{font-size:10px;color:var(--text-faint);letter-spacing:0.5px;margin-top:-2px;}
.progress-pill{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;color:var(--text-dim);
  background:var(--surface);
  padding:6px 12px;border-radius:20px;
  border:1px solid var(--surface-3);
}

.tracktabs{
  display:flex;
  gap:8px;
  padding:0 20px 14px;
  flex-shrink:0;
  overflow-x:auto;
  scrollbar-width:none;
}
.tracktabs::-webkit-scrollbar{display:none;}
.tracktab{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  white-space:nowrap;
  padding:7px 13px;
  border-radius:18px;
  border:1px solid var(--surface-3);
  background:var(--surface);
  color:var(--text-dim);
  cursor:pointer;
  transition:all 0.15s ease;
  flex-shrink:0;
}
.tracktab.active{
  background:var(--gold);
  border-color:var(--gold);
  color:var(--black);
  font-weight:500;
}

.deck-wrap{
  flex:1;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 16px 18px;
  overflow:hidden;
  min-height:0;
}

.deck{
  position:relative;
  width:100%;
  max-width:460px;
  height:100%;
  max-height:680px;
}

.card{
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  background:var(--surface);
  border-radius:22px;
  border:1px solid var(--surface-3);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  will-change:transform,opacity;
  touch-action:none;
}
.card-scroll{
  flex:1;
  overflow-y:auto;
  padding:24px 22px 22px;
  scrollbar-width:thin;
  scrollbar-color:var(--surface-3) transparent;
}
.card-scroll::-webkit-scrollbar{width:4px;}
.card-scroll::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:4px;}

.depth-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
}
.depth-gauge{
  width:38px;height:38px;
  position:relative;
  flex-shrink:0;
}
.depth-gauge svg{transform:rotate(-90deg);}
.depth-gauge-bg{fill:none;stroke:var(--surface-3);stroke-width:3.5;}
.depth-gauge-fill{fill:none;stroke-width:3.5;stroke-linecap:round;transition:stroke-dashoffset 0.6s ease;}
.depth-label-group{flex:1;}
.depth-tag{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  letter-spacing:1px;
  text-transform:uppercase;
  font-weight:500;
}
.depth-tag.foundational{color:var(--foundational);}
.depth-tag.advanced{color:var(--advanced);}
.depth-tag.frontier{color:var(--frontier);}
.track-tag{
  font-size:11px;color:var(--text-faint);margin-top:1px;
}
.card-index{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;color:var(--text-faint);
}

.card-title{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:23px;
  line-height:1.25;
  color:var(--text);
  margin-bottom:14px;
}

.card-desc{
  font-size:14.5px;
  line-height:1.6;
  color:var(--text-dim);
  margin-bottom:18px;
}

.expand-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  width:100%;
  padding:11px;
  background:var(--surface-2);
  border:1px solid var(--surface-3);
  border-radius:12px;
  color:var(--gold);
  font-size:12.5px;
  font-weight:500;
  font-family:'JetBrains Mono',monospace;
  cursor:pointer;
  margin-bottom:14px;
  transition:background 0.15s;
}
.expand-btn:active{background:var(--surface-3);}
.expand-btn .chev{
  transition:transform 0.25s ease;
  font-size:14px;
  line-height:1;
}
.expand-btn.open .chev{transform:rotate(180deg);}

.detail-panel{
  max-height:0;
  overflow:hidden;
  transition:max-height 0.35s ease;
}
.detail-panel.open{max-height:1400px;}
.detail-inner{padding-top:4px;padding-bottom:6px;}

.detail-block{margin-bottom:16px;}
.detail-label{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--gold-dim);
  margin-bottom:6px;
  display:flex;
  align-items:center;
  gap:6px;
}
.detail-text{
  font-size:13.5px;
  line-height:1.6;
  color:var(--text-dim);
}
.detail-block.deliverable{
  background:var(--surface-2);
  border-left:2px solid var(--gold);
  border-radius:0 10px 10px 0;
  padding:12px 14px;
}
.detail-block.deliverable .detail-text{color:var(--text);}
.skill-chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  background:var(--surface-2);
  border:1px solid var(--surface-3);
  color:var(--text-dim);
  padding:5px 10px;
  border-radius:14px;
}

.card-footer{
  flex-shrink:0;
  padding:14px 22px 18px;
  border-top:1px solid var(--surface-3);
  display:flex;
  gap:10px;
}
.pick-btn{
  flex:1;
  padding:13px;
  border-radius:14px;
  border:none;
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  transition:transform 0.1s, opacity 0.15s;
}
.pick-btn:active{transform:scale(0.97);}
.pick-yes{background:var(--gold);color:var(--black);}
.pick-skip{background:transparent;color:var(--text-faint);border:1px solid var(--surface-3);}

.swipe-hint{
  position:absolute;
  top:50%;
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:26px;
  padding:8px 18px;
  border-radius:10px;
  border:3px solid;
  transform:translateY(-50%) rotate(-12deg);
  opacity:0;
  pointer-events:none;
  z-index:5;
  letter-spacing:1px;
}
.swipe-hint.like{left:24px;color:var(--healthy);border-color:var(--healthy);}
.swipe-hint.skip{right:24px;color:var(--severe);border-color:var(--severe);transform:translateY(-50%) rotate(12deg);}

.bottombar{
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
  padding:6px 20px 22px;
}
.navbtn{
  width:52px;height:52px;
  border-radius:50%;
  background:var(--surface);
  border:1px solid var(--surface-3);
  color:var(--text-dim);
  font-size:20px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:transform 0.1s;
}
.navbtn:active{transform:scale(0.92);}
.navbtn.big{
  width:60px;height:60px;
  background:var(--gold);
  color:var(--black);
  font-size:24px;
}
.dots{
  display:flex;
  gap:5px;
  align-items:center;
}
.dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--surface-3);
  transition:all 0.2s;
}
.dot.active{background:var(--gold);width:16px;border-radius:3px;}

.empty-state{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100%;
  text-align:center;
  padding:40px 20px;
  color:var(--text-dim);
}
.empty-state h2{
  font-family:'Space Grotesk',sans-serif;
  color:var(--text);
  font-size:20px;
  margin-bottom:8px;
}
.empty-state p{font-size:13.5px;line-height:1.6;margin-bottom:20px;max-width:280px;}
.restart-btn{
  background:var(--gold);
  color:var(--black);
  border:none;
  padding:12px 24px;
  border-radius:14px;
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:13.5px;
  cursor:pointer;
}

.legend-row{
  display:flex;
  justify-content:center;
  gap:16px;
  padding:0 0 8px;
  flex-shrink:0;
}
.legend-item{
  display:flex;align-items:center;gap:5px;
  font-family:'JetBrains Mono',monospace;
  font-size:9.5px;
  color:var(--text-faint);
  text-transform:uppercase;
  letter-spacing:0.5px;
}
.legend-dot{width:6px;height:6px;border-radius:50%;}

@media (min-width:680px){
  .deck-wrap{padding:8px 16px 32px;}
  .deck{max-width:560px;max-height:560px;}
  .card-title{font-size:27px;}
  .card-desc{font-size:15.5px;}
  body{
    background:radial-gradient(circle at 50% 0%, #14151c 0%, var(--black) 65%);
  }
  .topbar,.tracktabs,.legend-row{max-width:680px;margin:0 auto;width:100%;}
  .bottombar{max-width:680px;margin:0 auto;width:100%;}
}
@media (min-width:1000px){
  .deck{max-width:520px;}
}
</style>
</head>

<script>
const tracks = JSON.parse(document.getElementById('track-data').textContent);
let activeTrackIdx = 0;
let cardIdx = 0;
let pickedTitles = new Set();
let skippedTitles = new Set();

const DEPTH_META = {
  foundational: {pct:33, color:'var(--foundational)', label:'Foundational'},
  advanced:     {pct:66, color:'var(--advanced)',      label:'Advanced'},
  frontier:     {pct:100,color:'var(--frontier)',      label:'Frontier'},
};

function renderTabs(){
  const wrap = document.getElementById('trackTabs');
  wrap.innerHTML = '';
  tracks.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'tracktab' + (i === activeTrackIdx ? ' active' : '');
    el.textContent = t.short;
    el.onclick = () => { activeTrackIdx = i; cardIdx = 0; renderTabs(); renderDeck(); };
    wrap.appendChild(el);
  });
}

function renderDots(){
  const projects = tracks[activeTrackIdx].projects;
  const wrap = document.getElementById('dots');
  wrap.innerHTML = '';
  const maxDots = 11;
  for(let i=0;i<Math.min(projects.length,maxDots);i++){
    const d = document.createElement('div');
    d.className = 'dot' + (i===cardIdx?' active':'');
    wrap.appendChild(d);
  }
}

function updateProgress(){
  let totalSeen = 0, totalAll = 0;
  tracks.forEach(t => totalAll += t.projects.length);
  pickedTitles.forEach(()=>totalSeen++);
  skippedTitles.forEach(()=>totalSeen++);
  document.getElementById('progressPill').textContent = (totalSeen+1) + ' / ' + totalAll;
}

function depthGaugeSVG(depth){
  const meta = DEPTH_META[depth] || DEPTH_META.advanced;
  const r = 15, c = 2*Math.PI*r;
  const offset = c - (meta.pct/100)*c;
  return `<div class="depth-gauge">
    <svg width="38" height="38" viewBox="0 0 38 38">
      <circle class="depth-gauge-bg" cx="19" cy="19" r="${r}"></circle>
      <circle class="depth-gauge-fill" cx="19" cy="19" r="${r}"
        stroke="${meta.color}"
        stroke-dasharray="${c}"
        stroke-dashoffset="${offset}"></circle>
    </svg>
  </div>`;
}

function buildCard(project, track, indexInTrack, total, zStack){
  const meta = DEPTH_META[project.depth] || DEPTH_META.advanced;
  const skills = project.skills_used.split(',').map(s=>s.trim()).filter(Boolean);
  const card = document.createElement('div');
  card.className = 'card';
  card.style.zIndex = zStack;
  card.innerHTML = `
    <div class="card-scroll">
      <div class="depth-row">
        ${depthGaugeSVG(project.depth)}
        <div class="depth-label-group">
          <div class="depth-tag ${project.depth}">${meta.label}</div>
          <div class="track-tag">${track.name}</div>
        </div>
        <div class="card-index">${indexInTrack+1}/${total}</div>
      </div>
      <div class="card-title">${project.title}</div>
      <div class="card-desc">${project.description}</div>
      <div class="expand-btn" data-action="expand">
        <span>SEE FULL TECHNICAL BRIEF</span>
        <span class="chev">&#9662;</span>
      </div>
      <div class="detail-panel">
        <div class="detail-inner">
          <div class="detail-block">
            <div class="detail-label">Skills this draws on</div>
            <div class="skill-chips">${skills.map(s=>`<span class="chip">${s}</span>`).join('')}</div>
          </div>
          <div class="detail-block deliverable">
            <div class="detail-label" style="color:var(--gold)">What you must actually show</div>
            <div class="detail-text">${project.deliverable}</div>
          </div>
          <div class="detail-block">
            <div class="detail-label">Why this is market-worthy</div>
            <div class="detail-text">${project.market_angle}</div>
          </div>
          <div class="detail-block">
            <div class="detail-label">Feasibility, one semester</div>
            <div class="detail-text">${project.feasibility}</div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-footer">
      <button class="pick-btn pick-skip" data-action="skip">Skip</button>
      <button class="pick-btn pick-yes" data-action="pick">Pick this</button>
    </div>
    <div class="swipe-hint like">PICK</div>
    <div class="swipe-hint skip">SKIP</div>
  `;
  return card;
}

let dragState = null;

function attachDrag(card, onResolve){
  let startX=0, startY=0, curX=0, curY=0, dragging=false;

  function pointerDown(e){
    const target = e.target.closest('[data-action]');
    if(target && target.dataset.action !== undefined && (target.classList.contains('pick-btn') || target.classList.contains('expand-btn'))){
      return;
    }
    if(e.target.closest('.card-scroll') && e.target.closest('.detail-panel.open')) return;
    dragging = true;
    startX = (e.touches ? e.touches[0].clientX : e.clientX);
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
    card.style.transition = 'none';
  }
  function pointerMove(e){
    if(!dragging) return;
    curX = (e.touches ? e.touches[0].clientX : e.clientX) - startX;
    curY = (e.touches ? e.touches[0].clientY : e.clientY) - startY;
    if(Math.abs(curX) < 8 && Math.abs(curY) < 8) return;
    const rot = curX/18;
    card.style.transform = `translate(${curX}px, ${curY*0.3}px) rotate(${rot}deg)`;
    const likeHint = card.querySelector('.swipe-hint.like');
    const skipHint = card.querySelector('.swipe-hint.skip');
    likeHint.style.opacity = Math.max(0, Math.min(1, curX/100));
    skipHint.style.opacity = Math.max(0, Math.min(1, -curX/100));
  }
  function pointerUp(){
    if(!dragging) return;
    dragging = false;
    card.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
    if(curX > 110){
      card.style.transform = `translate(600px, ${curY*0.3}px) rotate(20deg)`;
      card.style.opacity = '0';
      setTimeout(()=>onResolve('pick'), 250);
    } else if(curX < -110){
      card.style.transform = `translate(-600px, ${curY*0.3}px) rotate(-20deg)`;
      card.style.opacity = '0';
      setTimeout(()=>onResolve('skip'), 250);
    } else {
      card.style.transform = 'translate(0,0) rotate(0)';
      card.querySelector('.swipe-hint.like').style.opacity = 0;
      card.querySelector('.swipe-hint.skip').style.opacity = 0;
    }
    curX = 0; curY = 0;
  }

  card.addEventListener('mousedown', pointerDown);
  window.addEventListener('mousemove', pointerMove);
  window.addEventListener('mouseup', pointerUp);
  card.addEventListener('touchstart', pointerDown, {passive:true});
  card.addEventListener('touchmove', pointerMove, {passive:true});
  card.addEventListener('touchend', pointerUp);
}

function renderDeck(){
  const track = tracks[activeTrackIdx];
  const deck = document.getElementById('deck');
  deck.innerHTML = '';

  if(cardIdx >= track.projects.length){
    deck.innerHTML = `
      <div class="empty-state">
        <h2>That's every option in ${track.name}</h2>
        <p>You've picked ${[...pickedTitles].filter(t=>track.projects.some(p=>p.title===t)).length} project${[...pickedTitles].filter(t=>track.projects.some(p=>p.title===t)).length===1?'':'s'} from this track. Switch tracks above, or go again.</p>
        <button class="restart-btn" id="restartBtn">Review this track again</button>
      </div>`;
    document.getElementById('restartBtn').onclick = () => { cardIdx = 0; renderDeck(); };
    renderDots();
    return;
  }

  const visible = track.projects.slice(cardIdx, cardIdx+3);
  visible.forEach((p, i) => {
    const z = visible.length - i;
    const card = buildCard(p, track, cardIdx+i, track.projects.length, z);
    const scale = 1 - i*0.04;
    const yOff = i*10;
    card.style.transform = `translateY(${yOff}px) scale(${scale})`;
    card.style.opacity = i === 0 ? '1' : (i===1 ? '0.7' : '0.4');
    deck.appendChild(card);

    if(i === 0){
      const expandBtn = card.querySelector('.expand-btn');
      const panel = card.querySelector('.detail-panel');
      expandBtn.addEventListener('click', (e)=>{
        e.stopPropagation();
        panel.classList.toggle('open');
        expandBtn.classList.toggle('open');
        if(panel.classList.contains('open')){
          setTimeout(()=>{
            expandBtn.scrollIntoView({behavior:'smooth', block:'start'});
          }, 80);
        }
      });
      card.querySelector('[data-action="pick"]').addEventListener('click', (e)=>{
        e.stopPropagation();
        resolveCard('pick');
      });
      card.querySelector('[data-action="skip"]').addEventListener('click', (e)=>{
        e.stopPropagation();
        resolveCard('skip');
      });
      attachDrag(card, resolveCard);
    }
  });

  renderDots();
  updateProgress();

  function resolveCard(action){
    const p = track.projects[cardIdx];
    if(action === 'pick') pickedTitles.add(p.title);
    else skippedTitles.add(p.title);
    cardIdx++;
    renderDeck();
  }
}

document.getElementById('btnSkip').onclick = () => {
  const topCard = document.querySelector('.deck .card');
  if(!topCard) return;
  topCard.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
  topCard.style.transform = 'translate(-600px,0) rotate(-20deg)';
  topCard.style.opacity = '0';
  const track = tracks[activeTrackIdx];
  setTimeout(()=>{
    skippedTitles.add(track.projects[cardIdx].title);
    cardIdx++;
    renderDeck();
  }, 220);
};
document.getElementById('btnLike').onclick = () => {
  const topCard = document.querySelector('.deck .card');
  if(!topCard) return;
  topCard.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
  topCard.style.transform = 'translate(600px,0) rotate(20deg)';
  topCard.style.opacity = '0';
  const track = tracks[activeTrackIdx];
  setTimeout(()=>{
    pickedTitles.add(track.projects[cardIdx].title);
    cardIdx++;
    renderDeck();
  }, 220);
};

renderTabs();
renderDeck();
</script>
